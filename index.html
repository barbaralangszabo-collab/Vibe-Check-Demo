tné, megoszt egy mintát, amit tovább szeretne vinni, vagy amin változtatna.\n5. Feldolgozás: Melyik mintára vagy hálás? Melyiket szeretnéd megtörni? Mi segíthet ebben a következő években?", "caution": "A családról tisztelettel beszéljetek, ítélkezés nélkül. Ha valaki nehéz családi helyzetre utal, beszélj vele négyszemközt.", "variants": null}, {"id": "VC03-121", "theme_id": "t03", "name": "Kedvesen magammal", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "12", "description": "Kipróbáljuk az önegyüttérzés három lépését: észrevenni a fájdalmat, emlékezni, hogy nem vagyunk egyedül, és kedvesen szólni magunkhoz.", "tools": "A4-es lapok", "keywords": "önegyüttérzés, stressz, kudarc, kedvesség, önelfogadás", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mutasd be a három lépést: 1. Ez most nehéz. 2. Mások is átélnek ilyet. 3. Mit mondanék egy barátomnak ilyenkor?\n2. Mindenki felidéz egy kisebb, friss nehézséget (pl. rossz próbaérettségi, egy elutasítás).\n3. Írásban végigmegy a három lépésen, és ír magának egy rövid, kedves üzenetet.\n4. Egy perc csend, kéz a szívre, ha kényelmes, és az üzenet elolvasása magában.\n5. Feldolgozás: Milyen volt kedvesen szólni magadhoz? Miért könnyebb ezt másnak mondani? Mikor lesz erre szükséged a következő hónapokban?", "caution": "Ne erőltesd a kéz a szíven mozdulatot. Ha valakinek ez nagyon nehéz, mondd ki, hogy ez is rendben van.", "variants": null}, {"id": "VC03-122", "theme_id": "t03", "name": "Ha nagyon nehéz", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Mély", "grade": "12", "description": "Mindenki elkészíti a saját biztonsági tervét arra az esetre, ha egyszer nagyon nehéz időszakba kerülne: jelek, teendők, emberek, segítők.", "tools": "biztonsági terv sablon, segélyvonalak listája", "keywords": "biztonsági terv, mentális egészség, segítségkérés, krízis, önvédelem", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mondd el: ahogy van tűzriadó-tervünk, úgy jó, ha van tervünk a lelki nehézségekre is. Nem azért, mert baj van, hanem hogy legyen.\n2. Mindenki kitölti a sablont: Milyen jelekből veszem észre, hogy nagyon nehéz? Mit tehetek magamért? Kit hívhatok? Melyik szakemberhez fordulhatok? Hol vagyok biztonságban?\n3. Mutasd meg a segélyvonalak és az iskolai segítők elérhetőségét, és mindenki írja be a telefonjába.\n4. Beszéljétek meg: mit tegyünk, ha egy barátunkon látjuk ezeket a jeleket?\n5. Feldolgozás: Mi volt nehéz kitölteni? Hol tartod a tervet? Kinek mondanád el, hogy van ilyen terved?", "caution": "Ez érzékeny gyakorlat. Készülj fel rá, hogy valaki megnyílik. Egyeztess előre az iskolapszichológussal, és tudd, kihez irányíthatod a diákokat. Senkit ne kérj a terve megosztására.", "variants": null}, {"id": "VC04-121", "theme_id": "t04", "name": "Ki lettem?", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "12", "description": "Összehasonlítjuk, kik voltunk 7.-ben és kik vagyunk most: mi változott, mi maradt, és mire vagyunk büszkék.", "tools": "A4-es lapok két oszloppal", "keywords": "identitás, változás, fejlődés, önelfogadás, büszkeség", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mindenki két oszlopot ír: Én 7.-ben – Én most (érdeklődés, barátok, félelmek, álmok, erősségek).\n2. Bekarikázza, mi maradt ugyanaz, és aláhúzza a legnagyobb változást.\n3. Párban mesélnek egymásnak a legnagyobb változásról.\n4. Mindenki befejezi a mondatot: „Büszke vagyok arra, hogy…”\n5. Feldolgozás: Mi segített a legjobban felnőni ezekben az években? Mi az, amit a 7.-es éned nem hinne el rólad? Mit szeretnél megtartani magadból bárhová is mész?", "caution": "Ha valakinek nehéz évei voltak, ne erőltesd a pozitív keretet.", "variants": null}, {"id": "VC04-122", "theme_id": "t04", "name": "Értéktérkép felnőttként", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Mély", "grade": "12", "description": "Megnézzük, milyen értékek mentén szeretnénk élni felnőttként, és hogyan jelennek meg ezek a döntéseinkben (munka, pénz, kapcsolatok, szabadidő).", "tools": "értéklista, A3-as lapok", "keywords": "értékek, felnőttkor, döntések, életterület, egyensúly", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mindenki kiválaszt 5 értéket a listáról, ami a felnőtt életében a legfontosabb lesz.\n2. Megrajzolja az életterületeit (tanulás, munka, kapcsolatok, egészség, pénz, szabadidő), és mindegyikhez odaírja, melyik érték hogyan jelenik meg benne.\n3. Megkeresi, hol van ellentmondás (pl. fontos a szabadság, de csak a fizetés alapján választok egyetemet).\n4. Párban beszélgetnek egy ellentmondásról.\n5. Feldolgozás: Melyik értéked változott a legtöbbet az évek alatt? Milyen döntést hozol másképp, ha az értékeidre figyelsz? Mi az az érték, amit a csoporttól kaptál?", "caution": "Az értékek személyesek. Ne értékeld őket.", "variants": null}, {"id": "VC05-121", "theme_id": "t05", "name": "Interjú a szüleimmel", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "12", "description": "Megtervezünk egy beszélgetést a szüleinkkel vagy egy nagyszülővel arról, milyen volt nekik 18 évesnek lenni, és gyakoroljuk a mély meghallgatást.", "tools": "interjúkérdések, A4-es lapok", "keywords": "generációk, meghallgatás, család, felnőtté válás, interjú", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: mennyit tudtok arról, milyen volt a szüleitek élete 18 évesen?\n2. Kiscsoportok összegyűjtenek 8–10 kérdést (pl. Mitől féltél, amikor elballagtál? Mit csinálnál másképp? Mi volt a legjobb döntésed?).\n3. Párban gyakorolják az interjút: az egyik a szülő szerepében válaszol, a másik kérdez és tükröz, nem kommentál.\n4. Mindenki kiválasztja, kivel és mikor beszélget.\n5. Feldolgozás: Melyik kérdésre vagy a legkíváncsibb? Mi lehet nehéz ebben a beszélgetésben? Mit gondolsz, mit kapsz belőle?", "caution": "Nem mindenki él szüleivel, vagy nem mindenkinek biztonságos a beszélgetés. Ajánlj más felnőttet is (nagyszülő, rokon, edző, tanár).", "variants": null}, {"id": "VC06-121", "theme_id": "t06", "name": "Új közösségben", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "12", "description": "Végiggondoljuk, milyen lesz egy új közösségbe (egyetem, kollégium, munkahely) érkezni, és hogyan tudunk empatikusan kapcsolódni az új emberekhez.", "tools": "helyzetkártyák", "keywords": "empátia, új közösség, beilleszkedés, kapcsolódás, nyitottság", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: milyen volt 7.-ben ide érkezni? Mi segített beilleszkedni?\n2. Kiscsoportok kapnak egy helyzetet (pl. első nap a kollégiumban; új munkahely, ahol mindenki idősebb; egy csoport, ahol mindenki más országból jött).\n3. Megbeszélik: mit élhetnek át a többiek, akik szintén újak? Mi az a 3 kérdés vagy gesztus, ami gyorsan kapcsolatot teremt?\n4. Gyűjtsétek a táblára a „jó újonc” és a „jó befogadó” tippjeit.\n5. Feldolgozás: Mitől félsz a legjobban egy új közösségben? Mit tanultál itt, ami ott segíteni fog? Hogyan lehetsz te az, aki befogad valakit?", "caution": "Ha valaki szorong az elköltözés miatt, adj teret a félelmének.", "variants": null}, {"id": "VC07-121", "theme_id": "t07", "name": "Felnőtt ügyintézés", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "12", "description": "Gyakoroljuk, hogyan kommunikáljunk asszertíven felnőtt helyzetekben (ügyintézés, főbérlő, egyetemi tanulmányi osztály, munkáltató), írásban és szóban.", "tools": "helyzetkártyák, e-mail-sablon", "keywords": "asszertivitás, ügyintézés, e-mail, felnőtt kommunikáció, önérvényesítés", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: kinek írtatok már hivatalos e-mailt? Mi volt nehéz benne?\n2. Mutasd be egy jó hivatalos üzenet felépítését: megszólítás, a helyzet röviden, a kérés pontosan, határidő, udvarias zárás.\n3. Párban megírnak egy e-mailt egy helyzetre (pl. a főbérlő nem javítja meg a fűtést; hibás a tanulmányi rendszerben a jegyed; elmaradt a fizetésed).\n4. Egy másik helyzetet szóban, telefonbeszélgetésként játszanak el.\n5. Feldolgozás: Mi volt nehezebb: írásban vagy szóban? Mi segít, hogy határozott legyél, de ne udvariatlan? Melyik ügyet intézed el hamarosan?", "caution": "A sablonokat érdemes kiosztani, hogy hazavihessék.", "variants": null}, {"id": "VC08-121", "theme_id": "t08", "name": "Közös lakás", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "12", "description": "Lakótársi konfliktusokat oldunk meg előre: hogyan állapodjunk meg a közös térben, és mit tegyünk, ha valami nem működik.", "tools": "helyzetkártyák, lakótársi megállapodás-sablon", "keywords": "lakótárs, megállapodás, konfliktusmegelőzés, felelősség, közös tér", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: mi a leggyakoribb vita egy közös lakásban vagy kollégiumban? (Takarítás, zaj, vendégek, pénz, közös étel.)\n2. Kiscsoportok elkészítenek egy lakótársi megállapodást ezekre a témákra.\n3. Utána kapnak egy helyzetet (pl. a lakótársad sosem mosogat; minden hétvégén vendége van; nem fizeti a rezsit időben), és eljátsszák a megbeszélést.\n4. Megbeszélitek, mi segített a megoldásban.\n5. Feldolgozás: Miért jó előre megállapodni? Milyen lakótárs leszel te? Mi az, amiben nem engednél egy közös lakásban?", "caution": "A helyzetek legyenek könnyedek, humorral is kezelhetők.", "variants": null}, {"id": "VC08-122", "theme_id": "t08", "name": "Rendezetlen ügyek", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Mély", "grade": "12", "description": "Végiggondoljuk, van-e olyan konfliktus vagy sérelem az iskolai éveinkből, amit szeretnénk lezárni, mielőtt elmegyünk, és hogyan tehetjük meg.", "tools": "A4-es lapok, borítékok", "keywords": "lezárás, megbocsátás, bocsánatkérés, konfliktus, elengedés", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mondd el: a búcsú előtt jó lehet rendezni, ami még nyitva maradt. Ez lehet bocsánatkérés, egy köszönet, vagy csak az elengedés.\n2. Mindenki csendben végiggondolja: van-e valaki, akivel szeretne még tisztázni valamit?\n3. Ír egy levelet (nem kötelező elküldeni), vagy tervet készít: kivel, mikor, mit mondana.\n4. Párban, aki szeretné, gyakorolja a beszélgetés első mondatát.\n5. Feldolgozás: Mi tart vissza attól, hogy lezárj egy ügyet? Mit jelent számodra a megbocsátás? Mi az az egy lépés, amit a ballagásig megteszel?", "caution": "Senkit ne kérj meg, hogy nevezze meg, kivel van rendezetlen ügye. Ha osztályon belüli konfliktus kerül elő, kezeld óvatosan.", "variants": null}, {"id": "VC09-121", "theme_id": "t09", "name": "Ballagási projekt", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "12", "description": "Közösen megtervezünk egy projektet, amit a csoport hagy az iskolának (pl. egy fal, egy útmutató, egy esemény), szerepekkel és határidőkkel.", "tools": "flipchart, projektterv-sablon", "keywords": "projektmunka, csapat, szerepek, örökség, tervezés", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Gyűjtsetek ötleteket, mit hagyhatna a csoport az iskolának.\n2. Szavazással vagy konszenzussal válasszatok egyet.\n3. Bontsátok fel feladatokra, osszátok ki a szerepeket a csoporttagok erősségei szerint, és írjatok határidőket.\n4. Döntsétek el, hogyan követitek nyomon (pl. minden Csibe elején 5 perc).\n5. Feldolgozás: Milyen szerepet vállaltál, és miért? Mi lehet a legnagyobb akadály? Mire szeretnél emlékezni ebből a projektből?", "caution": "A projekt legyen megvalósítható a rendelkezésre álló időben. Egyeztesd az iskolavezetéssel.", "variants": null}, {"id": "VC10-121", "theme_id": "t10", "name": "Köszönőlevél egy tanárnak", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "12", "description": "Mindenki ír egy személyes köszönőlevelet egy tanárnak vagy iskolai dolgozónak, aki fontos volt neki az évek alatt.", "tools": "levélpapír, borítékok", "keywords": "hála, köszönet, tanárok, lezárás, kapcsolat", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: ki az a felnőtt az iskolában, aki valamit adott neked, és talán nem is tud róla?\n2. Mutasd be a jó köszönőlevél részeit: konkrét emlék, mit jelentett neked, mi lett belőle, egy kívánság.\n3. Mindenki megírja a levelét.\n4. Megbeszélitek, hogyan adják át (személyesen, a tanári postaládába, a ballagáson).\n5. Feldolgozás: Milyen volt felidézni ezt a felnőttet? Mit gondolsz, mit fog érezni, amikor elolvassa? Kinek köszönnél még meg valamit az életedben?", "caution": "Senkit ne kényszeríts arra, hogy egy tanárnak írjon; lehet edző, szülő vagy más felnőtt is.", "variants": null}, {"id": "VC10-122", "theme_id": "t10", "name": "Hat év mérlege", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Mély", "grade": "12", "description": "Visszatekintünk a hat évre: mit kaptunk a csoporttól és a Csibe-alkalmaktól, mit tanultunk egymástól, és mit adunk vissza.", "tools": "csomagolópapír, cetlik, idővonal a falon 7.-től 12.-ig", "keywords": "visszatekintés, értékelés, hála, közösség, lezárás", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Tegyétek ki az idővonalat a falra évfolyamonként.\n2. Mindenki cetlikre ír emlékeket, tanulságokat, vicces pillanatokat, és felragasztja a megfelelő évhez.\n3. Sétáljatok végig az idővonalon csendben, olvassátok el a cetliket.\n4. Mindenki befejezi a mondatot: „A Csibéből azt viszem magammal, hogy…”\n5. Feldolgozás: Melyik év volt a legfontosabb a csoportnak? Mit tanultál a legtöbbet egymástól? Mit üzennél a mostani 7.-eseknek a programról?", "caution": "Hagyj időt a nevetésre és a meghatódásra is. Ez az alkalom maradhat lazább.", "variants": null}, {"id": "VC12-121", "theme_id": "t12", "name": "Ha szétszéledünk", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "12", "description": "Végiggondoljuk, hogyan tarthatjuk életben a fontos barátságainkat, amikor mindenki más városba, egyetemre vagy országba megy.", "tools": "A4-es lapok", "keywords": "barátság, távolság, kapcsolattartás, változás, elköteleződés", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: kik azok a barátok, akiket mindenképp meg szeretnétek tartani?\n2. Kiscsoportok összegyűjtik a távolsági barátság nehézségeit (idő, új emberek, eltérő élet) és ötleteket ellene (rendszeres hívás, közös hagyomány, évente egy találkozó).\n3. Mindenki megtervez egy „barátsági szokást” egy fontos barátjával.\n4. Megbeszélik, mi a teendő, ha egy barátság mégis elhalványul.\n5. Feldolgozás: Mi a különbség a sok és a kevés, de mély kapcsolat között? Kinek írsz ma este? Mit szeretnél, hogy a barátaid tegyenek érted, ha messze leszel?", "caution": "Ha valaki egyedül marad a terveivel, figyelj rá.", "variants": null}, {"id": "VC12-122", "theme_id": "t12", "name": "Ismerkedés felnőttként", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Könnyű", "grade": "12", "description": "Gyakoroljuk, hogyan lehet új emberekkel megismerkedni egy új közegben: beszélgetést kezdeményezni, fenntartani és barátsággá alakítani.", "tools": "beszélgetésindító kártyák", "keywords": "ismerkedés, beszélgetés, kapcsolatépítés, bátorság, új közeg", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: hogyan ismerkedtetek meg a mostani barátaitokkal? Mennyire volt ez tudatos?\n2. Gyűjtsetek beszélgetésindítókat, amelyek nem kínosak (pl. közös helyzetre reagálni, segítséget kérni, kérdezni).\n3. „Speed dating” barátsági változatban: párok 2 percig beszélgetnek egy kártyáról, aztán továbblépnek.\n4. Megbeszélitek, mi tett egy beszélgetést jóvá, és hogyan lehet egy jó beszélgetésből második találkozás.\n5. Feldolgozás: Melyik beszélgetésindító működött a legjobban? Mi a legnehezebb neked az ismerkedésben? Mi lesz az első lépésed egy új közösségben?", "caution": "A csendesebb diákokat ne tedd ki nyomásnak. Mondd ki, hogy az introvertált ismerkedés is ismerkedés.", "variants": null}, {"id": "VC13-121", "theme_id": "t13", "name": "Képernyő és tanulás", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "12", "description": "Megtervezzük, hogyan használjuk a digitális eszközöket az érettségire és az egyetemre való felkészülésben úgy, hogy segítsenek és ne vegyék el a figyelmünket.", "tools": "A4-es lapok", "keywords": "digitális egyensúly, tanulás, fókusz, eszközök, szokások", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mindenki felírja, milyen digitális eszközöket használ a tanuláshoz, és melyik vonja el a figyelmét.\n2. Kiscsoportok összegyűjtik a legjobb tanulást segítő appokat és módszereket, és a legnagyobb időrablókat.\n3. Mindenki elkészíti a saját „digitális tanulási szabályzatát” (pl. fókuszmód, appkorlát, telefon a másik szobában).\n4. Párban megbeszélik, mi lesz a legnehezebb benne.\n5. Feldolgozás: Mi a legnagyobb digitális időrablód? Mi segít neked a legtöbbet? Mi lesz másképp az egyetemen, ahol senki nem figyel rád?", "caution": "Ne tiltásként mutasd be a digitális eszközöket. A cél a tudatos választás.", "variants": null}, {"id": "VC13-122", "theme_id": "t13", "name": "Ne dőlj be!", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "12", "description": "Megismerjük a leggyakoribb online csalásokat (adathalászat, hamis állás, befektetési csalás, zsarolás), és gyakoroljuk felismerni őket.", "tools": "kinyomtatott példaüzenetek (kitalált)", "keywords": "online biztonság, csalás, adathalászat, felnőttkor, óvatosság", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mutass 5–6 kitalált üzenetet (pl. „Nyertél egy iPhone-t!”, „Fizesd ki a csomagod szállítási díját”, „Könnyű pénz otthonról”, egy ismerős lnőtt kapcsolatokban.", "tools": "A3-as lapok, filcek", "keywords": "határok, önvédelem, kapcsolatok, asszertivitás, felnőttkor", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mutasd be a határok területeit: testi, érzelmi, idő, pénz, digitális.\n2. Mindenki megrajzolja a térképét: területenként mi rendben van, mi a szürke zóna, és mi a határ.\n3. Párban gyakorolják egy-egy határ kimondását (pl. „Ezt nem szeretném.” „Most nem érek rá.” „Pénzt nem adok kölcsön.”).\n4. Beszéljétek meg, mi történik, ha valaki rendszeresen átlépi a határainkat.\n5. Feldolgozás: Melyik területen a legnehezebb határt húznod? Kinél tartod a legkönnyebben a határaidat? Mit tennél, ha egy kapcsolatban folyamatosan átlépik őket?", "caution": "A testi határoknál légy tapintatos. Ha bántalmazásra utaló jel kerül elő, kezeld négyszemközt, szakember bevonásával.", "variants": null}, {"id": "VC15-121", "theme_id": "t15", "name": "Vizsganap-terv", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "12", "description": "Részletesen megtervezzük a vizsganapot és az előtte lévő estét: mit eszünk, mikor fekszünk, mit csinálunk, ha leblokkolunk.", "tools": "A4-es lapok", "keywords": "vizsga, stressz, tervezés, blokkolás, felkészülés", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: mi a legrosszabb, ami egy vizsganapon történhet veled? Gyűjtsétek a félelmeket névtelenül.\n2. Mindenki megtervezi a vizsga előtti estét és a vizsganapot óráról órára.\n3. Közösen összegyűjtitek, mit lehet tenni, ha a vizsgán leblokkolsz (légzés, egy könnyebb feladattal kezdeni, inni egy kortyot, felírni a kulcsszavakat).\n4. Mindenki felír magának egy „vizsgamondatot”, amit leblokkolás esetén mond magának.\n5. Feldolgozás: Melyik félelmed csökkent a terv után? Mi a te vizsgamondatod? Ki az, aki a vizsganapon szurkolhat neked?", "caution": "Ha valaki nagyon erős vizsgaszorongásról beszél, ajánld fel az iskolapszichológust.", "variants": null}, {"id": "VC15-122", "theme_id": "t15", "name": "Ha elfogy az energia", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Mély", "grade": "12", "description": "Megismerjük a kiégés és a túlterhelés korai jeleit, és tervet készítünk arra, hogyan előzzük meg az érettségi évben.", "tools": "jelek listája, A4-es lapok", "keywords": "kiégés, túlterhelés, energia, pihenés, megelőzés", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mutasd be a túlterhelés jeleit (állandó fáradtság, cinizmus, „minek”, alvászavar, elszigetelődés, gyakori betegség).\n2. Mindenki megjelöli magának, melyiket érezte az elmúlt hónapban (nem kell megosztani).\n3. Kiscsoportok összegyűjtik, mi tölt fel igazán (nem csak elvonja a figyelmet), és mi a különbség a pihenés és a görgetés között.\n4. Mindenki megírja az „energia-tervét”: heti pihenőidő, egy feltöltő tevékenység, egy ember, akinek szól, ha fogy az energia.\n5. Feldolgozás: Hol tartasz most az energiádat tekintve egy 1–10-es skálán? Mi az első jel nálad, hogy kezd elfogyni? Mit vállalsz a következő hétre?", "caution": "Ha valaki komoly kimerültségről vagy reménytelenségről beszél, beszélj vele négyszemközt, és irányítsd szakemberhez.", "variants": null}, {"id": "VC16-121", "theme_id": "t16", "name": "Több út", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "12", "description": "Megismerjük az érettségi utáni alternatív utakat (gap year, szakképzés, munka, külföld, halasztás), és oldjuk a „csak egy jó út van” nyomást.", "tools": "történetkártyák különböző életutakról", "keywords": "pályaválasztás, alternatívák, gap year, rugalmasság, döntés", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: kinek az az érzése, hogy ha most nem jól dönt, elrontja az életét?\n2. Kiscsoportok kapnak egy-egy életút-történetet (pl. valaki halasztott egy évet és dolgozott; valaki egyetemet váltott; valaki szakmát tanult, aztán egyetemre ment).\n3. Megbeszélik: mi volt jó ebben az útban? Mi volt nehéz? Mit tanulhatunk belőle?\n4. Gyűjtsétek a táblára, hány úton lehet eljutni ugyanoda.\n5. Feldolgozás: Mit változtat rajtad, hogy több jó út van? Melyik alternatívát érdemes végiggondolnod? Kivel beszélnél erről?", "caution": "Ne rangsorold az utakat. Figyelj azokra, akiknek a család nagyon szűk utat jelöl ki.", "variants": null}, {"id": "VC16-122", "theme_id": "t16", "name": "Első saját költségvetés", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Könnyű", "grade": "12", "description": "Elkészítjük egy kitalált első egyetemi vagy munkás hónap költségvetését, és megbeszéljük, milyen érzelmi döntések rejlenek a pénzügyekben.", "tools": "költségvetés-sablon, kitalált bevételek és kiadások", "keywords": "pénzügyi tudatosság, költségvetés, önállóság, döntés, felnőttkor", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Oszd ki a sablont egy kitalált bevétellel (pl. ösztöndíj + diákmunka) és listával a kiadásokról (albérlet, rezsi, étel, közlekedés, telefon, szórakozás).\n2. Párban elkészítik a hónap költségvetését úgy, hogy maradjon tartalék is.\n3. Adj egy váratlan helyzetet (pl. elromlik a laptop; meghívnak egy drága hétvégére). Mit tesznek?\n4. Beszéljétek meg, milyen érzések befolyásolják a pénzügyi döntéseket (FOMO, jutalmazás, szégyen).\n5. Feldolgozás: Mi lepett meg a költségvetésben? Milyen pénzügyi szokásokat láttál otthon, amit megtartanál vagy elhagynál? Mi az az egy dolog, amit már most elkezdenél?", "caution": "Légy tapintatos a családok anyagi helyzetével. A számok legyenek kitaláltak.", "variants": null}, {"id": "VC17-121", "theme_id": "t17", "name": "Búcsúkör", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Mély", "grade": "12", "description": "Az utolsó alkalmak egyikén mindenki kap egy kört, ahol a többiek elmondják, mit adott nekik az évek alatt.", "tools": "egy szék a kör közepén vagy egy tárgy, ami körbejár", "keywords": "búcsú, const theme = id => S.themes.find(t => t.id === id) || { name:'?', color:'#7B2A82' };

const prsOf = aid => S.links.filter(l => l.activity_id === aid).map(l => S.prs.find(p => p.id === l.printable_id)).filter(Boolean);
const tIdx = t => TYPES.indexOf(t) + 1;
const dIdx = d => DEPTHS.indexOf(d) + 1;
const range = g => { const m = String(g || '').match(/(\d+)\D+(\d+)/); if (m) return [+m[1], +m[2]]; const one = String(g || '').match(/^\s*(\d+)\s*$/); return one ? [+one[1], +one[1]] : [7, 12]; };
const spec = a => { const [lo, hi] = range(a.grade); return hi - lo; };
const byFlow = (a, b) => a.type_order - b.type_order || spec(a) - spec(b) || a.id.localeCompare(b.id, 'hu', { numeric:true });
const viewGrade = () => (S.tg && S.tg !== 'all') ? S.tg : (curG() ? curG().grade : 0);
function lessonOf(tid, grade){ const all = S.acts.filter(a => a.theme_id === tid && inRange(a.grade, grade)).sort(byFlow); const seen = new Set(); return all.filter(a => { if (seen.has(a.type_order)) return false; seen.add(a.type_order); return true; }); }
const inRange = (r, grade) => { if (!grade) return true; const [lo, hi] = range(r); return grade >= lo && grade <= hi; };
const themeFits = (t, grade) => inRange(t.grades || '7–12', grade);
const gThemes = grade => S.themes.filter(t => themeFits(t, grade));
const bandLabel = r => String(r || '7–12') === '7–12' ? '' : (String(r).includes('–') ? r + '. évfolyam' : r + '. évfolyam');
function variantFor(a, grade){ const v = a.variants || {}; const k = Object.keys(v).find(b => inRange(b, grade)); return k ? { band:k, text:v[k] } : null; }

const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const fmtShort = s => { const [, m, d] = s.split('-'); return `${+m}.${+d}.`; };
const fmtLong = s => new Date(s + 'T12:00:00').toLocaleDateString('hu-HU', { year:'numeric', month:'long', day:'numeric' });
const MONTHS = ['január','február','március','április','május','június','július','augusztus','szeptember','október','november','december'];
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'id-' + Date.now() + Math.random().toString(16).slice(2);
const group = id => S.groups.find(g => g.id === id) || (/^adm-(\d+)$/.test(id || '') && S.admin ? { id, name:'Admin', grade:+id.slice(4), virtual:true } : undefined);
const curG = () => group(S.gid) || null;
const byDate = (a, b) => a.date.localeCompare(b.date) || String(a.created_at || '').localeCompare(String(b.created_at || ''));
const sessOf = gid => S.sessions.filter(x => gid === '*' || x.group_id === gid).sort(byDate);
const plansOf = grade => S.plans.filter(p => grade === '*' || p.grade === grade).sort(byDate);
/* A csoport "története": az évfolyam közös tervei + a csoport saját, terven kívüli foglalkozásai.
   Ebből számol a haladás és a javaslat, így az évfolyam 4 csoportja együtt halad. */
function hist(gid){
  if (gid === '*') return [...S.plans, ...S.sessions.filter(x => !x.plan_id)].sort(byDate);
  const g = group(gid); if (!g) return [];
  return [...plansOf(g.grade), ...sessOf(gid).filter(x => !x.plan_id)].sort(byDate);
}
function usedDates(aid){ const g = curG(); return g ? sessOf(g.id).filter(x => x.items.includes(aid)).map(x => x.date) : []; }
function progress(gid, tid){
  const gg = group(gid), gr = gg ? gg.grade : 0;
  const all = S.acts.filter(a => a.theme_id === tid && (!gg || inRange(a.grade, gr)));
  const used = new Set(hist(gid).flatMap(x => x.items));
  const total = Math.min(all.length, lessonOf(tid, gr).length || all.length);
  return { done: Math.min(total, all.filter(a => used.has(a.id)).length), total };
}
function sessionTheme(sess){
  const c = {}; sess.items.forEach(id => { const a = act(id); if (a) c[a.theme_id] = (c[a.theme_id] || 0) + 1; });
  return Object.keys(c).sort((a, b) => c[b] - c[a])[0] || null;
}
const themeSessions = (gid, tid) => hist(gid).filter(x => sessionTheme(x) === tid).length;
function currentTheme(gid){ const ss = hist(gid); return ss.length ? sessionTheme(ss[ss.length - 1]) : null; }
const myDone = (planId, gid) => S.sessions.find(x => x.plan_id === planId && x.group_id === gid);
const myGroupFor = grade => { const g = curG(); return g && g.grade === grade ? g : S.groups.find(x => x.grade === grade && (!S.user || !x.owner_email || x.owner_email === S.user.email)) || null; };
/* Ki tartotta már meg az évfolyam-tervet? (megjegyzések nélkül) */
function planStatus(p){
  const m = new Map();
  (S.peer[p.grade] || []).forEach(r => {
    if (!m.has(r.group_id)) m.set(r.group_id, { id:r.group_id, name:r.group_name, email:r.owner_email, done:null });
    if (r.plan_id === p.id) m.get(r.group_id).done = r.done_date;
  });
  S.groups.filter(g => g.grade === p.grade).forEach(g => {
    const x = m.get(g.id) || { id:g.id, name:g.name, email:g.owner_email, done:null };
    const d = myDone(p.id, g.id); x.done = d ? d.date : (m.has(g.id) ? x.done : null); m.set(g.id, x);
  });
  return [...m.values()].sort((a, b) => a.name.localeCompare(b.name, 'hu'));
}
function statusChips(p){
  const me = myGroupFor(p.grade);
  return `<div class="status">${planStatus(p).map(x => `<span class="st ${x.done ? 'ok' : ''} ${me && me.id === x.id ? 'me' : ''}" title="${esc(x.email || '')}">${x.done ? '✓ ' : (gDot(x.name) ? '' : '○ ')}${gDot(x.name)}${esc(x.name)}</span>`).join('')}</div>`;
}

/* Javaslat: maradjatok egy témánál, amíg a gyakorlatok nagy részét el nem végeztétek; utána a sorban következő téma jön. */
function suggestion(gid, budget){
  const g = group(gid), ss = hist(gid);
  let tid, reason;
  const TH = gThemes(g && g.grade);
  if (!ss.length){ tid = TH[0].id; reason = 'start'; }
  else {
    const cur = currentTheme(gid), p = progress(gid, cur);
    if (p.done < p.total){ tid = cur; reason = 'continue'; }
    else {
      const i = TH.findIndex(t => t.id === cur);
      const order = i < 0 ? TH : [...TH.slice(i + 1), ...TH.slice(0, i)];
      const nx = order.find(t => { const q = progress(gid, t.id); return q.done < q.total; });
      tid = nx ? nx.id : cur; reason = nx ? 'next' : 'done';
    }
  }
  const fits = a => { if (!g || !g.grade) return true; const [lo, hi] = range(a.grade); return g.grade >= lo && g.grade <= hi; };
  const all = S.acts.filter(a => a.theme_id === tid && fits(a)).sort(byFlow);
  const used = new Set(ss.flatMap(x => x.items));
  const seq = all.filter(a => !used.has(a.id) && a.type !== 'Lezárás');
  const pick = []; let sum = 0, over = false;
  for (const a of seq){ if (sum + a.minutes <= budget){ pick.push(a); sum += a.minutes; } else break; }
  if (!pick.length && seq.length){ pick.push(seq[0]); sum = seq[0].minutes; over = sum > budget; }
  const closing = all.find(a => a.type === 'Lezárás');
  if (closing && !pick.includes(closing) && !(used.has(closing.id) && ONCE.has(closing.id)) && sum + closing.minutes <= budget){ pick.push(closing); sum += closing.minutes; }
  const opening = all.find(a => a.type === 'Ráhangolódás');
  if (opening && !pick.includes(opening) && !(used.has(opening.id) && ONCE.has(opening.id)) && sum + opening.minutes <= budget){ pick.unshift(opening); sum += opening.minutes; }
  return { tid, reason, items:pick, sum, over, used, p:progress(gid, tid), n:themeSessions(gid, tid) + 1, prev: ss.length ? currentTheme(gid) : null };
}

  const G = {
    9:  ['Kék', ['Zöld','Piros','Sárga'], [[21,'Ismerkedés és szabályok',['VC01-1','VC01-2','VC01-8']],[14,'Csoportszerződés',['VC01-9','VC01-5']],[7,'Érzelmek felismerése',['VC02-1','VC02-2','VC02-8']],[-7,'Vegyes érzelmek',['VC02-9','VC02-5']]]],

    8:  ['Kék', ['Zöld','Piros','Sárga'], [[28,'Ismerkedés',['VC01-1','VC01-2','VC01-3']],[21,'Csoportszerződés',['VC01-4','VC01-5']],[14,'Érzelmek felismerése',['VC02-1','VC02-2']],[7,'Érzelemkerék',['VC02-3','VC02-5']],[-7,'Testtérkép',['VC02-4']]]],

    11: ['Kék', ['Zöld','Piros','Sárga'], [[35,'Szabályok',['VC01-2','VC01-10','VC01-11']],[28,'Érzelmek',['VC02-1','VC02-10','VC02-5']],[21,'Érzelemszabályozás',['VC03-1','VC03-2','VC03-10']],[14,'Mi segít, mi árt?',['VC03-11','VC03-5']],[7,'Stressz és vizsgák',['VC15-1','VC15-2','VC15-3']],[-7,'Gondolatcsapdák',['VC15-4','VC15-5']]]],
    12: ['Kék', ['Zöld','Piros','Sárga'], [[42,'Utolsó évünk megállapodása',['VC01-1','VC01-2','VC01-121','VC01-5']],[35,'Vegyes érzések a végén',['VC02-1','VC02-2','VC02-121','VC02-5']],[28,'Az érzelmi mintáim',['VC02-1','VC02-122','VC02-5']],[21,'Kedvesen magammal',['VC03-1','VC03-2','VC03-121','VC03-5']],[14,'Ha nagyon nehéz',['VC03-1','VC03-122','VC03-5']],[7,'Vizsganap-terv',['VC15-1','VC15-2','VC15-121','VC15-5']],[-7,'Ha elfogy az energia',['VC15-1','VC15-122','VC15-5']]]]
  };
  const NOTES = ['Jó hangulat, mindenki bekapcsolódott.', 'Kicsit nehezen indult, de a végére belejöttek.', 'Ezt érdemes lesz megismételni.', ''];
  const groups = [], plans = [], sessions = [], peer = {};
  let pi = 0;
  Object.entries(G).forEach(([gr, [mine, others, pls]]) => {
    gr = +gr;
    const g = { id:'demo-' + gr, name:mine, grade:gr, owner_email:'demo@iskola.hu' }; groups.push(g);
    // a demó tanéve szeptember elején indul: minden téma minden Csibéje benne van, a szünetek kimaradnak
    const TH = gThemes(gr), lessons = [];
    TH.forEach(t => { const ch = chunksFull(t.id, gr); ch.forEach((items, k) => lessons.push({ title: t.name + (ch.length > 1 ? ` (${k + 1}/${ch.length})` : ''), items })); });
    const BR = [['2026-10-23', '2026-11-01'], ['2026-12-14', '2026-12-19'], ['2026-12-19', '2027-01-03'], ['2027-03-03', '2027-03-07'], ['2027-03-25', '2027-04-06'], ['2027-05-03', '2027-05-07']];
    const END = gr === 12 ? '2027-04-30' : '2027-06-16', ps = [];
    for (let w = new Date('2026-09-02T12:00'), li = 0; li < lessons.length && ymd(w) <= END; w.setDate(w.getDate() + 7)){
      const k = ymd(w); if (BR.some(([x, y]) => k >= x && k <= y)) continue;
      ps.push({ id:`pl${gr}-${li + 1}`, grade:gr, date:k, title:lessons[li].title, items:lessons[li].items, created_email:'ütemterv', created_at:'2026-08-31' }); li++;
    }
    plans.push(...ps);
    const past = ps.filter(p => p.date < today());
    if (past.length){ const lp = past[past.length - 1]; const nx = ps.find(x => x.date > lp.date), fut = new Set(ps.filter(x => x.date > lp.date).flatMap(x => x.items)), mains = S.acts.filter(a => a.type === 'Fő gyakorlat' && inRange(a.grade, gr) && !fut.has(a.id) && !ps.some(x => x !== lp && x.date < lp.date && x.items.includes(a.id))); const m = mains.find(a => a.theme_id === sessionTheme(lp)) || mains.find(a => a.theme_id === (nx && sessionTheme(nx))) || mains[0]; lp.items = lp.items.filter(id => act(id)?.type !== 'Fő gyakorlat'); if (m) lp.items.splice(1, 0, m.id); }
    past.forEach((p, n) => sessions.push({ id:uid(), group_id:g.id, date:p.date, title:p.title, note:NOTES[n % NOTES.length], items:(n === past.length - 1 ? p.items.filter(id => act(id)?.type !== 'Fő gyakorlat') : [...p.items]), plan_id:p.id, owner_email:g.owner_email, created_at:p.date }));
    peer[gr] = [];
    others.forEach((name, n) => {
      const email = PEOPLE[pi++ % PEOPLE.length] + '@iskola.hu', id = `g${gr}-${n}`;
      peer[gr].push({ group_id:id, group_name:name, owner_email:email, plan_id:null, done_date:null });
      past.slice(0, past.length - (n === 1 ? 1 : 0)).forEach(p => peer[gr].push({ group_id:id, group_name:name, owner_email:email, plan_id:p.id, done_date:p.date }));
    });
  });
  return { groups, plans, peer, sessions };
}

const BANDS = [['7–8', 7, 8], ['9–10', 9, 10], ['11–12', 11, 12]];
const bandOf = g => (BANDS.find(b => g >= b[1] && g <= b[2]) || [''])[0];
const myFb = (sid, aid) => S.fb.find(x => x.session_id === sid && x.activity_id === aid);
function fbStats(aid, band){
  const rows = S.fb.filter(x => x.activity_id === aid && (!band || bandOf(x.grade) === band));
  const n = rows.length, g = rows.filter(x => x.rating === 3).length, y = rows.filter(x => x.rating === 2).length, r = rows.filter(x => x.rating === 1).length;
  const tips = rows.filter(x => x.tip).sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)));
  return { n, g, y, r, pct: n ? Math.round((g + y * 0.5) / n * 100) : 0, tips };
}

function tokens(q){ return norm(q).split(/\s+/).filter(w => w.length > 1); }
function termsFor(tok){
  const out = [tok];
  for (const k in SYN) if (tok.startsWith(norm(k).slice(0, Math.max(4, Math.min(tok.length, norm(k).length))))) out.push(...SYN[k].map(norm));
  // magyar ragok: a szó elejére is keresünk (konfliktusokrol → konfliktus)
  if (tok.length > 5) out.push(tok.slice(0, Math.max(5, tok.length - 3)));
  return out;
}
function filtered(){
  let qs = S.q; let qMax = 0;
  const mm = qs.match(/(\d+)\s*(perc|p|′|')(?!\w)/i);
  if (mm){ qMax = +mm[1]; qs = qs.replace(mm[0], ' '); }
  const toks = tokens(qs);
  const f = S.f;
  let list = S.acts.filter(a => {
    if (f.theme && a.theme_id !== f.theme) return false;
    if (f.type.length && !f.type.includes(a.type)) return false;
    if (f.max && a.minutes !== f.max) return false;
    if (qMax && a.minutes > qMax) return false;
    if (f.depth.length && !f.depth.includes(a.depth)) return false;
    if (f.grade){ const [lo, hi] = range(a.grade); if (f.grade < lo || f.grade > hi) return false; }
    if (f.notools && (a.tools || prsOf(a.id).length)) return false;
    if (f.unused && usedDates(a.id).length) return false;
    if (f.proven){ const st = fbStats(a.id); if (st.n < 3 || st.pct < 75) return false; }
    return toks.every(t => termsFor(t).some(x => a._hay.includes(x)));
  });
  if (toks.length){
    const score = a => toks.reduce((s, t) => s + (a._name.includes(t) ? 3 : 0) + (termsFor(t).some(x => a._name.includes(x)) ? 1 : 0), 0);
    list.sort((a, b) => score(b) - score(a) || a.id.localeCompare(b.id));
  }
  return list;
}
const filtersActive = () => { const f = S.f; return !!(f.theme || f.type.length || f.max || f.depth.length || f.grade || f.notools || f.unused || f.proven); };

/* Ha egy kép elsőre nem töltődik be (pl. sok kép egyszerre), még kétszer újrapróbáljuk, csak utána jön a helyőrző. */
/* Ha a fájlok mappák nélkül kerültek fel (pl. GitHubra egy halomban), a képeket a gyökérben is megkeressük. */
const FLAT_RE = /(^|\/|,\s*)(?:tema-fotok|hangulat|nyomtatnivalok\/elonezet|nyomtatnivalok|elonezet)\//g;
const flatten = u => String(u || '').replace(FLAT_RE, '$1');
function tryFlat(img){
  if (img.dataset.flat) return false;
  const src = img.getAttribute('src') || '', ss = img.getAttribute('srcset') || '';
  const ns = flatten(src), nss = flatten(ss);
  if (ns === src && nss === ss) return false;
  img.dataset.flat = '1'; if (ss) img.setAttribute('srcset', nss); img.setAttribute('src', ns); return true;
}
document.addEventListener('error', e => { const t = e.target; if (t && t.tagName === 'IMG' && !t.hasAttribute('onerror')) tryFlat(t); }, true);
(() => { const p = new Image(); p.onerror = () => { const q = new Image(); q.onload = () => { DEMO_PDF_BASE = ''; }; q.src = '01_Onertekelo_kerdoiv-1.webp'; }; p.src = 'nyomtatnivalok/elonezet/01_Onertekelo_kerdoiv-1.webp'; })();
window.vcImgErr = img => {
  if (tryFlat(img)) return;
  const n = +(img.dataset.retry || 0);
  if (n < 4){
    img.dataset.retry = n + 1;
    setTimeout(() => {
      const bust = u => u.replace(/\?r=\d+/g, '').replace(/(\.webp|\.jpe?g)/gi, `$1?r=${Date.now()}`);
      if (img.srcset) img.srcset = bust(img.srcset);
      img.src = bust(img.src);
    }, 900 * (n + 1) + Math.random() * 600);
    return;
  }
  // csak a nagy témafotóknál (.photo) mutatunk feliratot; máshol a keret saját színes háttere marad
  if (img.parentElement && img.parentElement.classList.contains('photo')) img.replaceWith(Object.assign(document.createElement('div'), { className:'ph', innerHTML:'<b>Fotó</b><small>A kép most nem töltődött be.</small>' }));
  else img.remove();
};

function nextPlan(){ const g = curG(); return g ? plansOf(g.grade).find(p => p.date >= today() && !planStatus(p).some(x => x.done)) || null : null; }
function addBtn(aid, wide){
  if (!S.cart.editPlan && !canEdit()) return '';
  if (S.cart.editPlan){ const on = S.cart.items.includes(aid); return wide ? `<button class="btn ghost" data-add="${aid}">${on ? '✓ Benne van a Csibében' : '+ Hozzáadás a Csibéhez'}</button>` : `<button class="add ${on ? 'on' : ''}" data-add="${aid}" aria-label="Hozzáadás a Csibéhez">${on ? '✓' : '+'}</button>`; }
  const np = nextPlan(), on = np && np.items.includes(aid), lbl = np ? `Csibe · ${csibeDate(np.date)}` : '';
  return wide ? `<button class="btn ghost" data-addnext="${aid}" ${on || !np ? 'disabled' : ''}>${on ? `✓ Benne van: ${lbl}` : np ? `+ Betesszük a következő Csibébe (${csibeDate(np.date)})` : 'Nincs következő Csibe'}</button>`
    : `<button class="add ${on ? 'on' : ''}" data-addnext="${aid}" aria-label="${on ? 'Benne van a következő Csibében' : 'A következő Csibébe'}" title="${on ? 'Benne van: ' + lbl : np ? 'A következő Csibébe: ' + lbl : ''}">${on ? '✓' : '+'}</button>`;
}
async function addToNext(aid){
  const np = nextPlan(); if (!np) return toast('Nincs következő Csibe-alkalom.');
  if (np.items.includes(aid)) return toast(`Már benne van: Csibe · ${csibeDate(np.date)}`);
  if (np.items.reduce((s, x) => s + (act(x)?.minutes || 0), 0) + act(aid).minutes > MAXCSIBE) return toast(`Nem fér bele: egy Csibe legfeljebb ${MAXCSIBE} perces.`);
  try {
    const items = [...np.items, aid];
    await LOG.delPlan(np.id); await LOG.addPlan(np.grade, np.date, np.title, items);
    const mins = items.reduce((s, x) => s + (act(x)?.minutes || 0), 0);
    if ($('#dlg').open) $('#dlg').close();
    render(); toast(`Bekerült a Csibébe (${csibeDate(np.date)}), most ${mins} perces.`);
  } catch (e){ toast('Hiba: ' + (e.message || e)); }
}
function aCard(a, opts = {}){
  const t = theme(a.theme_id), on = S.cart.items.includes(a.id);
  return `<article class="acard ${S.f && S.f.max === a.minutes ? 'tint m' + a.minutes : ''}" style="--c:${t.color}" data-open="${a.id}" tabindex="0">
    ${opts.noTheme ? '' : `<div class="th"><span class="dot"></span>${esc(t.name)}</div>`}
    <h3>${esc(a.name)}</h3>
    <p>${esc(a.description)}</p>
    <div class="row">${minTag(a.minutes)}${a.grade !== '7–12' ? `<span class="tag band-t">${esc(a.grade)}. évf.</span>` : ''}${(() => { const st = fbStats(a.id); return st.n >= 3 ? `<span class="tag ok" title="${st.n} patrónusi értékelés">👍 ${st.pct}%</span>` : ''; })()}${(() => { const u = usedDates(a.id); return u.length ? `<span class="tag used" title="Használtátok: ${u.map(fmtShort).join(', ')}">✓ ${fmtShort(u[u.length - 1])}${u.length > 1 ? ' +' + (u.length - 1) : ''}</span>` : ''; })()}</div>
    ${addBtn(a.id, false)}
  </article>`;
}

function chip(label, pressed, attrs){ return `<button class="chip" aria-pressed="${pressed}" ${attrs}>${label}</button>`; }

function filterPanel(showTheme){
  const f = S.f;
  return `<aside class="filters ${S.filtersOpen ? 'open' : ''}" aria-label="Szűrők">
    ${showTheme ? `<h4>Témakör</h4><select id="fTheme"><option value="">Mind a ${S.themes.length} téma</option>${S.themes.map(t => `<option value="${t.id}" ${f.theme === t.id ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</select>` : ''}
    <h4>Gyakorlat hossza</h4><div class="opts">${[[0,'Mind'],[10,'10 perc'],[15,'15 perc'],[25,'25 perc'],[30,'30 perc']].map(([v, l]) => `<button class="chip dur ${v ? 'm' + v : ''}" aria-pressed="${f.max === v}" data-max="${v}">${l}</button>`).join('')}</div>
    <h4>Évfolyam</h4><div class="opts">${chip('Mind', !f.grade, 'data-grade="0"')}${[7,8,9,10,11,12].map(g => chip(g + '.', f.grade === g, `data-grade="${g}"`)).join('')}</div>
    ${filtersActive() ? `<button class="btn ghost sm reset" id="fReset">Szűrők törlése</button>` : ''}
  </aside>`;
}


function nextPlanCard(){
  const g = curG(); if (!g) return '';
  const plans = plansOf(g.grade), np = plans.find(p => p.date >= today());
  const missing = plans.filter(p => p.date < today() && !myDone(p.id, g.id));
  if (!np && !missing.length) return '';
  const remind = missing.length ? `<div class="remind">${missing.length} korábbi Csibénél még nem jelölted, hogy megtartottátok. <button id="calOpen4">Megnézem a naptárban</button></div>` : '';
  if (!np) return `<section class="np" style="grid-template-columns:1fr"><div><div class="eyebrow">${g.grade}. évfolyam</div><h2>Nincs betervezve a következő Csibe</h2><p>Az alábbi javaslatot egy kattintással betervezheted az egész évfolyamnak.</p>${remind}</div></section>`;
  const done = myDone(np.id, g.id);
  let clock = 0;
  const list = np.items.map(id => act(id)).filter(Boolean).map(a => { const from = clock; clock += a.minutes; return `<button class="sg-it" data-open="${a.id}"><span class="t">${from}′</span><span><b>${esc(a.name)}</b><small>${a.minutes} perc · ${esc(a.type)}</small></span><span></span></button>`; }).join('');
  const npt = theme(sessionTheme(np));
  return `<section class="np">
    <div>
      ${npt && npt.photo_url ? `<div class="sg-photo np-photo">${photo(npt)}</div>` : ''}
      <div class="eyebrow">A ${g.grade}. évfolyam következő Csibéje · ${fmtLong(np.date)}</div>
      <h2>${esc(np.title || theme(sessionTheme(np)).name)}</h2>
      <p>Mind a 4 patrónus ugyanezt tartja. Ki tartotta már meg:</p>
      ${statusChips(np)}
      ${done ? `<p style="margin-top:10px;color:var(--green)"><b>✓ ${esc(g.name)}: megtartottátok (${fmtShort(done.date)})</b></p>${fbEditor(done)}` : ''}
      ${remind}
    </div>
    <div>
      <div class="sg-list">${list}</div>
      <div class="sg-btns">${done ? '' : `<button class="btn pri" data-run="plan:${np.id}">▶ Gyakorlat</button><button class="btn ghost" data-done="${np.id}">✓ Megtartottuk</button>`}<button class="btn ghost" data-prep="plan:${np.id}">🧰 Előkészítés és nyomtatás</button>${canEdit() ? `<button class="btn ghost" data-planedit="${np.id}">✏️ Módosítás</button>` : ''}</div>
    </div></section>`;
}

function gformHTML(){
  return `<form class="gform" id="gform"><input id="gname" placeholder="pl. Kék" required aria-label="Csoport neve" list="gnames"><datalist id="gnames">${GROUP_NAMES.filter(n => !S.groups.some(g => g.name === n)).map(n => `<option value="${n}">`).join('')}</datalist><button class="btn ghost sm" type="button" id="gdice" title="Névötlet" aria-label="Névötlet">🎲</button><select id="ggrade" aria-label="Évfolyam">${[7,8,9,10,11,12].map(n => `<option value="${n}">${n}.</option>`).join('')}</select><button class="btn sm" type="submit">+</button></form>`;
}
function onboardCard(){
  return `<section class="sugg onb" style="--c:var(--purple)"><div>
      <div class="eyebrow">Első lépés</div>
      <h2>Mi a csoportod neve, és hányadik évfolyamot tanítod?</h2>
      <p>Az évfolyam Csibe-alkalmait az admin osztja be, és mind a 4 patrónus ugyanazt tartja. Egy évfolyamon négy Csibe-csoport van: Kék, Zöld, Piros és Sárga. Válaszd ki a tiédet.</p>
      ${gformHTML()}</div>
      <div class="rule"><b>Miért érdemes egy témánál maradni?</b><br>Ha egy témánál több alkalmon át maradtok, a különböző készségek fejlesztésére hasznosabbak a gyakorlatok, mint ha minden héten más témára ugranátok.</div></section>`;
}
function progHTML(g){
  const sg = suggestion(g.id, S.budget);
  return `<div class="panel tprog"><h3 style="margin-top:18px">Témahaladás · ${g.grade}. évfolyam</h3><div style="font-size:17px;color:var(--muted);margin:-6px 0 10px">betervezett vagy megtartott gyakorlatok</div><div class="tpl">
      ${gThemes(g.grade).map(t => { const pr = progress(g.id, t.id); return `<button class="tpr ${t.id === sg.tid ? 'cur' : ''}" style="--c:${t.color}" data-tema="${t.id}"><b>${t.id === sg.tid ? '★ ' : ''}${esc(t.name)}</b><span>${pr.done}/${pr.total}</span><div class="prog"><i style="width:${pr.done / pr.total * 100}%"></i></div></button>`; }).join('')}
    </div></div>`;
}
function suggCard(){
  const g = curG();
  if (!g) return '';
  const sg = suggestion(g.id, S.budget), t = theme(sg.tid);
  const hasFuture = plansOf(g.grade).some(p => p.date >= today());
  const head = { start:`Kezdjétek ezzel: ${esc(t.name)}`, continue:`Folytassátok: ${esc(t.name)}`, next:`Jöhet a következő téma: ${esc(t.name)}`, done:`Minden téma kész – ismételjetek: ${esc(t.name)}` }[sg.reason];
  const why = {
    start:'Még nincs mentett alkalom. A félév az ismerkedéssel és a közös szabályokkal indul, erre épül minden további téma.',
    continue:`Ez lesz a ${sg.n}. Csibe ebben a témában a ${g.grade}. évfolyamon. Ha egy témánál több alkalmon át maradtok, a különböző készségek fejlesztésére hasznosabbak a gyakorlatok, mint ha minden héten más témára ugranátok.`,
    next:`A(z) ${esc(theme(sg.prev).name)} témát befejeztétek. A témák egymásra épülnek, ezért a sorban következő jön.`,
    done:'Minden gyakorlatot kipróbáltatok. Válasszatok egy kedvenc témát ismétlésre.'
  }[sg.reason];
  let clock = 0;
  const list = sg.items.map(a => { const from = clock; clock += a.minutes; return `<button class="sg-it" data-open="${a.id}"><span class="t">${from}′</span><span><b>${esc(a.name)}</b><small>${a.minutes} perc · ${esc(a.type)}${sg.used.has(a.id) ? ' · ismétlés' : ''}</small></span><span class="tag t${tIdx(a.type)}">${esc(a.type.split(' ')[0])}</span></button>`; }).join('');
  return fold('sugg', `💡 ${hasFuture ? 'Javaslat a következő tervezéshez' : 'Javaslat a következő foglalkozásra'} <small>· ${g.grade}. évfolyam · ${esc(t.name)}</small>`, `<section class="sugg" style="--c:${t.color}">
    <div>
      <div class="sg-photo">${photo(t)}</div>
      <h2>${head}</h2>

function bindInvite(){
  const f = $('#inviteForm'); if (!f) return;
  f.addEventListener('submit', async e => {

      const r = await S.sb.rpc('set_password_with_invite', { p_token:INVITE, p_password:pw });

        if (!su.data.session){ const si = await S.sb.auth.signInWithPassword({ email, password:pw }); if (si.error) throw new Error('A regisztráció sikerült, de a belépéshez e-mail-megerősítés kell. Szólj az adminisztrátornak, hogy kapcsolja ki a „Confirm email” beállítást.'); }

/* Patrónusok meghívása (admin) */
const inviteLink = tk => location.origin + location.pathname + '?meghivo=' + tk;
const INV = {
  async load(){
    if (S.mode === 'demo'){ S.invites = store.get('vc_demo_invites', []); return; }
    if (!S.admin) return;
    const r = await S.sb.from('invites').select('*').order('created_at', { ascending:false });
    S.invites = r.error ? [] : r.data;
  },
  save(){ if (S.mode === 'demo') store.set('vc_demo_invites', S.invites); },
  async add(emails){
    const have = new Set((S.invites || []).filter(x => !x.revoked).map(x => x.email.toLowerCase()));
    const list = [...new Set(emails.map(e => e.trim().toLowerCase()).filter(e => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)))].filter(e => !have.has(e));
    if (!list.length) return 0;
    if (S.mode === 'demo'){ list.forEach(email => S.invites.unshift({ token:crypto.randomUUID(), email, created_at:new Date().toISOString(), expires_at:new Date(Date.now() + 60 * 864e5).toISOString(), used_at:null, accepted_at:null, revoked:false })); INV.save(); return list.length; }
    const r = await S.sb.from('invites').insert(list.map(email => ({ email }))); if (r.error) throw r.error;
    await INV.load(); return list.length;
  },
  async renew(tk){
    const x = S.invites.find(i => i.token === tk); if (!x) return;
    if (S.mode === 'demo'){ x.token = crypto.randomUUID(); x.used_at = null; x.revoked = false; x.expires_at = new Date(Date.now() + 60 * 864e5).toISOString(); INV.save(); return; }
    await S.sb.from('invites').update({ revoked:true }).eq('token', tk);
    const r = await S.sb.from('invites').insert({ email:x.email, accepted_at:x.accepted_at }); if (r.error) throw r.error;
    await INV.load();
  },
  async revoke(tk){
    if (S.mode === 'demo'){ S.invites = S.invites.filter(i => i.token !== tk); INV.save(); return; }
    const r = await S.sb.from('invites').delete().eq('token', tk); if (r.error) throw r.error; await INV.load();
  }
};

const RUN = { on:false };
let runTimer = null, audioCtx = null, wakeLock = null;
const mmss = s => { const a = Math.abs(s); return (s < 0 ? '+' : '') + Math.floor(a / 60) + ':' + String(a % 60).padStart(2, '0'); };
function beep(){
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    [0, .35].forEach(d => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(.0001, audioCtx.currentTime + d); g.gain.exponentialRampToValueAtTime(.3, audioCtx.currentTime + d + .02); g.gain.exponentialRampToValueAtTime(.0001, audioCtx.currentTime + d + .28);
      o.start(audioCtx.currentTime + d); o.stop(audioCtx.currentTime + d + .3); });
  } catch (_){}
}
function startRun(src){
  let ids, title, planId = null;
  if (src === 'cart'){ ids = S.cart.items.filter(act); title = S.cart.title; }
  else { const p = S.plans.find(x => x.id === src.slice(5)); if (!p) return; ids = selIds(p); title = p.title || theme(sessionTheme(p)).name; planId = p.id; }
  if (!ids.length) return toast('Nincs gyakorlat a Csibében.');
  Object.assign(RUN, { on:true, src, ids, title, planId, i:0, left:effMin(ids[0], planId) * 60, running:false, end:false, rate:{}, tip:{}, note:'', beeped:false });
  openDrawer(false); if ($('#dlg').open) $('#dlg').close();
  try { navigator.wakeLock?.request('screen').then(w => wakeLock = w).catch(() => {}); } catch (_){}
  $('#run').classList.add('show'); renderRun();
  clearInterval(runTimer);
  runTimer = setInterval(() => {
    if (!RUN.on || !RUN.running || RUN.end) return;
    RUN.left--;
    if (RUN.left === 0 && !RUN.beeped){ RUN.beeped = true; beep(); }
    const t = document.getElementById('rnT'); if (t){ t.textContent = mmss(RUN.left); t.classList.toggle('over', RUN.left < 0); }
  }, 1000);
}
function stopRun(){ RUN.on = false; clearInterval(runTimer); $('#run').classList.remove('show'); try { wakeLock?.release(); } catch (_){} wakeLock = null; }
function runGo(i){ RUN.i = i; RUN.left = effMin(RUN.ids[i], RUN.planId) * 60; RUN.running = false; RUN.beeped = false; renderRun(); }

async function saveRun(){
  const R = RUN, gid = $('#rnGroup')?.value, g = group(gid); if (!g) return toast('Válassz csoportot.');
  R.note = $('#rnNote')?.value.trim() || '';
  try {
    let sess = R.planId ? myDone(R.planId, g.id) : null;
    if (!sess){
      const p = R.planId && S.plans.find(x => x.id === R.planId);
      sess = await LOG.addSession(g.id, p && p.date <= today() ? p.date : today(), R.title, R.note, R.ids, R.planId);
    }
    for (const aid of R.ids) if (R.rate[aid]) await LOG.setFeedback(sess.id, aid, R.rate[aid], R.tip[aid] || null);
    if (R.src === 'cart'){ S.cart.items = []; S.cart.title = 'Patrónusi foglalkozás'; saveCart(); }
    stopRun(); render(); toast(`✓ Elmentettük: a(z) ${g.name} csoport megtartotta a Csibét${Object.keys(R.rate).length ? ', az értékelésekkel együtt' : ''}.`);
  } catch (e){ toast('Hiba a mentésnél: ' + (e.message || e)); }
}

  for (let d = new Date(X.start + 'T12:00'); ymd(d) <= X.end; d.setDate(d.getDate() + 7)){
    const k = ymd(d); if (br.some(([a, b]) => k >= a && k <= b)) continue;
    if (busy.has(k)){ skipped++; continue; } dates.push(k);
  }
  const lessons = [];
  X.order.forEach(tid => { const ch = chunksFull(tid, X.grade).map(c => c.filter(id => !heldIds.has(id))).filter(c => c.length); ch.forEach((items, i) => lessons.push({ tid, items, title: theme(tid).name + (ch.length > 1 ? ` (${i + 1}/${ch.length})` : '') })); });
  lessons.forEach((l, i) => l.date = dates[i] || null);
  X.lessons = lessons; X.free = Math.max(0, dates.length - lessons.length); X.skipped = skipped;
  renderSchedule();
}
async function createSchedule(){
  const X = SCHED, list = X.lessons.filter(l => l.date);
  const ok = await ask(`${X.drop && X.drop.length ? `${X.drop.length} még meg nem tartott Csibe-alkalmat törlök, és ` : ''}${list.length} Csibe-alkalmat hozok létre a ${X.grade}. évfolyamnak (${fmtShort(list[0].date)} – ${fmtShort(list[list.length - 1].date)}). Mind a 4 patrónus látni fogja. Mehet?`);
  if (!ok) return renderSchedule();
  try {
    let n = 0;
    for (const id of (X.drop || [])) await LOG.delPlan(id);

    SCHED = null; if ($('#dlg').open) $('#dlg').close(); render(); toast(`Kész: ${n} Csibét terveztél be a ${X.grade}. évfolyamnak.`);

let photoFor = null;
function shrink(file, max = 1280, q = 0.8){
  return new Promise(res => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / img.width), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => res(b && b.size < file.size ? b : file), 'image/webp', q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); res(file); };
    img.src = url;
  });
}
async function handlePhoto(file){
  const t = theme(photoFor); if (!t || !file) return;
  file = await shrink(file);
  if (S.mode === 'demo'){
    const r = new FileReader();
    r.onload = () => { t.photo_url = r.result; render(); toast('Demó: a fotót csak most látod, az app nem menti el.'); };
    r.readAsDataURL(file); return;
  }
  toast('Feltöltés…');
  const ext = file.type === 'image/webp' ? 'webp' : ((file.name || '').split('.').pop() || 'jpg').toLowerCase();
  const path = `${t.id}-${Date.now()}.${ext}`;
  const up = await S.sb.storage.from(PHOTO_BUCKET).upload(path, file, { upsert:true, contentType:file.type });
  if (up.error) return toast('Hiba a feltöltésnél: ' + up.error.message);
  const url = S.sb.storage.from(PHOTO_BUCKET).getPublicUrl(path).data.publicUrl;
  const { error } = await S.sb.from('themes').update({ photo_url:url }).eq('id', t.id);
  if (error) return toast('Hiba a mentésnél: ' + error.message);
  t.photo_url = url; render(); toast('Elmentettük a fotót.');
}
async function deletePhoto(id){

}

  return true;
}
function loadScript(src){ return new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); }); }
async function loadLive(){
  const [th, ac, pr, li, ad] = await Promise.all([
    S.sb.from('themes').select('*'), S.sb.from('activities').select('*'), S.sb.from('printables').select('*'),
    S.sb.from('activity_printables').select('*'), S.sb.from('admins').select('email')]);
  const err = [th, ac, pr, li].find(r => r.error);
  if (err) throw err.error;
  setData({ themes:th.data, activities:ac.data, printables:pr.data, activity_printables:li.data });
  S.admin = !!(ad.data && ad.data.length);
  await LOG.load(); await INV.load();
  S.offline = null; saveOfflineCache();
}
async function start(){
  $('#app').innerHTML = '<div class="spin">Betöltés…</div>';
  if (S.mode === 'demo'){ setData(DEMO_DATA); await LOG.load(); await INV.load(); return render(); }
  try {
    try { await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'); }
    catch (er){ if (loadOfflineCache()){ S.user = { email:'offline' }; return render(); } throw er; }
    S.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const { data:{ session } } = await S.sb.auth.getSession();
    S.user = session?.user || null;
    S.sb.auth.onAuthStateChange(async (_ev, sess) => {
      const was = !!S.user; S.user = sess?.user || null;
      if (S.user && !was){ await loadLive(); render(); }
    });
    if (S.user){ try { await loadLive(); } catch (er){ if (!loadOfflineCache()) throw er; } }
    render();
  } catch (e){
    console.error(e);
    if (S.user && loadOfflineCache()) return render();
    $('#app').innerHTML = `<div class="spin"><div style="max-width:520px;text-align:center"><h2>Nem sikerült kapcsolódni</h2><p>${esc(e.message || e)}</p><p>Ellenőrizd a SUPABASE_URL és a SUPABASE_ANON_KEY beállítását, és nézd meg, hogy lefuttattad-e a schema.sql-t.</p></div></div>`;
  }
}
/*__LT__*/
start();
</script>
