zi, hogy kezd elszabadulni az indulat (pl. melegszik az arcom, ökölbe szorul a kezem).", "caution": "A helyzetek legyenek hétköznapiak és ne a csoport valós konfliktusaira utaljanak. A légzést mindenki csinálja együtt, így senki nem érzi kínosnak.", "variants": null}, {"id": "VC03-72", "theme_id": "t03", "name": "Hullámlovas", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "7", "description": "Megtanuljuk, hogy az erős érzés hullámként felfut, majd lecseng, és gyűjtünk módokat, amelyekkel „meglovagolhatjuk” a hullámot.", "tools": "A4-es lapok, színes ceruzák", "keywords": "érzelmi hullám, lecsengés, türelem, megküzdés, érzelmek elfogadása", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Rajzolj a táblára egy hullámot: emelkedés, csúcs, lecsengés. Magyarázd el: egy erős érzés a testben általában pár perc alatt eléri a csúcsát, aztán magától is csillapodik, ha nem tápláljuk tovább.\n2. Mindenki felidéz egy nem túl nehéz helyzetet, amikor nagyon bosszús, ideges vagy izgatott volt, és lerajzolja a saját hullámát: mi indította el, mi volt a csúcson, mi segített lejönni róla.\n3. Párban megmutatják egymásnak a rajzot, csak annyit mondanak el, amennyit szeretnének.\n4. Közösen összegyűjtitek a táblára, mi segít a hullámon „szörfözni” (pl. mozgás, zene, hideg víz, beszélgetés, kivárás), és mi teszi nagyobbá a hullámot (pl. újra és újra elmondani, visszaszólni).\n5. Feldolgozás: Mit jelent, hogy az érzés nem rossz, csak a hulláma nagy? Mindenki kiválaszt egy szörfdeszkát a listáról, amit legközelebb kipróbál.", "caution": "Kérd, hogy kis vagy közepes erősségű emléket válasszanak, ne nagyon fájdalmasat. Ha valaki megérintődik, adj lehetőséget a szünetre, és beszélj vele utána négyszemközt.", "variants": null}, {"id": "VC04-71", "theme_id": "t04", "name": "Kihallott erősségek", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Könnyű", "grade": "7", "description": "Apró sikertörténeteket mesélünk, és a párunk kihallja belőlük az erősségeinket.", "tools": "erősséglista a táblán vagy kinyomtatva (pl. kitartó, kreatív, segítőkész, bátor, humoros, figyelmes, szervező, türelmes)", "keywords": "erősségek, önbizalom, visszajelzés, önismeret, siker", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Írj fel a táblára 15–20 erősséget, és beszéljétek meg röviden, mit jelentenek.\n2. Mindenki felidéz egy apró sikert vagy jó pillanatot az elmúlt hónapokból (pl. megtanultam egy trükköt, segítettem valakinek, befejeztem valamit, ami nehéz volt).\n3. Párban 2 percig mesélnek, a pár csak hallgat. Utána a hallgató a listáról kiválaszt 2–3 erősséget, amit kihallott a történetből, és megindokolja. Csere.\n4. Mindenki felírja egy cetlire a kapott erősségeit, és odaírja: „Erre én is gondoltam / Erre nem gondoltam.”\n5. Feldolgozás: Milyen volt hallani, hogy mások mit látnak benned? Melyik erősséged meglepő? Hol tudnád ezt az erősséget ezen a héten használni?", "caution": "Figyelj, hogy a párok ne egymás gyengeségeit keressék. Ha valaki nem talál sikert, segíts apró, hétköznapi példával (pl. időben odaértem, kitartottam egy játékban).", "variants": null}, {"id": "VC05-71", "theme_id": "t05", "name": "Kíváncsiság-lánc", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Könnyű", "grade": "7", "description": "Párban gyakoroljuk a nyitott kérdéseket: minden válaszra egy újabb, kíváncsi kérdés jön, és így egyre jobban megismerjük a másikat.", "tools": "témakártyák (pl. egy hobbim, egy hely, ahol jól érzem magam, egy dolog, amit mostanában tanultam), stopper", "keywords": "nyitott kérdések, kíváncsiság, aktív hallgatás, beszélgetés, figyelem", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Kérdezz meg valakit kétféleképpen: „Jó volt a hétvégéd?” és „Mi volt a hétvégéd legjobb pillanata?” Melyikre lehet többet válaszolni? Gyűjtsetek nyitott kérdéskezdeteket a táblára (Mi…? Hogyan…? Milyen volt…? Mit éreztél, amikor…?).\n2. Párban az egyik húz egy témakártyát, és egy mondatban válaszol rá. A másik nyitott kérdést tesz fel a válaszára, aztán a következő válaszra is, legalább öt kérdésen át. Minden kérdés az előző válaszhoz kapcsolódjon.\n3. 4 perc után csere.\n4. Néhány pár elmondja, hová jutottak el az első mondattól. Mi volt a legjobb kérdés?\n5. Feldolgozás: Milyen volt, amikor valaki ennyire kíváncsi volt rád? Mi volt nehéz kérdezőként: a kérdés kitalálása vagy a figyelés? Kivel beszélgetnél így ezen a héten?", "caution": "A témák legyenek könnyűek. Mondd ki, hogy a válaszoló bármikor mondhatja: „Erről most nem szeretnék többet mondani.”", "variants": null}, {"id": "VC06-71", "theme_id": "t06", "name": "A történet másik oldala", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "7", "description": "Egy iskolai helyzetet egy-egy szereplő szemszögéből nézünk meg: mit élhet át belül, és mire lehet szüksége?", "tools": "szereplőkártyák (pl. az új diák, aki nem ismer senkit; aki elkésik, mert reggel a kistesóját viszi oviba; akit nem választanak be a csapatba; a tanár, akinek az óráján senki nem figyel)", "keywords": "empátia, nézőpontváltás, szükségletek, megértés, előítélet", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mondj el egy rövid helyzetet kívülről nézve (pl. „Peti megint elkésett, és még csak bocsánatot sem kért.”). Kérdezd meg: mit gondoltok Petiről?\n2. Kiscsoportok húznak egy szereplőkártyát. Megbeszélik: Mit láthatnak rajta kívülről a többiek? Mit érezhet belül? Mit gondolhat magáról? Mire lenne szüksége?\n3. A csoport kitalált belső monológot ír a szereplőnek 4–5 mondatban, és egyikük felolvassa.\n4. Térjetek vissza Petihez: a csoport kitalál neki egy hátteret, ami mindent más fénybe helyez.\n5. Feldolgozás: Mi változik, ha ismerjük a hátteret? Miért ítélünk sokszor gyorsan? Mi az az egy apró dolog, amit tehetünk, ha ilyen helyzetben látunk valakit?", "caution": "A szereplők legyenek kitaláltak, ne hasonlítsanak felismerhetően csoporttagokra. Ha valaki saját élményt oszt meg, köszönd meg, de ne kérdezz rá tovább a csoport előtt.", "variants": null}, {"id": "VC07-71", "theme_id": "t07", "name": "Megfigyelés vagy ítélet?", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Könnyű", "grade": "7", "description": "Szétválogatjuk, mi a tény és mi a vélemény egy mondatban, és ítéletből megfigyelést fogalmazunk.", "tools": "mondatkártyák, két felirat: „Megfigyelés” és „Ítélet”", "keywords": "megfigyelés, ítélet, EMK, tények, átfogalmazás", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Tedd ki a terem két végébe a két feliratot. Magyarázd el: a megfigyelés az, amit egy kamera is rögzítene; az ítélet a mi véleményünk róla.\n2. Olvass fel mondatokat (pl. „Lusta vagy.” „Ma háromszor késtél.” „Mindig csak magadra gondolsz.” „Nem válaszoltál az üzenetemre tegnap este.”). Mindenki odaáll, ahová szerinte tartozik a mondat.\n3. Ahol eltérnek a vélemények, kérdezd meg mindkét oldalt, miért állt oda.\n4. Párban az ítéleteket átfogalmazzák megfigyeléssé (pl. „Lusta vagy.” helyett „Ma nem vitted le a szemetet.”).\n5. Feldolgozás: Hogyan hat ránk, ha ítéletet hallunk? És ha megfigyelést? Miért könnyebb egy megfigyelésre válaszolni? Mindenki ír egy saját „mindig” vagy „soha” mondatot, és átírja megfigyeléssé.", "caution": "A „mindig” és „soha” szavaknál érdemes megállni: ezek szinte mindig ítéletet jeleznek. Ne valós osztálytársakról szóljanak a mondatok.", "variants": null}, {"id": "VC08-71", "theme_id": "t08", "name": "A pletyka útja", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Könnyű", "grade": "7", "description": "Egy suttogós játékon megtapasztaljuk, hogyan torzul egy hír továbbadás közben, és megbeszéljük, hogyan szít konfliktust a pletyka.", "tools": "egy előre megírt, 3–4 mondatos semleges történet, cetlik", "keywords": "pletyka, félreértés, konfliktus, felelősség, továbbadás", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Hat önként jelentkező kimegy a teremből. Az elsőnek felolvasod a rövid történetet (pl. „Kati tegnap a büfénél elejtette a tálcáját, Peti segített felszedni, és utána együtt nevettek.”).\n2. Egyenként behívod a többieket: mindig az előző mondja el a következőnek, amit hallott. Az utolsó elmondja a csoportnak.\n3. Olvasd fel az eredeti történetet. Mi változott? Mi maradt ki, mi került bele?\n4. Beszéljétek meg, mi történik, ha egy valódi emberről szóló hír torzul így. Gyűjtsétek a táblára, hogyan lesz egy pletykából veszekedés.\n5. Feldolgozás: Miért adunk tovább pletykát? Mit tehetsz, ha rólad terjed valami? Mi az a három kérdés, amit felteszel, mielőtt továbbadsz valamit (Igaz? Tőle hallottam? Kinek segít?)?", "caution": "A történet legyen kitalált, és ne hasonlítson valódi esetre. A kint várakozókat ne hagyd túl sokáig egyedül.", "variants": null}, {"id": "VC08-72", "theme_id": "t08", "name": "Mindkettőnknek jó", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "7", "description": "Egy vitában szétválasztjuk, mit akar valaki és miért akarja, és olyan megoldást keresünk, ami mindkét félnek jó.", "tools": "konfliktuskártyák, kétoszlopos táblázat a táblán: „Mit akar?” / „Miért fontos neki?”", "keywords": "igények, érdekek, megoldáskeresés, win-win, közvetítés", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: mi a különbség aközött, hogy valaki mit akar, és aközött, hogy miért akarja? Mondj példát: Anna az ablak mellé akar ülni, mert ott nem fázik; Bence is oda akar ülni, mert onnan látja a táblát.\n2. Mutasd be a két oszlopot: mit akar valaki (álláspont), és miért fontos neki (igény).\n3. Kiscsoportok kapnak egy konfliktuskártyát (pl. két barát egyszerre akarja a szünetben a pingpongasztalt; a csoport egyik fele moziba menne, a másik bowlingozni). Kitöltik a táblázatot mindkét félre.\n4. Legalább három olyan megoldást keresnek, ami mindkét fél igényére figyel, és kiválasztják a legjobbat.\n5. Feldolgozás: Miért segít, ha a „miért”-re figyelünk? Mikor nincs ilyen megoldás, és mit tehetünk akkor? Kit tudnál megkérdezni egy vitában, hogy ő miért ragaszkodik valamihez?", "caution": "A helyzetek legyenek kitaláltak. Ha a csoportban éppen van valódi feszültség, ne ezzel a gyakorlattal dolgozd fel nyilvánosan.", "variants": null}, {"id": "VC09-71", "theme_id": "t09", "name": "Papírtorony", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Könnyű", "grade": "7", "description": "Kiscsoportok újságpapírból építenek tornyot, a második körben korlátozott kommunikációval. Utána megbeszéljük, mi segítette az együttműködést.", "tools": "újságpapír (csoportonként 10 lap), ragasztószalag, mérőszalag, stopper", "keywords": "csapatmunka, kommunikáció, szerepek, tervezés, együttműködés", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. 4–5 fős csoportok 10 perc alatt a lehető legmagasabb, önállóan megálló tornyot építik újságpapírból és ragasztószalagból.\n2. Megméritek a tornyokat, és megtapsoljátok mindegyiket.\n3. Második kör: új tornyot építenek, de most csak egy ember beszélhet a csoportban, vagy senki sem (csak mutogatással kommunikálnak). Előtte 2 percet kapnak a tervezésre.\n4. Újra megméritek az eredményt.\n5. Feldolgozás: Mi változott a második körben? Ki milyen szerepet vett fel (ötletelő, építő, szervező, biztató)? Mi segítette és mi nehezítette a közös munkát? Mit vinnétek át ebből egy csoportos iskolai feladatba?", "caution": "Figyelj, hogy a csendesebbek is kezükbe kapják az anyagot. A verseny legyen játékos: a végén mindegyik torony kapjon tapsot.", "variants": null}, {"id": "VC10-71", "theme_id": "t10", "name": "Titkos köszönő", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Könnyű", "grade": "7", "description": "Mindenki húz egy nevet, és egy héten át figyeli, mit tesz jól az illető. A következő alkalommal névtelen köszönő kártyát kap tőle.", "tools": "névcetlik egy dobozban, köszönőkártyák vagy színes papír", "keywords": "hála, pozitív visszajelzés, figyelem, kedvesség, csoportlégkör", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Beszéljétek meg: mi a különbség a „Köszi!” és a „Köszönöm, hogy segítettél kitalálni a feladatot, mert egyedül elakadtam.” között? Mitől jó egy köszönet?\n2. Mindenki húz egy nevet (ha a sajátját húzza, visszateszi). A nevet titokban tartja.\n3. Az alkalmon belül készítsetek egy próbakártyát: mindenki ír egy konkrét köszönetet valakinek az iskolában vagy a családban (nem kell odaadni).\n4. Mondd el a feladatot: a jövő alkalomig mindenki figyeli a húzott társát, és konkrét, kedves köszönőkártyát ír neki. A kártyákat a következő Csibe elején osztod ki.\n5. Feldolgozás: Milyen érzés lesz figyelni valakire a jó dolgok miatt? Miért fontos, hogy a köszönet konkrét legyen? Mit gondolsz, mi változna a csoportban, ha ezt gyakrabban csinálnánk?", "caution": "Ellenőrizd a kártyákat kiosztás előtt, hogy mindegyik kedves és konkrét legyen. Ha valaki hiányzik, írj te kártyát neki, hogy senki ne maradjon ki.", "variants": null}, {"id": "VC12-71", "theme_id": "t12", "name": "A kör szélén", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "7", "description": "Hétköznapi helyzeteket nézünk meg, ahol valaki kimarad, és kitaláljuk, milyen apró lépésekkel hozhatjuk vissza a körbe.", "tools": "helyzetkártyák (csapatválasztás tesiórán, csoportchat, amiből kimaradt valaki, ebédlőasztal, születésnapi buli szervezése)", "keywords": "befogadás, kirekesztés, barátság, kiállás, apró lépések", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Kezdésként álljatok körbe, és egy önként jelentkező álljon a kör mellé. Kérdezd meg tőle: milyen innen nézni a kört? Kérdezd meg a kört is: észrevennétek-e, ha valaki itt áll?\n2. Kiscsoportok húznak egy helyzetkártyát. Megbeszélik: hogyan érezheti magát, aki kimarad? Miért nem veszik észre a többiek? Mi tartja vissza azt, aki észreveszi?\n3. A csoport három befogadó lépést talál ki: egy könnyűt, egy közepeset és egy bátrat.\n4. A csoportok bemutatják a lépéseiket, a többiek kiegészítik.\n5. Feldolgozás: Melyik lépést tudnád megtenni már holnap? Mi segít abban, hogy ne csak nézők legyünk? Kihez fordulhatsz, ha te kerülsz a kör szélére?", "caution": "A kör szélére állás legyen önkéntes és rövid. Ha a csoportban van, aki valóban kívül reked, ne vele kapcsolatos helyzetet hozz, és figyelj rá utána is.", "variants": null}, {"id": "VC13-71", "theme_id": "t13", "name": "Mielőtt elküldöd", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Könnyű", "grade": "7", "description": "Négy kérdést teszünk fel magunknak, mielőtt elküldünk vagy megosztunk valamit: igaz, kedves, szükséges, és tetszene-e, ha rólam szólna?", "tools": "helyzetkártyák, a négy kérdés a táblán", "keywords": "online kommunikáció, megosztás, kommentek, felelősség, digitális kedvesség", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Írd fel a négy kérdést: Igaz? Kedves? Szükséges? Tetszene, ha rólam szólna?\n2. Olvass fel helyzeteket: vicces fotót készítesz valakiről, amin rosszul néz ki; dühös vagy, és csúnya kommentet írnál; továbbküldenél egy pletykát; valaki kirakott egy rajzot, és te is hozzászólnál.\n3. Párban minden helyzeten végigmennek a négy kérdésen, és eldöntik: elküldöm, átírom vagy nem küldöm el?\n4. Átírják a „nem küldöm el” üzeneteket olyanra, amit nyugodtan elküldenének, vagy kitalálják, mit tesznek helyette.\n5. Feldolgozás: Miért könnyebb online bántó dolgot írni, mint szemtől szemben? Mi marad meg örökre az interneten? Mit tehetsz, ha már elküldtél valamit, amit megbántál?", "caution": "Ne kérd, hogy valós üzeneteket mutassanak meg. Ha online bántalmazásról derül ki valami, beszélj négyszemközt a diákkal, és kérj segítséget az iskola szakembereitől.", "variants": null}, {"id": "VC13-72", "theme_id": "t13", "name": "A képernyős napom", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "7", "description": "Megbecsüljük, majd lerajzoljuk egy átlagos napunk képernyőidejét, és megnézzük, mi tölt fel és mi merít le belőle.", "tools": "A4-es lapok, színes ceruzák; ha szeretnék, a telefon képernyőidő-statisztikája", "keywords": "képernyőidő, szokások, egyensúly, figyelem, feltöltődés", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mindenki tippel: hány órát tölt naponta képernyő előtt (telefon, gép, tévé, konzol)? Írják fel a tippet egy cetlire.\n2. Aki szeretné és meg tudja nézni, összeveti a tippet a telefonja statisztikájával. Senkinek nem kell megmutatnia a számot.\n3. Mindenki rajzol egy kört egy átlagos napjáról (alvás, iskola, tanulás, mozgás, barátok, képernyő), és a képernyős szeleteket két színnel jelöli: ami feltölt, és ami lemerít.\n4. Kiscsoportban megbeszélik: mi tölt fel online, és mi merít le? Mi az, amit sokszor csak „unaloműzésből” nézünk?\n5. Feldolgozás: Volt-e meglepetés a tippek és a valóság között? Mi az az egy lemerítő szelet, amit kicsit kisebbre vennél? Mivel töltenéd ki a felszabaduló időt?", "caution": "Kerüld az ítélkezést: a cél az, hogy észrevegyék a saját szokásaikat, nem az, hogy rosszul érezzék magukat. A számok megosztása önkéntes.", "variants": null}, {"id": "VC14-71", "theme_id": "t14", "name": "Mindenki ezt csinálja?", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "7", "description": "Névtelen szavazással megnézzük, mennyire igaz, hogy „mindenki” csinál valamit. A becslés és a valóság közti különbség sokat elárul a csoportnyomásról.", "tools": "cetlik, doboz, kérdéslista", "keywords": "kortárs nyomás, „mindenki”-mítosz, normák, becslés, döntés", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Olvass fel 5–6 ártalmatlan kérdést, pl. „Éjfél után is fent szoktál lenni hétköznap?” „Láttál már olyan videót, amit valójában nem akartál?” „Csináltál már valamit csak azért, mert mindenki más is?”\n2. Mindenki előbb megtippeli, hány ember mondana igent a csoportból, aztán névtelenül igent vagy nemet ír a cetlire, és bedobja a dobozba.\n3. Kiszámoljátok az eredményt, és összevetitek a tippekkel.\n4. Beszéljétek meg: hol tippeltünk többet, mint a valóság? Miért hisszük sokszor, hogy „mindenki” csinál valamit?\n5. Feldolgozás: Hogyan hat ránk, ha azt hisszük, mindenki más már megcsinálta? Kitől halljuk a legtöbbet, hogy „mindenki”? Mondj egy helyzetet, amikor jól jön tudni, hogy nem vagy egyedül a nemeddel.", "caution": "A kérdések legyenek ártalmatlanok és ne derüljön ki semmi kínos senkiről. Ne kérdezz szerhasználatról vagy szexualitásról ebben a korban ebben a formában.", "variants": null}, {"id": "VC14-72", "theme_id": "t14", "name": "Kiút három lépésben", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "7", "description": "Szerepjátékban gyakoroljuk, hogyan lépjünk ki egy kényelmetlen helyzetből úgy, hogy közben ne veszítsük el az arcunkat.", "tools": "helyzetkártyák (pl. a barátaid lógni hívnak; valaki arra kér, hogy oszd meg egy csúnya képet; mindenki kineveti az egyik osztálytársat, és téged is bíztatnak)", "keywords": "nemet mondás, kiút-mondatok, asszertivitás, barátság, döntés", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mutasd be a három lépést: 1. Nemet mondok röviden („Nem, ezt kihagyom.”). 2. Megindokolom, ha akarom, vagy humorral oldom („Nem az én műfajom.”). 3. Másikat javaslok vagy kilépek („Inkább gyertek, menjünk le a büfébe.”).\n2. Gyűjtsetek közösen kiút-mondatokat a táblára.\n3. Hármas csoportok: ketten rábeszélnek, egy ember gyakorolja a kiutat. Minden körben cserélnek. A rábeszélők ne legyenek túl erőszakosak.\n4. Néhány csoport bemutatja a jelenetét, a többiek elmondják, mi működött.\n5. Feldolgozás: Melyik mondat volt a legkönnyebb kimondani? Mit éreztél rábeszélőként? Mi segít, ha egyedül vagy a nemeddel? Mindenki kiválaszt magának egy kiút-mondatot.", "caution": "A szerepjáték után mindenki lépjen ki a szerepből (pl. egy rázással, a saját nevével). A helyzetek ne utaljanak valós eseményekre.", "variants": null}, {"id": "VC15-71", "theme_id": "t15", "name": "A stresszpohár", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Könnyű", "grade": "7", "description": "Egy pohár víz segítségével megmutatjuk, hogyan gyűlnek össze az apró terhek, és mi segít „leengedni” a pohárból.", "tools": "átlátszó pohár, kancsó víz, tálca, cetlik", "keywords": "stressz, terhelés, töltődés, egyensúly, megküzdés", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Tedd a poharat a tálcára. Kérj apró stresszforrásokat a csoporttól (pl. dolgozat, korán kelés, vita otthon, elfelejtett lecke), és mindegyiknél önts egy kevés vizet a pohárba.\n2. Amikor majdnem tele van, kérdezd meg: mi történik, ha még egy apróság jön? Önts még egy kicsit, hogy kicsorduljon. Gyakran nem az utolsó csepp a hibás, hanem az, hogy addig nem ürült a pohár.\n3. Gyűjtsetek „csapokat”: mi engedi le a vizet (pl. alvás, mozgás, nevetés, beszélgetés, zene, egy kis szünet)?\n4. Mindenki rajzol egy saját poharat: mi tölti most, és mi a három legjobb csapja.\n5. Feldolgozás: Mikor csordult már ki a poharad egy apróság miatt? Melyik csapodat használod túl ritkán? Kinek mondanád el, ha tele van a poharad?", "caution": "Ne vidd a beszélgetést nagyon súlyos stresszforrások felé. Ha valaki tartósan túlterheltnek tűnik, beszélj vele négyszemközt, és jelezd az iskolapszichológusnak.", "variants": null}, {"id": "VC15-72", "theme_id": "t15", "name": "Az elefánt szeletelése", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "7", "description": "Egy kitalált tanuló hetén megnézzük, hogyan lehet egy nagy feladatot kis lépésekre bontani, hogy ne az utolsó estére maradjon.", "tools": "egy kitalált heti feladatlista (dolgozat, projekt, edzés, születésnap), A4-es lapok", "keywords": "tanulás, tervezés, halogatás, időbeosztás, stresszcsökkentés", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: hogyan lehet megenni egy elefántot? (Falatonként.) Ma így bánunk egy nagy feladattal.\n2. Mutasd be Bence hetét: pénteken töriből témazáró, csütörtökön projektleadás, kedden és csütörtökön edzés, szerdán szülinap.\n3. Kiscsoportok elkészítik Bence tervét: kisebb lépésekre bontják a nagy feladatokat, és beosztják őket a napokra úgy, hogy legyen pihenés is.\n4. A csoportok összevetik a terveiket: miben hasonlítanak, mi a jó ötlet bennük?\n5. Feldolgozás: Mi szokott nálad az utolsó estére maradni? Mi lenne a te első kis falatod a következő nagy feladatnál? Mi segít elkezdeni, ha nincs kedved?", "caution": "Ne a hatékonyság legyen a fő üzenet: a tervbe a pihenés és a barátok is beleférjenek. A halogatást ne szégyenítsd, hanem kíváncsian kérdezz rá.", "variants": null}, {"id": "VC16-71", "theme_id": "t16", "name": "Döntésfa", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "7", "description": "Egy hétköznapi döntést ágakra bontunk: milyen lehetőségeim vannak, mi lehet a következményük, és kitől kérhetek tanácsot?", "tools": "csomagolópapír, filcek, döntéskártyák (pl. melyik szakkörre menjek; bevalljam-e, hogy eltörtem valamit; elmenjek-e egy buliba, ahol alig ismerek valakit)", "keywords": "döntéshozatal, következmények, mérlegelés, tanácskérés, felelősség", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Rajzolj a táblára egy fát: a törzs a döntés, az ágak a lehetőségek, a gyümölcsök a lehetséges következmények.\n2. Kiscsoportok húznak egy döntéskártyát, és megrajzolják a fát: legalább három ágat, mindegyikhez egy jó és egy kevésbé jó következményt.\n3. A fa mellé felírják: kitől kérnék tanácsot? Mit szeretnék, ha egy év múlva gondolnék erre a döntésre?\n4. A csoportok bemutatják a fáikat, és megmondják, melyik ágat választanák és miért.\n5. Feldolgozás: Mi segít jól dönteni: az érzés vagy a végiggondolás? Mikor jó gyorsan dönteni, és mikor kell időt hagyni? Mi egy döntés, ami most előtted áll?", "caution": "Nincs egyetlen helyes ág. Ha valaki valós, nehéz döntést hoz be, köszönd meg, és ajánld fel, hogy négyszemközt is beszélhettek róla.", "variants": null}, {"id": "VC16-72", "theme_id": "t16", "name": "Képeslap a 10.-es énemnek", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Könnyű", "grade": "7", "description": "Képeslapot írunk magunknak, amit a patrónus három év múlva, 10.-ben ad vissza.", "tools": "képeslapok vagy kartonlapok, borítékok, tollak", "keywords": "jövőkép, célok, önreflexió, változás, időkapszula", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: milyen voltál 3 évvel ezelőtt, 4.-esként? Mi változott azóta? Gyűjtsetek néhány példát.\n2. Mindenki ír egy képeslapot a 10.-es önmagának: Ilyen vagyok most (kedvenc dolgok, barátok, ami foglalkoztat); Ebben szeretnék fejlődni; Ezt kérdezem tőled, 10.-es én; Egy jókívánság.\n3. A lapot borítékba teszik, lezárják, és ráírják a nevüket.\n4. Mondd el: a borítékokat megőrzöd (vagy átadod a 10.-es patrónusnak), és 10.-ben, egy Csibe-alkalmon visszakapják.\n5. Feldolgozás: Mi volt nehéz kitalálni? Mit gondolsz, mi fog megváltozni addig, és mi marad ugyanaz? Mit kérdeznél a 10.-es önmagadtól a csoport előtt is?", "caution": "Ígérd meg, hogy senki nem olvassa el a lapokat, és tartsd is be. Jegyezd fel a naplóba, hol vannak a borítékok, hogy 10.-ben megtalálják.", "variants": null}, {"id": "VC17-71", "theme_id": "t17", "name": "Tanévzáró kincsesláda", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Könnyű", "grade": "7", "description": "Mindenki betesz a közös ládába egy emléket, egy tanulságot és egy köszönetet az évből, aztán névtelenül felolvassuk őket.", "tools": "doboz vagy láda, háromféle színű cetli", "keywords": "tanévzárás, emlékek, tanulságok, hála, közösség", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mutasd meg a ládát: ebbe gyűjtjük az év kincseit.\n2. Mindenki három cetlit ír: egy emléket az évből, amire szívesen gondol; egy dolgot, amit megtanult magáról; egy köszönetet valakinek (név nélkül is lehet).\n3. A cetliket bedobják a ládába. Utána sorban húznak, és felolvassák őket.\n4. A felolvasás után mindenki kiválaszt egy cetlit, ami valamiért megérintette, és elmondja, miért.\n5. Feldolgozás: Mire vagy büszke ebből az évből? Mit viszel tovább a csoportból a nyárra? Mit szeretnél, hogy jövőre is így legyen?", "caution": "A felolvasott cetliken ne legyen név, ha valaki nem szeretné. Előtte nézd át a cetliket, hogy ne kerüljön bele bántó vagy kínos mondat.", "variants": null}, {"id": "VC17-72", "theme_id": "t17", "name": "Évkönyv-oldal", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Könnyű", "grade": "7", "description": "Mindenki elkészít egy oldalt a csoport közös évkönyvébe: rajzot, idézetet, emléket az évből. A lapokat összefűzzük, és közösen lapozzuk át.", "tools": "A4-es lapok, színes ceruzák, filcek, lyukasztó, zsinór vagy mappa", "keywords": "évkönyv, emlékek, tanévzárás, közösség, kreativitás", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mondd el: a csoport közös évkönyvet készít az évről. Mindenki egy oldalt csinál.\n2. Az oldalra kerüljön: a neve vagy egy jele, egy rajz vagy szimbólum, ami az évet jelenti neki, egy kedvenc Csibe-pillanat, és egy mondat a csoportnak.\n3. A kész lapokat összefűzitek, és körbeadjátok, hogy mindenki átlapozhassa.\n4. Aki szeretné, bemutatja a saját oldalát.\n5. Feldolgozás: Melyik oldal lepett meg? Mi volt az év legjobb közös pillanata? Hol legyen az évkönyv, és mikor nézzétek meg újra?", "caution": "Figyelj, hogy mindenkinek legyen oldala, aki hiányzik, annak is. Az évkönyvet a patrónus őrizheti, és 8.-ban elővehetitek.", "variants": null}, {"id": "VC01-81", "theme_id": "t01", "name": "Ha megszegjük a szabályt", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Könnyű", "grade": "8", "description": "Megállapodunk, mi történjen, ha valaki megszegi a csoport szabályait: büntetés helyett jóvátétellel.", "tools": "a csoportszerződés vagy a szabályplakát, helyzetkártyák", "keywords": "szabályok, jóvátétel, felelősség, csoportszerződés, helyreállítás", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Tedd ki a csoportszerződést. Kérdezd meg: mi történik most, ha valaki megszeg egy szabályt? Mi lenne igazságos?\n2. Mutasd be a jóvátétel három kérdését: Mi történt? Kire hogyan hatott? Mit tehetek, hogy rendbe jöjjön?\n3. Kiscsoportok kapnak egy helyzetet (pl. valaki kibeszélte, amit a körben hallott; valaki végig telefonozott; valaki kinevetett egy társát). Végigmennek a három kérdésen, és jóvátételi lépést javasolnak.\n4. A javaslatokból közösen kiválasztjátok, mi kerüljön a szerződésbe „Ha megszegjük” címmel.\n5. Feldolgozás: Miben más a jóvátétel, mint a büntetés? Mi segít abban, hogy valaki vállalja a hibáját? Mit szeretnél, hogy veled mi történjen, ha te hibázol?", "caution": "A helyzetek legyenek kitaláltak, ne valós esetekre utaljanak. A cél a csoport biztonsága, nem a bűnös keresése.", "variants": null}, {"id": "VC02-81", "theme_id": "t02", "name": "Hangulatkövető", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Könnyű", "grade": "8", "description": "Megtanuljuk, hogyan követhetjük egy héten át a hangulatunkat, és milyen mintákat vehetünk így észre.", "tools": "A4-es lapok heti táblázattal (napok × reggel, délután, este), színes ceruzák", "keywords": "hangulatnapló, önmegfigyelés, minták, érzelmek, tudatosság", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mutasd meg a heti táblázatot: minden mezőbe egy szín vagy egy szó kerül arról, milyen volt a hangulat. Előtte közösen állapodjatok meg a színekben.\n2. Mindenki kitölti a tegnapi napot és a mai reggelt. Mellé írja: mi történt akkor?\n3. Párban megnézik egymás lapját (csak amennyit a másik megmutat): mi befolyásolja a hangulatot? Alvás, evés, emberek, telefon, iskola?\n4. Közösen gyűjtsétek össze a leggyakoribb hangulatbefolyásolókat a táblára.\n5. Feldolgozás: Mire jó, ha követjük a hangulatunkat? Mit sejtesz, milyen mintát fogsz találni egy hét után? A lapot mindenki hazaviszi, és a következő alkalom elején, aki szeretné, elmondja, mit vett észre.", "caution": "A napló a diáké, senkinek nem kell megmutatnia. Ha valakinél hosszabb ideje sötét színek vannak, beszélj vele négyszemközt.", "variants": null}, {"id": "VC02-82", "theme_id": "t02", "name": "Mit érzel a zenére?", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Könnyű", "grade": "8", "description": "Rövid zenerészleteket hallgatunk, és leírjuk, milyen érzést keltenek. Kiderül, hogy ugyanarra a zenére mennyire különbözően reagálunk.", "tools": "4–5 rövid, szöveg nélküli zenerészlet (1-1 perc), hangszóró, cetlik", "keywords": "zene, érzelmek, egyéni különbségek, érzelemszókincs, hangulat", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mondd el, hogy szöveg nélküli zenéket fogtok hallani. Mindenki minden részlet után felír egy érzést és egy képet, ami eszébe jutott.\n2. Játszd le egymás után a részleteket, mindegyik után hagyj egy percet az írásra.\n3. Részletenként gyűjtsétek össze az érzéseket a táblára. Hol egyeztek, és hol tértek el nagyon?\n4. Kérdezd meg azokat, akiknél eltért az érzés: mi juttatta eszükbe? Emlék, hely, ember?\n5. Feldolgozás: Miért érezhetünk mást ugyanarra? Mit jelent ez, amikor egy helyzetben mi mást érzünk, mint a barátunk? Milyen zenét hallgatsz, ha fel akarod dobni magad, és milyet, ha megnyugodnál?", "caution": "Válassz semleges, nem túl drámai zenéket. Ha egy részlet szomorú emléket idéz fel valakinél, ne kérdezz rá a csoport előtt.", "variants": null}, {"id": "VC03-81", "theme_id": "t03", "name": "5-4-3-2-1 földelés", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Könnyű", "grade": "8", "description": "Kipróbálunk egy érzékszervekre épülő technikát, ami pánik, düh vagy erős izgalom idején visszahoz a jelenbe.", "tools": "semmi különleges; akár egy kis tárgy mindenkinek (kavics, radír)", "keywords": "földelés, jelen pillanat, szorongás, önszabályozás, érzékszervek", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: mi történik a fejünkben, amikor nagyon izgulunk? (Szaladnak a gondolatok, a jövőn vagy a múlton rágódunk.)\n2. Vezesd végig a technikát: nevezz meg 5 dolgot, amit látsz; 4 dolgot, amit érzel a bőrödön; 3 hangot, amit hallasz; 2 illatot; 1 ízt vagy egy dolgot, amiért most hálás vagy.\n3. Párban egyikük suttogva vezeti a másikat a lépéseken, aztán csere.\n4. Beszéljétek meg, milyen helyzetekben jöhet jól (dolgozat előtt, vita után, este elalvás előtt), és hogyan lehet csendben, észrevétlenül is csinálni.\n5. Feldolgozás: Mi változott benned a gyakorlat alatt? Melyik lépés volt a legnehezebb? Hol próbálod ki legközelebb? Mindenki felírja a technikát a telefonjába vagy egy cetlire.", "caution": "Ha valakinek kellemetlen a csukott szem, nyitott szemmel is csinálhatja. Mondd ki, hogy a technika nem tünteti el az érzést, csak segít, hogy ne sodorjon el.", "variants": null}, {"id": "VC03-82", "theme_id": "t03", "name": "Az el nem küldött levél", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "8", "description": "Levelet írunk valakinek, aki felbosszantott vagy megbántott, de nem küldjük el. Az írás segít kiengedni és rendezni az érzést.", "tools": "papír, borítékok, tollak", "keywords": "kifejező írás, düh, sérelem, érzelmek kiengedése, rendezés", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mondd el: néha segít, ha leírjuk, amit nem mondhatunk ki, vagy még nem tudunk jól kimondani. Ezt a levelet senki nem olvassa el.\n2. Mindenki gondol egy kisebb sérelemre vagy bosszúságra, és 10 percig ír a címzettnek. Bármit leírhat, ami benne van.\n3. Utána egy második, rövid részt ír a levél aljára: Mit szeretnék valójában? Mi lenne, ha ezt elmondanám?\n4. Mindenki eldönti, mi legyen a levéllel: összehajtja és borítékba teszi, eltépi, vagy hazaviszi.\n5. Feldolgozás: Milyen volt leírni? Változott-e az érzés erőssége? Van-e olyan rész, amit szívesen elmondanál a címzettnek, csak nyugodtabban? Mikor használnád ezt máskor is?", "caution": "Kérd, hogy kisebb, nem traumatikus helyzetet válasszanak. A leveleket ne szedd be és ne olvasd el. Ha valaki nagyon felkavarodik, adj neki teret, és beszélj vele utána.", "variants": null}, {"id": "VC04-81", "theme_id": "t04", "name": "Identitás-hagyma", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "8", "description": "Rétegekre bontjuk, kik vagyunk: mit lát mindenki, mit tudnak a barátaink, és mit tudunk csak mi magunk.", "tools": "A4-es lapok, színes ceruzák", "keywords": "identitás, önismeret, rétegek, magánszféra, bizalom", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Rajzolj a táblára egy hagymát három réteggel: külső (amit mindenki lát rólam), középső (amit csak a barátaim tudnak), belső (amit csak én tudok).\n2. Mindenki megrajzolja a saját hagymáját. A külső réteget kitölti, a középsőbe írhat, a belső rész csak az övé, azt jelölheti egy színnel is.\n3. Párban csak a külső réteget mutatják meg egymásnak, és megbeszélik: mi lepne meg másokat, ha a középső réteget is látnák?\n4. Közösen beszéljétek meg: kinek mutatjuk meg a belső rétegeket, és mi kell ahhoz, hogy megbízzunk valakiben?\n5. Feldolgozás: Melyik réteg változik a legtöbbet mostanában? Van-e olyan, amit szeretnél, hogy mások is lássanak rólad? Mi az, amit jogod van csak magadnak megtartani?", "caution": "Senkit ne kérj a belső réteg megosztására. Mondd ki, hogy a magánszféra fontos, és nem kell mindent megosztani.", "variants": null}, {"id": "VC05-81", "theme_id": "t05", "name": "A figyelő test", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Könnyű", "grade": "8", "description": "Kipróbáljuk, hogyan hat a mesélőre, ha a hallgató teste elfordul, vagy ha felé fordul. Megtanuljuk a figyelő testtartást.", "tools": "székek párban, témakártyák", "keywords": "nem verbális kommunikáció, testtartás, figyelem, szemkontaktus, hallgatás", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Párban az egyik mesél 1 percig egy témakártyáról. A hallgató az első körben elfordul, a telefonját nézi vagy az órát.\n2. Második kör ugyanazzal a témával: a hallgató felé fordul, előrehajol, néha bólint, szemkontaktust tart.\n3. A mesélők elmondják, mit éreztek a két körben. Csere.\n4. Gyűjtsétek össze a táblára a figyelő test jeleit (felé fordulás, nyitott kéz, bólintás, szemkontaktus), és azt is, hogy ezek kultúránként és emberenként változhatnak.\n5. Feldolgozás: Melyik jelet használod magadtól is? Melyiket felejted el? Mit érzel, amikor valaki úgy hallgat, hogy közben a telefonját nézi? Ezen a héten figyeld meg, hogyan hallgatnak rád otthon.", "caution": "Az első kör legyen rövid, hogy senki ne érezze magát kellemetlenül. Ha valakinek nehéz a szemkontaktus, mondd ki, hogy ez rendben van, máshogy is lehet jelezni a figyelmet.", "variants": null}, {"id": "VC06-81", "theme_id": "t06", "name": "Empatikus válaszok", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "8", "description": "Megkülönböztetjük a sajnálatot, a jó tanácsot és az együttérzést, és gyakoroljuk, hogyan válaszoljunk úgy, hogy a másik megértve érezze magát.", "tools": "mondatkártyák (amit egy barát mond), a táblán négy válaszfajta", "keywords": "empátia, együttérzés, válaszadás, meghallgatás, barátság", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Olvasd fel: „Kirúgtak a csapatból.” Mutass négy választ: sajnálat („Ó, szegény!”), tanács („Menj át másik csapatba!”), elbagatellizálás („Nem nagy ügy.”), együttérzés („Ez nagyon rosszul eshetett. Mesélsz róla?”).\n2. Kérdezd meg: melyik válasz után mesélnél tovább szívesen? Miért?\n3. Párban húznak egy mondatkártyát (pl. „A szüleim válnak.” „Rossz jegyet kaptam.” „Nem hívtak meg a buliba.”), és együttérző választ fogalmaznak rá.\n4. A párok felolvassák a válaszaikat, a többiek jelzik, melyik volt a legmeghallgatóbb.\n5. Feldolgozás: Miért adunk olyan gyorsan tanácsot? Mikor jó mégis a tanács? Mi az az egy mondat, amit legközelebb mondani fogsz, ha valaki rosszul van?", "caution": "A kártyák kitalált helyzetek legyenek. Ha valaki saját élményről beszél, köszönd meg, és ne vidd tovább a csoport előtt.", "variants": null}, {"id": "VC07-81", "theme_id": "t07", "name": "Világos kérés", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Könnyű", "grade": "8", "description": "Megtanuljuk, mitől teljesíthető egy kérés: legyen konkrét, pozitív és most megvalósítható.", "tools": "mondatkártyák homályos kérésekkel", "keywords": "kérés, EMK, konkrétság, kommunikáció, együttműködés", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Írd fel a táblára: „Legyél már normális!” Kérdezd meg: mit kellene tennie annak, akinek ezt mondják? (Nem tudja.)\n2. Mutasd be a jó kérés három jellemzőjét: konkrét (mit pontosan?), pozitív (mit tegyen, nem azt, mit ne), most megvalósítható.\n3. Párban átírják a homályos kéréseket (pl. „Ne legyél ilyen rendetlen!” „Figyelj rám jobban!” „Ne idegesíts!”) világos kérésekké.\n4. Néhány pár eljátssza a régi és az új kérést, a többiek elmondják, melyikre válaszolnának szívesebben.\n5. Feldolgozás: Miért nehéz pontosan kérni? Mit csinálsz, ha a másik nemet mond a kérésedre? Mindenki ír egy világos kérést, amit ezen a héten elmond valakinek.", "caution": "Hangsúlyozd: a kérésre nemet is lehet mondani, ettől lesz kérés, és nem követelés.", "variants": null}, {"id": "VC08-81", "theme_id": "t08", "name": "Vita szabályokkal", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "8", "description": "Egy könnyű témáról vitázunk öt egyszerű szabály mentén, és megtapasztaljuk, hogy a vita lehet tiszteletteljes is.", "tools": "vitatéma (pl. legyen-e házi feladat; jobb-e a nyár, mint a tél), stopper", "keywords": "vitakultúra, érvelés, tisztelet, szabályok, véleménykülönbség", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mutasd be az öt szabályt: 1. Egyszerre egy ember beszél. 2. A véleményt bíráljuk, nem az embert. 3. Mielőtt válaszolok, összefoglalom, amit a másik mondott. 4. Érvet mondok, nem csak „mert”. 5. Megváltoztathatom a véleményemet.\n2. Osszátok két csoportra a teret a témának megfelelően. Mindenki oda áll, amivel inkább egyetért.\n3. Vezesd a vitát 10 percig: felváltva szólalnak meg az oldalak. Aki meggyőzték, átsétálhat.\n4. Állítsd meg egyszer-kétszer a vitát, és kérdezd meg: melyik szabályt volt a legnehezebb betartani?\n5. Feldolgozás: Milyen volt úgy vitázni, hogy előbb össze kellett foglalni a másikat? Átállt-e valaki? Miért nehéz megváltoztatni a véleményünket? Hol hiányzik a vitakultúra a mindennapokban?", "caution": "Válassz ártalmatlan témát. Figyelj, hogy a csendesebbek is szóhoz jussanak, és ne csak a hangosak vitatkozzanak.", "variants": null}, {"id": "VC08-82", "theme_id": "t08", "name": "Jóvátétel", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "8", "description": "Egy konfliktus után nem elég a bocsánatkérés: megnézzük, hogyan lehet visszaépíteni a bizalmat tettekkel is.", "tools": "helyzetkártyák", "keywords": "jóvátétel, bizalom, bocsánat, felelősségvállalás, helyreállítás", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: volt már, hogy valaki bocsánatot kért, de nem hitted el? Mi hiányzott?\n2. Rajzolj a táblára egy hidat: a bocsánatkérés csak az első deszka, a többi deszka a jóvátétel tettei (pótolom, amit elrontottam; másképp csinálom legközelebb; megkérdezem, mire van szüksége).\n3. Kiscsoportok kapnak egy helyzetet (pl. elmondtad a barátod titkát; elveszítetted a kölcsönkapott könyvet; kinevetted valakit a többiek előtt). Megépítik a hidat: legalább három jóvátételi deszkát.\n4. Bemutatják a hídjukat, a többiek megmondják, melyik deszka a legfontosabb szerintük.\n5. Feldolgozás: Mennyi idő kell, hogy helyreálljon a bizalom? Mit tehetsz, ha a másik még nem bocsát meg? És mit tehetsz, ha neked kellene megbocsátanod?", "caution": "Mondd ki: a megbocsátás nem kötelező, és időbe telhet. A helyzetek legyenek kitaláltak.", "variants": null}, {"id": "VC09-81", "theme_id": "t09", "name": "Közös kép szavak nélkül", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Könnyű", "grade": "8", "description": "Kiscsoportok egy nagy lapra közösen rajzolnak egy képet úgy, hogy közben senki nem beszél. Megnézzük, ki hogyan vezetett és követett.", "tools": "csomagolópapír csoportonként, filcek", "keywords": "csapatmunka, nem verbális együttműködés, vezetés, követés, figyelem", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. 4–5 fős csoportok kapnak egy nagy lapot. A feladat: közösen rajzoljanak egy házat a környezetével, de végig némán.\n2. Mindenki egyszerre csak egy vonalat húzhat, aztán a következő jön. 10 percük van.\n3. Utána a csoport egy szót írhat a kép alá címként, de még mindig szavak nélkül kell megegyezniük.\n4. Járjátok körbe a képeket kiállításként.\n5. Feldolgozás: Ki kezdeményezett, és ki igazodott? Volt-e, aki átrajzolta a másik ötletét? Hogyan értettétek meg egymást szavak nélkül? Mit tanultál magadról: inkább vezetsz vagy követsz?", "caution": "Ügyelj, hogy a képek ne kerüljenek értékelésre. Ha valaki frusztrált lesz, ezt is érdemes a feldolgozásban megbeszélni.", "variants": null}, {"id": "VC10-81", "theme_id": "t10", "name": "Három jó dolog", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Könnyű", "grade": "8", "description": "Elkezdjük a hálanaplót: minden este három jó dolgot írunk fel a napból, és megnézzük, mit változtat ez a figyelmünkön.", "tools": "kis füzet vagy A5-ös lapok, tollak", "keywords": "hála, pozitív figyelem, napló, jóllét, szokás", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: miért emlékszünk jobban a rossz dolgokra? Mondd el röviden, hogy az agyunk a veszélyre figyel jobban, de a figyelmünket lehet edzeni.\n2. Mindenki felír három jó dolgot az elmúlt 24 órából, akár apróságot is (meleg tea, egy jó poén, napsütés).\n3. Mindegyik mellé odaírja: miért történt meg ez a jó dolog? Kinek köszönhető?\n4. Aki szeretné, megoszt egyet a csoporttal. Gyűjtsétek a táblára a „legkisebb jó dolgokat”.\n5. Feldolgozás: Nehéz volt hármat találni? Mit gondolsz, mi változna, ha ezt egy héten át minden este megcsinálnád? Mindenki eldönti, kipróbálja-e, és a következő alkalommal beszámolhat.", "caution": "Ne erőltesd a vidámságot: ha valakinek nehéz időszaka van, egy jó dolog is elég, és ez is rendben van.", "variants": null}, {"id": "VC12-81", "theme_id": "t12", "name": "Milyen a jó barátság?", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "8", "description": "Összegyűjtjük, mitől egészséges egy barátság, és milyen jelek mutatják, ha valami nincs rendben.", "tools": "két oszlop a táblán: „Zöld jel” és „Piros jel”, cetlik", "keywords": "barátság, egészséges kapcsolat, határok, bizalom, kölcsönösség", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mindenki felír cetlire egy dolgot, amitől jó egy barátság, és egyet, amitől nem.\n2. A cetliket felragasztjátok a két oszlopba (zöld és piros jel), és csoportosítjátok őket.\n3. Kiscsoportok kapnak egy-egy történetet (pl. a barátod csak akkor keres, ha kell neki valami; a barátod mindig meghallgat, de te sosem kérdezed meg, hogy van; a barátod féltékeny, ha mással is beszélsz). Eldöntik: zöld vagy piros, és mit tennének.\n4. Bemutatják, a többiek kiegészítik.\n5. Feldolgozás: Mit adsz te a barátságaidba, és mit kapsz? Mit tehetsz, ha egy barátságban piros jeleket látsz? Kivel tudsz erről beszélni?", "caution": "Senkit ne kérj meg, hogy valós barátságát értékelje a csoport előtt. Ha valaki bántó kapcsolatról beszél, beszélj vele négyszemközt.", "variants": null}, {"id": "VC12-82", "theme_id": "t12", "name": "Ugratás vagy bántás?", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "8", "description": "Megkeressük, hol a határ a baráti ugratás és a bántás között, és mit tehetünk, ha valaki átlépi.", "tools": "skála a padlón (1 = ártatlan vicc, 10 = bántás), helyzetkártyák", "keywords": "ugratás, csúfolás, bántás, határ, kiállás", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Tegyétek le a padlóra a skálát. Olvass fel helyzeteket (pl. a barátod viccesen utánozza, ahogy beszélsz; minden nap ugyanazzal a becenévvel csúfolnak valakit; kirakják valaki rossz fotóját a csoportchatbe). Mindenki odaáll, ahová szerinte tartozik.\n2. Kérdezd meg azokat, akik távol állnak egymástól: miért gondolják másképp?\n3. Gyűjtsétek össze, mi alapján dől el, hogy valami ugratás vagy bántás: nevet-e a másik is; ismétlődik-e; van-e erőkülönbség; mondta-e, hogy hagyják abba.\n4. Kiscsoportok kitalálják, mit mondhat az, akit bántanak, és mit az, aki látja.\n5. Feldolgozás: Miért nehéz szólni, ha nekünk már nem vicces? Mi a különbség a „csak vicc volt” és a bocsánatkérés között? Kihez fordulhatsz, ha a bántás nem áll le?", "caution": "Ha a csoportban zajló bántásra derül fény, ne a csoport előtt kezeld, hanem négyszemközt és az iskola szakembereivel.", "variants": null}, {"id": "VC13-81", "theme_id": "t13", "name": "Mit gondol rólad az algoritmus?", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "8", "description": "Megnézzük, miért pont azt látjuk a hírfolyamunkban, amit látunk, és mennyire mi döntjük el, mire figyelünk.", "tools": "telefon (ha van), cetlik; telefon nélkül egy kitalált hírfolyam a táblán", "keywords": "algoritmus, közösségi média, figyelem, buborék, tudatos használat", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Aki szeretné, megnézi a hírfolyama első 10 tartalmát, és felírja a témájukat (nem kell megmutatnia). Telefon nélkül dolgozhattok a táblára írt kitalált hírfolyammal.\n2. Mindenki megfogalmazza: ebből ítélve mit gondol rólam az algoritmus? Mennyire igaz?\n3. Magyarázd el röviden: az app azt mutatja, amin a legtöbb időt töltjük, mert az a célja, hogy ott maradjunk.\n4. Kiscsoportok gyűjtenek ötleteket, hogyan „taníthatjuk” az algoritmust (pl. követés, elrejtés, keresés, szünet).\n5. Feldolgozás: Meglepett, amit az algoritmus rólad gondol? Melyik tartalom tölt fel, és melyik húz le? Mit változtatnál ezen a héten a hírfolyamodon?", "caution": "A telefon használata önkéntes, a tartalmakat senkinek nem kell megmutatnia.", "variants": null}, {"id": "VC13-82", "theme_id": "t13", "name": "Mit osztok meg?", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Könnyű", "grade": "8", "description": "Szétválogatjuk, mit szabad nyugodtan megosztani online, mit csak a barátainkkal, és mit soha.", "tools": "kártyák (pl. lakcím, kedvenc zene, nyaralási fotó élőben, iskola neve, jelszó, születésnap, egy vicces videó egy barátról)", "keywords": "magánszféra, online biztonság, megosztás, adatvédelem, beleegyezés", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Tegyél ki három feliratot: Nyilvános, Csak barátoknak, Soha.\n2. Kiscsoportok szétválogatják a kártyákat a három kategóriába.\n3. Hasonlítsátok össze a csoportok döntéseit. Hol tértek el, és miért?\n4. Külön beszéljetek arról, ami másról szól: kell-e engedélyt kérni, mielőtt megosztunk egy képet a barátunkról?\n5. Feldolgozás: Mit osztottál már meg, amit ma másképp csinálnál? Mi az a beállítás, amit ma este megnézel a profilodon? Mit tehetsz, ha rólad osztottak meg valamit engedély nélkül?", "caution": "Ha valaki konkrét visszaélésről beszél, vedd komolyan, és segíts neki felnőttet vagy iskolai szakembert találni.", "variants": null}, {"id": "VC14-81", "theme_id": "t14", "name": "Igazodni vagy kitartani?", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "8", "description": "Egy egyszerű kísérlettel megtapasztaljuk, milyen erős a csoport véleményének hatása, és mikor érdemes kitartani a saját véleményünk mellett.", "tools": "egy ábra a táblán három különböző hosszú vonallal és egy mintavonallal; 3–4 előre beavatott diák", "keywords": "konformitás, csoportnyomás, vélemény, bátorság, döntés", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Előre kérj meg 3–4 diákot, hogy a kísérletben szándékosan rossz választ mondjanak. Ne áruld el a többieknek.\n2. Mutasd az ábrát: melyik vonal ugyanolyan hosszú, mint a minta? A beavatottak kezdik, és mind ugyanazt a rossz vonalat mondják. Utána a többiek is válaszolnak.\n3. Fedd fel a kísérletet, és kérdezd meg: mit éreztetek, amikor mindenki mást mondott? Ki változtatott a válaszán?\n4. Gyűjtsétek össze, mikor jó igazodni a csoporthoz (pl. közlekedési szabályok), és mikor fontos kitartani (pl. ha valakit bántanak).\n5. Feldolgozás: Miért nehéz egyedül mást mondani? Mi segít kitartani? Elég-e egyetlen szövetséges? Mikor voltál már bátor a véleményeddel?", "caution": "A kísérlet után mindenkit nyugtass meg: aki igazodott, nem butaságot csinált, hanem azt, amit a legtöbb ember. A beavatottakat köszönd meg.", "variants": null}, {"id": "VC14-82", "theme_id": "t14", "name": "Trükkfelismerő", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "8", "description": "A rábeszélésnek tipikus trükkjei vannak. Hármas csoportokban játékosan kipróbáljuk őket, és gyakoroljuk, hogyan nevezzük meg és hárítsuk el a trükköt.", "tools": "trükk- és kérés-kártyák (nyomtatnivaló, csoportonként egy készlet), pontozólap", "keywords": "kortárs nyomás, rábeszélés, manipuláció, nemet mondás, asszertivitás", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: milyen mondatokkal szoktak rábeszélni valamire? Gyűjtsetek néhányat a táblára, aztán mutasd meg a nyolc trükköt (a vetíthető dián is): kicsinyítés, szégyenítés, „mindenki”, barátság-zsarolás, titok, bagatellizálás, sürgetés, viszonzás.\n2. Alakítsatok hármas csoportokat: rábeszélő, rábeszélt és megfigyelő. A rábeszélő húz egy kérés-kártyát (ártalmatlan kérés, pl. „Add oda a tízóraidat.”) és egy trükk-kártyát, és 1 percig a trükkel próbál rábeszélni.\n3. A rábeszélt fél feladata: nevezze meg a trükköt („Ez a gyávázás!”), és válaszoljon rá úgy, hogy közben nem bántja a másikat. A megfigyelő pontoz: felismerte-e a trükköt, és mennyire volt határozott a válasz.\n4. Minden kör után szerepcsere, összesen három kör. A végén a csoportok összegyűjtik a legjobb válaszokat, és felírják a táblára.\n5. Feldolgozás: Melyik trükk hatott rád a legjobban, és miért? Mit változtat, ha meg tudod nevezni a trükköt? Melyik trükkel találkozol a legtöbbször a valóságban, és mi lesz a válaszod legközelebb?", "caution": "A kérések legyenek ártalmatlanok, és a rábeszélők ne legyenek túl erőszakosak. A játék után mindenki lépjen ki a szerepéből.", "variants": null}, {"id": "VC15-81", "theme_id": "t15", "name": "Feszít–elenged", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Könnyű", "grade": "8", "description": "Felismerjük, hol ül a stressz a testünkben, és kipróbálunk egy egyszerű izomlazító technikát.", "tools": "székek vagy matracok, nyugodt zene (nem kötelező)", "keywords": "stressz, test, izomlazítás, relaxáció, testtudat", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: hol érzitek a stresszt a testetekben? (Váll, gyomor, állkapocs, fej.) Gyűjtsétek a táblára.\n2. Vezesd végig a progresszív izomlazítást: 5 másodpercig erősen megfeszítik az adott izmot, aztán elengedik és 10 másodpercig figyelik a különbséget. Sorrend: ököl, kar, váll, arc, has, láb.\n3. Utána egy perc csend, csak légzés.\n4. Mindenki egy 1-től 10-ig tartó skálán megmondja (ujjakkal), mennyire feszült a gyakorlat előtt és után.\n5. Feldolgozás: Melyik testrészed volt a legfeszültebb? Mikor tudnád ezt használni (este, dolgozat előtt, edzés után)? Mi az a rövid változat, amit a padban ülve is meg tudsz csinálni?", "caution": "Akinek fájdalma vagy sérülése van, ne feszítse meg azt a testrészt. A csukott szem nem kötelező.", "variants": null}, {"id": "VC15-82", "theme_id": "t15", "name": "Nem a jegyem vagyok", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "8", "description": "Szétválasztjuk a teljesítményt és az önértéket: egy rossz jegy egy dolgozatról szól, nem rólam mint emberről.", "tools": "mondatkártyák, két doboz: „Rólam szól” / „A teljesítményemről szól”", "keywords": "önérték, teljesítmény, jegyek, kudarc, önelfogadás", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Olvasd fel: „Hármast kaptam matekból, tehát hülye vagyok.” Kérdezd meg: mi a hiba ebben a mondatban?\n2. Kiscsoportok kapnak mondatkártyákat, és szétválogatják: melyik szól a teljesítményről, és melyik ítéli meg az egész embert?\n3. Az egész embert ítélő mondatokat átírják teljesítményről szóló mondatokká (pl. „Ezt a témát még nem értem, gyakorolnom kell.”).\n4. Beszéljétek meg: mi minden tesz értékessé egy embert a jegyein kívül?\n5. Feldolgozás: Mikor mondtál magadnak ilyen mondatot? Mit mondanál egy barátodnak egy rossz jegy után? Mi az, amiért értékes vagy, és amit semmilyen jegy nem mér?", "caution": "Figyelj azokra, akik nagyon szigorúak magukkal. Ha valaki kitartóan értéktelennek érzi magát, beszélj vele négyszemközt.", "variants": null}, {"id": "VC16-81", "theme_id": "t16", "name": "Mi érdekel igazán?", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Könnyű", "grade": "8", "description": "Feltérképezzük az érdeklődésünket: mi az, amiben elfelejtjük az időt, és milyen tantárgyak, hobbik, szakmák kapcsolódnak hozzá.", "tools": "A3-as lapok, filcek", "keywords": "érdeklődés, motiváció, pályaorientáció, hobbi, flow", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: mikor felejtetted el legutóbb az időt, mert annyira belemerültél valamibe?\n2. Mindenki a lap közepére írja a 2–3 legjobban szeretett tevékenységét, köré pedig ágakat rajzol: milyen tantárgy, milyen hobbi, milyen szakma kapcsolódhat hozzá.\n3. Párban megmutatják egymásnak a térképüket, és a párjuk hozzáír még egy ötletet.\n4. Gyűjtsetek közösen meglepő szakmákat, amelyek egy-egy hobbiból nőhetnek ki.\n5. Feldolgozás: Mi lepett meg a saját térképeden? Kitől tudnál többet megtudni egy szakmáról? Mit próbálnál ki szívesen a nyáron vagy szakkörön?", "caution": "Hangsúlyozd: 8.-ban még nem kell tudni, mi leszel. A cél a kíváncsiság, nem a döntés.", "variants": null}, {"id": "VC16-82", "theme_id": "t16", "name": "Amit egy rossz döntés tanított", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "8", "description": "Megbeszéljük, hogy a rossz döntés is tanít valamit, és hogyan lehet hibákból tanulni ahelyett, hogy szégyellnénk őket.", "tools": "cetlik, tábla", "keywords": "hibázás, tanulás, fejlődési szemlélet, döntéshozatal, önelfogadás", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mesélj egy saját, nem túl személyes példát egy rossz döntésről és arról, mit tanultál belőle.\n2. Mindenki felír egy kis rossz döntést (pl. kihagytam a tanulást, rossz cipőt vettem fel a kirándulásra, elhalasztottam egy bocsánatkérést), és mellé: mit tanultam belőle?\n3. A cetliket névtelenül összegyűjtöd és felolvasod. A csoport minden tanulságot egy szóval összefoglal.\n4. Beszéljétek meg a „még” szó erejét: „Nem tudom” helyett „Még nem tudom”.\n5. Feldolgozás: Miért szégyelljük a hibáinkat? Mit tanultál a legtöbbet egy hibádból? Ki az a felnőtt, akitől megkérdeznéd, mit tanult a saját hibáiból?", "caution": "A cetlik maradjanak névtelenek. Ügyelj, hogy ne kerüljenek elő súlyos, fájdalmas döntések a csoport előtt.", "variants": null}, {"id": "VC17-81", "theme_id": "t17", "name": "Az évem görbéje", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Könnyű", "grade": "8", "description": "Megrajzoljuk az évünk hangulati görbéjét a csúcsokkal és a mélypontokkal, és megnézzük, mi segített továbblépni.", "tools": "A4-es lapok, színes ceruzák, a hónapok a lap alján", "keywords": "visszatekintés, tanév, hangulat, megküzdés, emlékek", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mindenki megrajzolja a tanév görbéjét szeptembertől júniusig: fent a jó időszakok, lent a nehezebbek.\n2. A csúcsokhoz és a völgyekhez egy-egy szót ír: mi történt?\n3. Minden völgy után odaírja: mi segített kijönni belőle? (Ember, tevékenység, idő.)\n4. Párban megmutatják egymásnak a görbét, csak amennyit szeretnének.\n5. Feldolgozás: Mi volt az év legjobb pillanata? Mi segített a legtöbbet a nehéz időszakokban? Mit viszel magaddal ebből a jövő évre?", "caution": "A völgyekről csak annyit kell elmondani, amennyit valaki szeretne. Figyelj azokra, akiknek a görbéje végig lent marad.", "variants": null}, {"id": "VC17-82", "theme_id": "t17", "name": "Bőrönd és kuka", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Könnyű", "grade": "8", "description": "Mindenki eldönti, mit visz magával a jövő évre (szokás, tanulság, kapcsolat), és mit hagy itt (rossz szokás, félelem, sérelem).", "tools": "egy bőrönd- és egy kukarajz a táblán vagy két doboz, cetlik", "keywords": "lezárás, szokások, tanulságok, elengedés, újrakezdés", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mindenki két cetlit ír: egy dolgot, amit elvisz a jövő évre, és egy dolgot, amit itt hagy.\n2. A „bőröndös” cetliket felolvashatják, és beteszik a bőröndbe.\n3. A „kukás” cetliket senki nem olvassa fel: összegyűrik és bedobják a kukába.\n4. A végén a bőröndből felolvasol néhány cetlit névtelenül.\n5. Feldolgozás: Milyen érzés volt bedobni a cetlit a kukába? Mi segít, hogy a bőröndös dolog tényleg veled maradjon? Mit vinnél el a csoportból?", "caution": "A kukás cetliket ne olvasd el, és a gyakorlat után dobd ki őket a diákok előtt.", "variants": null}, {"id": "VC01-91", "theme_id": "t01", "name": "Íratlan szabályaink", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "9", "description": "Feltérképezzük azokat a szabályokat, amelyeket senki nem írt le, mégis mindenki betart a csoportban és az iskolában, és eldöntjük, melyik segít és melyik árt.", "tools": "cetlik két színben, tábla", "keywords": "íratlan szabályok, normák, csoportkultúra, biztonság, változtatás", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: mi az, amit itt mindenki tud, de sehol nincs leírva? Mondj példát: „Az első padba senki nem ül önként.” „A tanári előtt csendben megyünk el.”\n2. Mindenki ír 2–3 íratlan szabályt a csoportról vagy az iskoláról (névtelenül).\n3. A cetliket felolvasod, a csoport két oszlopba rendezi őket: „Segít” és „Árt”.\n4. Kiscsoportok kiválasztanak egy ártó szabályt, és kitalálják, mivel lehetne felváltani.\n5. Feldolgozás: Ki tanította meg nekünk ezeket a szabályokat? Mit jelent ez egy újonnan érkezőnek? Melyik íratlan szabályt írnátok be a csoportszerződésbe?", "caution": "Ügyelj, hogy a szabályok ne konkrét emberekről szóljanak. Ha bántó normák kerülnek elő, kezeld őket komolyan.", "variants": null}, {"id": "VC02-91", "theme_id": "t02", "name": "Az érzés színe és formája", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "9", "description": "Egy érzést színnel, formával és mozgással ábrázolunk, így olyasmit is ki tudunk fejezni, amire nincs pontos szavunk.", "tools": "A4-es lapok, zsírkréta vagy pasztell", "keywords": "érzelmek kifejezése, vizuális kifejezés, metafora, önismeret", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: hogyan írnátok le a szorongást valakinek, aki még sosem érezte? Nehéz szavakkal.\n2. Mindenki kiválaszt egy érzést (pl. izgalom, csalódottság, nyugalom, irigység), és szavak nélkül lerajzolja: milyen színű, milyen formájú, hol van a lapon, mozog-e.\n3. A rajzokat kiteszitek, és a többiek tippelnek, melyik érzés lehet.\n4. A rajzolók elmondják, miért ezt a színt és formát választották.\n5. Feldolgozás: Miben segít, ha képben gondolunk egy érzésre? Volt-e olyan, amit más érzésnek láttatok? Mi a te érzésed színe ma?", "caution": "A rajzot nem értékeljük művészileg. Ha valaki nehéz érzést választ, ne kérdezz rá túlságosan a csoport előtt.", "variants": null}, {"id": "VC02-92", "theme_id": "t02", "name": "Elkapom a hangulatod?", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "9", "description": "Megnézzük, hogyan „ragad át” a hangulat egyik emberről a másikra, és mit tehetünk, hogy ne sodorjon el mások rossz kedve.", "tools": "két-három beavatott diák, stopper", "keywords": "érzelmi ragály, hangulat, csoportdinamika, határok, tudatosság", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Előre kérj meg két diákot, hogy az alkalom elején 2 percig nagyon lelkesek legyenek, aztán két másikat, hogy 2 percig unottak és morcosak.\n2. Kezdj egy semleges feladatot (pl. közösen tervezzétek meg egy osztálykirándulás programját), és figyeljétek, mi történik a beavatottak hatására.\n3. Fedd fel a kísérletet. Kérdezd meg: mit vettetek észre magatokon?\n4. Magyarázd el röviden: az emberek öntudatlanul is utánozzák egymás arckifejezését és hangulatát. Gyűjtsétek össze: kinek a hangulata ragad át rátok leginkább?\n5. Feldolgozás: Mikor jó, ha átvesszük valaki hangulatát, és mikor nem? Hogyan tudsz együttérző lenni úgy, hogy közben nem húz le valaki rossz kedve? Milyen hangulatot viszel be te egy terembe?", "caution": "A beavatott diákokat köszönd meg, és mondd ki, hogy csak szerepet játszottak.", "variants": null}, {"id": "VC03-91", "theme_id": "t03", "name": "Ha nem tudom kiverni a fejemből", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "9", "description": "Megismerjük a rágódást: miért pörgünk egy gondolaton újra és újra, és milyen technikák segítenek kilépni belőle.", "tools": "A4-es lapok, tábla", "keywords": "rágódás, gondolatok, aggódás, figyelemváltás, önszabályozás", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: volt már, hogy egy mondat vagy egy kínos helyzet egész este pörgött a fejedben? Hogyan nézett ki ez belülről?\n2. Mutass be három technikát: 1. Aggódás-idő: napi 10 percet kijelölök az aggódásra, a többi időben elhalasztom. 2. Leírás: kiírom a gondolatot, és megkérdezem magam, mit tehetek most. 3. Figyelemváltás: valami, ami teljesen leköti a figyelmem (mozgás, beszélgetés, zene).\n3. Kiscsoportok kapnak egy helyzetet (pl. egy kínos mondat órán; egy üzenet, amire nem jött válasz; egy közelgő dolgozat), és kipróbálják gondolatban mindhárom technikát.\n4. Megbeszélik, melyik működne nekik és miért.\n5. Feldolgozás: Mi a különbség a gondolkodás és a rágódás között? Melyik technikát próbálod ki ezen a héten? Kinek tudod elmondani, ha napokig nem tudsz kilépni egy gondolatból?", "caution": "Ha valaki tartós, nyomasztó gondolatokról beszél, vedd komolyan, beszélj vele négyszemközt, és irányítsd szakemberhez.", "variants": null}, {"id": "VC03-92", "theme_id": "t03", "name": "Mire van hatásom?", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "9", "description": "Három körbe soroljuk, ami foglalkoztat: amit irányítani tudok, amire hatással lehetek, és amin nem tudok változtatni.", "tools": "A4-es lapok három koncentrikus körrel", "keywords": "kontroll, hatáskör, elfogadás, stressz, cselekvés", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Rajzolj három kört egymásba: belül „Irányítom”, középen „Hatással lehetek rá”, kívül „Nem tudok változtatni rajta”.\n2. Mindenki felír 6–8 dolgot, ami mostanában foglalkoztatja (pl. jegyek, időjárás, egy barát viselkedése, saját alvásom), és elhelyezi őket a körökben.\n3. Párban megnézik egymás köreit: valóban jó helyen vannak a dolgok?\n4. Beszéljétek meg: hová megy el a legtöbb energiánk? Mit tehetünk a külső körrel (elfogadás, elengedés)?\n5. Feldolgozás: Melyik körben van a legtöbb dolgod? Mi az az egy dolog a belső körből, amivel ezen a héten foglalkozol? Mit engedsz el a külső körből?", "caution": "Hangsúlyozd: a külső körben lévő dolgok is fájhatnak, és ez rendben van. Az elfogadás nem azt jelenti, hogy nem számít.", "variants": null}, {"id": "VC04-91", "theme_id": "t04", "name": "Ki vagyok különböző helyeken?", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "9", "description": "Összegyűjtjük, milyen szerepeink vannak (barát, testvér, sportoló, diák), mennyire vagyunk ugyanazok mindenhol, és melyik szerepben érezzük magunkat a legjobban önmagunknak.", "tools": "A4-es lapok, színes ceruzák", "keywords": "szerepek, identitás, hitelesség, önismeret, kontextus", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mindenki a lap közepére írja a nevét, köré pedig a szerepeit (pl. nagytestvér, csapattag, osztálytárs, online én).\n2. Minden szerep mellé felírja, milyen olyankor (pl. hangos, türelmes, vicces, csendes).\n3. Bekarikázza azt a szerepet, amelyben a leginkább önmaga, és aláhúzza azt, amelyben a legkevésbé.\n4. Párban beszélgetnek: mi az, ami minden szerepemben ugyanaz?\n5. Feldolgozás: Rendben van-e, hogy máshol másmilyenek vagyunk? Mikor válik ez megterhelővé? Mi az, ami a legmélyebben te vagy, bárhol is vagy?", "caution": "Senkinek ne kelljen megmutatnia a teljes lapot. Az „online én” témánál kerüld az ítélkezést.", "variants": null}, {"id": "VC05-91", "theme_id": "t05", "name": "Beszélőkör", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "9", "description": "Beszélőtárggyal tartunk kört: csak az beszél, akinél a tárgy van, a többiek teljes figyelemmel hallgatnak, és senki nem reagál, nem tanácsol.", "tools": "egy beszélőtárgy (kő, labda, plüss)", "keywords": "beszélőkör, figyelem, tisztelet, meghallgatás, közösség", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mondd el a szabályokat: csak az beszél, akinél a tárgy van; a többiek nem szólnak közbe és nem kommentálnak; passzolni lehet; ami itt elhangzik, itt marad.\n2. Első kör (bemelegítés): Mi volt a héten egy jó pillanat?\n3. Második kör (mélyebb kérdés): Mi az, amit szeretnél, ha többen tudnának rólad? vagy Mi foglalkoztat mostanában?\n4. Harmadik kör: Mit vettél észre a többiek történeteiben?\n5. Feldolgozás: Milyen volt úgy beszélni, hogy senki nem szólt közbe? Milyen volt úgy hallgatni, hogy nem reagálhattál? Hol lenne jó ilyen kört tartani máskor is?", "caution": "A második kör kérdését a csoport hangulatához igazítsd. Te is vegyél részt a körben, de rövid válaszokkal.", "variants": null}, {"id": "VC06-91", "theme_id": "t06", "name": "Névtelen gondok fala", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Mély", "grade": "9", "description": "Névtelenül felírjuk a mostani kisebb-nagyobb gondjainkat, a többiek pedig együttérző üzeneteket ragasztanak melléjük.", "tools": "két színű öntapadós cetli, falfelület vagy csomagolópapír", "keywords": "empátia, névtelenség, támogatás, közösség, együttérzés", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mindenki ír egy cetlire egy dolgot, ami mostanában nehéz neki (iskola, barátok, család, magam). Nem kell nagy dolog, és nem kell a saját kézírásával, nyomtatott betűkkel is írhat.\n2. A cetliket összekevered, és felragasztod a falra.\n3. Mindenki körbejár, elolvassa őket, és legalább három cetli mellé ír egy másik színű cetlire együttérző üzenetet (nem tanácsot): pl. „Ez nagyon nehéz lehet.” „Nem vagy egyedül.”\n4. Közösen elolvassátok, mennyi gond hasonlít egymásra.\n5. Feldolgozás: Meglepett, hogy mások mivel küzdenek? Milyen volt együttérző üzenetet írni? Ha a saját cetlid mellett üzenetet láttál, milyen érzés volt?", "caution": "Olvasd el a cetliket, mielőtt felragasztod őket. Ha veszélyre utaló üzenet van köztük (önsértés, bántalmazás), ne tedd ki, és kérj segítséget az iskolapszichológustól.", "variants": null}, {"id": "VC07-91", "theme_id": "t07", "name": "A düh mögötti kérés", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "9", "description": "Dühös mondatokból kibontjuk, mit szeretne valójában a beszélő, és kéréssé fogalmazzuk őket.", "tools": "mondatkártyák dühös mondatokkal", "keywords": "düh, kérés, szükséglet, EMK, átfogalmazás", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Olvass fel egy mondatot: „Soha nem figyelsz rám!” Kérdezd meg: mit szeretne valójában, aki ezt mondja? (Figyelmet, időt, hogy meghallgassák.)\n2. Kiscsoportok kapnak mondatkártyákat (pl. „Mindig én csinálok mindent!” „Hagyj már békén!” „Tök mindegy, úgysem érdekel senkit!”).\n3. Minden mondatnál megkeresik: mit érez a beszélő, mire van szüksége, és mit kérhetne helyette.\n4. Néhány csoport eljátssza az eredeti és az új változatot.\n5. Feldolgozás: Miért könnyebb dühösen mondani, mint kérni? Melyik mondatot hallod a legtöbbször otthon vagy a barátaidtól? Mit kérnél valakitől ezen a héten?", "caution": "A düh nem rossz érzés, csak a kifejezése árthat. Ezt mondd ki.", "variants": null}, {"id": "VC08-91", "theme_id": "t08", "name": "Fórumszínház", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Mély", "grade": "9", "description": "Egy rövid konfliktusjelenetet eljátszunk, a nézők pedig megállíthatják, beléphetnek egy szereplő helyére, és kipróbálhatnak más megoldást.", "tools": "jelenetvázlat, kevés kellék", "keywords": "fórumszínház, konfliktus, alternatívák, bátorság, szerepjáték", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Önként jelentkezők eljátszanak egy rövid jelenetet, ami rosszul végződik (pl. egy diákot kihagynak egy csoportmunkából, és a végén ő kapja a rossz jegyet).\n2. Játsszátok el újra. Most bárki kiálthat „Állj!”-t, beléphet egy szereplő helyére (nem a bántóéba), és kipróbálhat egy másik megoldást.\n3. Minden beavatkozás után kérdezd meg a csoportot: mi változott? Reális volt-e?\n4. 3–4 beavatkozás után állítsátok le a jelenetet.\n5. Feldolgozás: Melyik megoldás tűnt a legreálisabbnak? Mi kellett ahhoz, hogy valaki belépjen? Hol tudnál a valóságban is így belépni?", "caution": "A végén mindenki lépjen ki a szerepéből. Ügyelj, hogy a bántó szereplőt ne mindig ugyanaz játssza.", "variants": null}, {"id": "VC08-92", "theme_id": "t08", "name": "Három válasz egy helyzetre", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "9", "description": "Ugyanarra a helyzetre passzív, agresszív és asszertív választ adunk, és megnézzük, melyik mit vált ki.", "tools": "helyzetkártyák, a három stílus leírása a táblán", "keywords": "asszertivitás, passzivitás, agresszió, kommunikáció, önérvényesítés", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mutasd be a három stílust: passzív (lenyelem, hogy ne legyen baj), agresszív (rátámadok a másikra), asszertív (kiállok magamért úgy, hogy a másikat is tisztelem).\n2. Olvass fel egy helyzetet (pl. valaki eléd áll a büfénél; a csoportmunkában a te ötletedet más mondja el a sajátjaként).\n3. Hármas csoportok mindhárom választ megfogalmazzák és eljátsszák.\n4. A csoport megbeszéli: mit érez a másik fél az egyes válaszokra, és mi lesz a helyzet vége?\n5. Feldolgozás: Melyik stílus a te alapbeállításod? Miért nehéz asszertívnak lenni? Melyik helyzetben gyakorolnád ezen a héten?", "caution": "Hangsúlyozd, hogy néha a passzív válasz is jó döntés lehet (pl. veszélyes helyzetben).", "variants": null}, {"id": "VC09-91", "theme_id": "t09", "name": "Mindenkinél egy darab", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "9", "description": "Egy feladványt csak úgy lehet megoldani, ha mindenki megosztja a nála lévő információt. Megnézzük, mi segíti a közös gondolkodást.", "tools": "feladvány darabjai cetliken (pl. egy rejtvény, ahol mindenki egy-egy nyomot kap)", "keywords": "csapatmunka, információmegosztás, kommunikáció, figyelem, közös probléma", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Készíts elő egy rejtvényt (pl. „Ki melyik házban lakik?” típusú logikai feladvány), és bontsd szét a nyomokat úgy, hogy egy 5–6 fős csoportban mindenkinél 1–2 legyen.\n2. Szabály: a nyomokat csak szóban lehet megosztani, a cetlit nem lehet megmutatni.\n3. A csoportok 15 percig dolgoznak a megoldáson.\n4. Ha kész, a csoport elmagyarázza, hogyan jutottak el a megoldásig.\n5. Feldolgozás: Hogyan szerveződtetek meg? Volt-e, akinek a nyomát elfelejtették meghallgatni? Mi segítette és mi akadályozta a közös gondolkodást? Hol hasonlít ez egy iskolai csoportmunkára?", "caution": "Figyeld, hogy a csendesebbek nyomai is elhangozzanak. Ezt a feldolgozásban is érdemes szóba hozni.", "variants": null}, {"id": "VC10-91", "theme_id": "t10", "name": "Ami a nehézből jött", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Mély", "grade": "9", "description": "Egy nehéz élményre visszatekintve megkeressük, mit tanultunk belőle, vagy mi jó született belőle, anélkül hogy a nehezet szépítenénk.", "tools": "A4-es lapok", "keywords": "hála, átkeretezés, reziliencia, tanulás, megküzdés", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mondd el: néha egy nehéz helyzetből is születik valami, amiért később hálásak vagyunk (egy új barát, egy erősség, egy tanulság). Ez nem jelenti azt, hogy a nehéz jó volt.\n2. Mindenki felidéz egy múltbeli, már lezárt kisebb nehézséget, és felírja: Mi volt nehéz? Mit tanultam? Ki segített? Mi lett belőle?\n3. Párban, aki szeretné, megosztja a történetét, csak amennyit akar.\n4. Közösen gyűjtsétek össze a „tanulságokat” névtelenül a táblára.\n5. Feldolgozás: Miért fontos, hogy a nehezet ne szépítsük? Mire vagy hálás egy nehéz időszakból? Kinek köszönnéd meg, hogy akkor melletted volt?", "caution": "Kérd, hogy már lezárt, nem friss nehézséget válasszanak. Senkit ne kényszeríts arra, hogy egy fájdalmas élményben a jót keresse.", "variants": null}, {"id": "VC12-91", "theme_id": "t12", "name": "Amikor eltávolodunk", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "9", "description": "Beszélünk arról, hogy a barátságok változnak, és hogyan lehet jól kezelni, ha eltávolodunk valakitől, vagy valaki tőlünk.", "tools": "történetkártyák", "keywords": "barátság, változás, elengedés, kapcsolatok, gyász", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: ki az, aki 5 évvel ezelőtt a legjobb barátod volt? Most is az? (Csak gondolatban válaszoljanak.)\n2. Kiscsoportok kapnak egy történetet (pl. a barátod új társaságba került és ritkán keres; te kerültél új csapatba, és a régi barátod megsértődött; egy barátság egy vita után kihűlt).\n3. Megbeszélik: mit érezhet a két fél? Mit lehet tenni? Mikor érdemes harcolni egy barátságért, és mikor elengedni?\n4. Gyűjtsétek a táblára, hogyan lehet szépen eltávolodni (pl. nem kibeszélni, köszönni, nyitva hagyni az ajtót).\n5. Feldolgozás: Rendben van-e, hogy a barátságok változnak? Mit tanítottak neked a régi barátságaid? Kit keresnél meg szívesen újra?", "caution": "Ha valakinek friss, fájdalmas barátságvesztése van, kezeld óvatosan, és ne kérj tőle történetet.", "variants": null}, {"id": "VC12-92", "theme_id": "t12", "name": "Pöttyök", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Mély", "grade": "9", "description": "Egy szavak nélküli csoportosulási játékon keresztül megtapasztaljuk, milyen érzés bekerülni vagy kimaradni, és hogyan alakulnak ki a klikkek.", "tools": "színes öntapadós pöttyök (néhány szín sokszor, egy-két szín csak egyszer)", "keywords": "kirekesztés, klikkek, csoportosulás, befogadás, tapasztalati tanulás", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mindenki becsukja a szemét, te pedig a homlokukra ragasztasz egy pöttyöt. A legtöbben valamelyik gyakori színt kapják, egy-két ember egyedi színt.\n2. Szabály: beszélni nem szabad, csak egy feladat van: „Alkossatok csoportokat.” (Ne mondd meg, mi alapján.)\n3. Figyeld meg, hogyan csoportosulnak, és mi történik az egyedi pöttyösökkel. Kb. 3 perc után állítsd le.\n4. Kérdezd meg először az egyedi pöttyösöket: mit éreztek? Aztán a többieket: miért szín szerint csoportosultatok, ha nem ez volt a feladat?\n5. Feldolgozás: Hol látunk ilyet a valóságban? Mi alapján csoportosulunk (stílus, zene, lakóhely)? Mit tehettek volna a többiek a magányos pöttyösökért? Mit viszel ebből az osztályba?", "caution": "Az egyedi pöttyöt olyan diák kapja, akiről tudod, hogy jól bírja. Soha ne olyan, aki valóban kívülálló a csoportban. A gyakorlat után mindenkit hozz vissza a körbe.", "variants": null}, {"id": "VC13-91", "theme_id": "t13", "name": "Kirakat és raktár", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "9", "description": "A közösségi médiában a kirakatot látjuk, nem a raktárt. Megnézzük, hogyan hat ránk az összehasonlítás, és mit tehetünk ellene.", "tools": "két rajz a táblán: kirakat és raktár, cetlik", "keywords": "összehasonlítás, közösségi média, önértékelés, valóság, irigység", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Rajzolj egy kirakatot (szép, rendezett) és egy raktárt (kupi, dobozok). Mondd el: online a többiek kirakatát látjuk, de a saját raktárunkkal hasonlítjuk össze.\n2. Mindenki felír egy-egy példát: mi kerül egy posztba (kirakat), és mi marad ki belőle (raktár)? Pl. a nyaralásfotó 30 próbálkozásból, a veszekedés előtte.\n3. Kiscsoportok összegyűjtik, milyen érzéseket kelt bennünk a kirakatok nézegetése.\n4. Kitalálnak 3 „ellenszert” (pl. kikövetni, ami rosszul esik; emlé
