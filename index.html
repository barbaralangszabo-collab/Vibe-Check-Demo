keztetni magam a raktárra; offline barátokkal lenni).\n5. Feldolgozás: Kinek a kirakatával hasonlítod össze magad a legtöbbször? Mit posztolnál, ha a raktárt is megmutatnád? Melyik ellenszert próbálod ki?", "caution": "A testképpel kapcsolatos összehasonlítást óvatosan kezeld. Ha étkezési problémára utaló jelet látsz, beszélj a diákkal négyszemközt, és kérj szakmai segítséget.", "variants": null}, {"id": "VC14-91", "theme_id": "t14", "name": "Amit nem adok fel", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "9", "description": "Megnézzük, miért olyan fontos tartozni valahová, és mi az a néhány érték, amit akkor sem adnánk fel, ha a társaság mást várna.", "tools": "A4-es lapok, tábla", "keywords": "összetartozás, értékek, kortárs nyomás, határok, önazonosság", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: miért olyan fontos, hogy valahová tartozzunk? Mi történik, ha kimaradunk? Gyűjtsétek a táblára.\n2. Mindenki felír 3 dolgot, amit szívesen megtenne a társasága kedvéért (pl. elmegy egy koncertre, amit nem szeret), és 3 dolgot, amit soha (pl. bántani valakit, hazudni a szüleinek valami fontosról).\n3. Párban beszélgetnek: hol a határ a kettő között? Mi dönti el?\n4. Közösen gyűjtsétek össze, mit lehet mondani, ha a társaság a „soha” listádról kér valamit.\n5. Feldolgozás: Mit veszítesz, ha feladod azt, ami fontos neked? Milyen az a barát, aki elfogadja a nemedet? Mi az a mondat, amit magadnak mondasz, amikor kitartasz?", "caution": "Ne kérd, hogy a „soha” listát a csoport előtt felolvassák.", "variants": null}, {"id": "VC15-91", "theme_id": "t15", "name": "Az alvás titkai", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Könnyű", "grade": "9", "description": "Megnézzük, hogyan hat az alvás a hangulatra, a tanulásra és a stresszre, és mindenki kitalál egy kis változtatást.", "tools": "kvízkérdések, A4-es lapok", "keywords": "alvás, stressz, egészség, szokások, tanulás", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Kezdj egy rövid igaz–hamis kvízzel (pl. „A kamaszoknak 8–10 óra alvás kell.” „A telefon kék fénye segít elaludni.” „Hétvégén be lehet hozni a hét alváshiányát.”).\n2. Beszéljétek meg a válaszokat: mit tesz az agy alvás közben (rendezi a tanultakat, szabályozza az érzelmeket)?\n3. Mindenki felírja az átlagos lefekvési és ébredési idejét, és kiszámolja, mennyit alszik.\n4. Kiscsoportok összegyűjtik, mi segít elaludni és mi tart ébren.\n5. Feldolgozás: Mennyit alszol egy átlagos hétköznap? Mi az, ami a legtöbbször ébren tart? Mi az az egy kis változtatás, amit ezen a héten kipróbálsz?", "caution": "Ha valaki tartós alvászavarról vagy éjszakai szorongásról beszél, irányítsd iskolaorvoshoz vagy pszichológushoz.", "variants": null}, {"id": "VC15-92", "theme_id": "t15", "name": "Támaszpontjaim", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "9", "description": "Feltérképezzük, kire és mire támaszkodhatunk, ha nehéz: emberekre, helyekre, tevékenységekre és szakemberekre.", "tools": "A4-es lapok, színes ceruzák, iskolai segítők elérhetősége", "keywords": "támogatás, segítségkérés, kapcsolati háló, stressz, biztonság", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mindenki a lap közepére rajzolja magát, köré négy kört: emberek, helyek, tevékenységek, szakemberek.\n2. Kitöltik: ki az, akit felhívhatok? Hol érzem magam biztonságban? Mi tölt fel? Melyik felnőtthöz vagy szakemberhez fordulhatok?\n3. Párban megnézik, melyik kör a legüresebb, és ötletet adnak egymásnak.\n4. Mutasd meg az iskola segítőinek elérhetőségét (iskolapszichológus, védőnő, osztályfőnök), és mondd el, hogyan lehet hozzájuk fordulni.\n5. Feldolgozás: Melyik támaszpontodat használod túl ritkán? Mi tart vissza a segítségkéréstől? Mit mondanál egy barátodnak, aki nem mer segítséget kérni?", "caution": "Ha valakinek nagyon üres a térképe, figyelj rá, és beszélj vele négyszemközt.", "variants": null}, {"id": "VC16-91", "theme_id": "t16", "name": "Jó kockázat, rossz kockázat", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "9", "description": "Megkülönböztetjük az egészséges kockázatot (ami fejleszt) a veszélyestől (ami árthat), és megnézzük, mi alapján döntünk.", "tools": "skála a padlón (1 = jó kockázat, 10 = veszélyes kockázat), helyzetkártyák", "keywords": "kockázatvállalás, bátorság, döntés, következmények, biztonság", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Olvass fel helyzeteket (pl. jelentkezem egy versenyre; kipróbálok egy új sportot; éjjel egyedül hazamegyek egy ismeretlen helyről; megszólalok egy vitában; felülök egy idegen autójába). Mindenki odaáll a skálán, ahová szerinte tartozik.\n2. Beszéljétek meg az eltéréseket.\n3. Gyűjtsétek össze a jó kockázat ismérveit: tanulok belőle, legrosszabb esetben is csak kellemetlen, nem veszélyes, magam döntöm el.\n4. Mindenki felír egy jó kockázatot, amit szívesen vállalna ebben az évben.\n5. Feldolgozás: Miért vonzó néha a veszélyes kockázat? Ki segít eldönteni, mi veszélyes? Mi a te jó kockázatod?", "caution": "A veszélyes helyzetekről ne tarts kioktató előadást: kérdezz, és hagyd, hogy a csoport gondolja végig.", "variants": null}, {"id": "VC16-92", "theme_id": "t16", "name": "Egy cél, öt lépés", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Könnyű", "grade": "9", "description": "Egy saját célt konkrét, mérhető lépésekre bontunk, és megtervezzük az első lépést a következő hétre.", "tools": "A4-es lapok", "keywords": "célkitűzés, tervezés, motiváció, lépések, kitartás", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mindenki kiválaszt egy célt erre a félévre (tanulás, sport, kapcsolat, hobbi).\n2. Átírja konkrétra: Mit pontosan? Meddig? Honnan tudom, hogy sikerült?\n3. Felírja öt lépésben az utat a célig, az elsőt a legkisebbre véve.\n4. Párban elmondják egymásnak az első lépést és azt, mi akadályozhatja meg. Megbeszélik, mit tesznek, ha az akadály jön.\n5. Feldolgozás: Mi volt nehéz a cél konkrétra fogalmazásában? Mi az első lépésed, és mikor teszed meg? Ki az, aki szurkolhat neked?", "caution": "A célok maradjanak a diákoké. Ne értékeld őket a csoport előtt.", "variants": null}, {"id": "VC17-91", "theme_id": "t17", "name": "Tanácsok az új 9.-eseknek", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Könnyű", "grade": "9", "description": "Visszatekintünk a 9. évre, és tanácsokat írunk a jövő évi 9.-eseknek: mit érdemes tudni, mitől ne féljenek.", "tools": "A4-es lapok, csomagolópapír", "keywords": "visszatekintés, tanácsadás, tapasztalat, lezárás, közösség", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: mit tudtok most, amit szeptemberben jó lett volna tudni?\n2. Kiscsoportok témákat kapnak (tanulás, barátok, tanárok, Csibe-alkalmak, stressz), és mindegyikhez 3–5 tanácsot írnak.\n3. A tanácsokat közös plakátra vagy lapra gyűjtitek „Útmutató az új 9.-eseknek” címmel.\n4. A plakátot jövőre megmutathatod az új 9.-eseknek.\n5. Feldolgozás: Melyik tanács szól valójában neked is? Mi az, amire büszke vagy ebből az évből? Mit csinálnál másképp, ha újrakezdhetnéd?", "caution": "Nézd át a tanácsokat, mielőtt továbbadod, hogy ne legyen bennük bántó vagy kínos részlet.", "variants": null}, {"id": "VC17-92", "theme_id": "t17", "name": "Közös vers az évről", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Könnyű", "grade": "9", "description": "Mindenki ír egy sort az évről, és ezekből közös verset állítunk össze, amit a végén felolvasunk.", "tools": "papírcsíkok, ragasztó, nagy lap", "keywords": "kreatív írás, lezárás, közösség, emlékek, búcsú", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mindenki kap két papírcsíkot. Az egyikre egy mondatot ír arról, milyen volt ez az év, a másikra egy mondatot arról, mit kíván a csoportnak.\n2. A csíkokat összegyűjtöd, és a csoport közösen rakja őket sorrendbe egy nagy lapon, hogy vershez hasonló szöveg legyen belőle.\n3. Választhatnak egy címet.\n4. Egy önként jelentkező vagy te felolvasod a verset.\n5. Feldolgozás: Melyik sor tetszett a legjobban? Mi az, amit a vers jól elmond az évről? Mit kívánsz a csoportnak a 10. évre?", "caution": "Ügyelj, hogy minden sor bekerüljön. A verset kiteheted a terembe.", "variants": null}, {"id": "VC01-101", "theme_id": "t01", "name": "Megújított megállapodás", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "10", "description": "A gimnázium felénél újragondoljuk a csoport megállapodásait: mi vált be, mi kopott ki, és mire van most szükségünk.", "tools": "a korábbi csoportszerződés (ha megvan), cetlik három színben", "keywords": "csoportszerződés, megújítás, felelősség, közös szabályok, felnövés", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Tedd ki a korábbi szerződést, vagy kérd, hogy idézzék fel, milyen szabályaik voltak.\n2. Mindenki három színű cetlire ír: zöld – ami működik, maradjon; sárga – ami kikopott, de kellene; piros – ami már nem illik hozzánk.\n3. A cetliket felragasztjátok, és közösen csoportosítjátok.\n4. Kiscsoportok megfogalmaznak 1–2 új pontot, amire most, 10.-esként van szükség (pl. a telefonhasználat, a mélyebb beszélgetések bizalma).\n5. Feldolgozás: Mi változott a csoportban 7. óta? Mit jelent felelősnek lenni egy csoportért? Ki vállal a csoportban valamit azért, hogy a megállapodás működjön?", "caution": "A régi szerződést ne kritizáld: akkor az volt a jó. A változás a fejlődés jele.", "variants": null}, {"id": "VC01-102", "theme_id": "t01", "name": "A csoport erősségtérképe", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "10", "description": "Feltérképezzük, miben erős a csoportunk, hol vannak a fejlődési pontjaink, és mit tehet ezért mindenki.", "tools": "csomagolópapír négy mezővel, filcek", "keywords": "csoporterősségek, fejlődés, közösség, önreflexió, csoportkép", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Oszd négy mezőre a nagy lapot: Miben vagyunk jók? Mi nehéz nekünk? Mi segíthetne? Mit tehetek én?\n2. Mindenki körbejár, és minden mezőbe ír legalább egy gondolatot.\n3. Kiscsoportok egy-egy mezőt összefoglalnak 3 pontban.\n4. Közösen kiválasztjátok, melyik „Mi segíthetne?” ötletet próbáljátok ki a következő hetekben.\n5. Feldolgozás: Mi lepett meg a csoportról? Melyik erősségre lehetünk büszkék? Mit vállalsz te a közös ötletből?", "caution": "A „Mi nehéz nekünk?” mezőben ne konkrét emberekről legyen szó. Ha bántó beírás jelenik meg, beszéljétek meg a szabályok fényében.", "variants": null}, {"id": "VC02-101", "theme_id": "t02", "name": "Irigység vagy féltékenység?", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "10", "description": "Két gyakran összekevert érzést választunk szét, és megnézzük, mit üzennek nekünk.", "tools": "helyzetkártyák, két felirat", "keywords": "irigység, féltékenység, érzelmek megkülönböztetése, önismeret, kapcsolatok", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mondd el a különbséget: irigység – szeretném, ami a másiknak van; féltékenység – félek, hogy elveszítek valakit vagy valamit, ami az enyém.\n2. Olvass fel helyzeteket (pl. a barátod jobb jegyet kapott; a legjobb barátod új barátot talált; a tesód új telefont kapott; a párod sokat beszél valaki mással). Mindenki eldönti, melyik érzés lehet.\n3. Kiscsoportok megkeresik, mit üzen az irigység (mit szeretnék én is?) és mit a féltékenység (mitől félek?).\n4. Gyűjtsétek össze, mit lehet kezdeni mindkettővel úgy, hogy ne ártson.\n5. Feldolgozás: Melyik érzést nehezebb bevallani? Mi a különbség aközött, hogy érzek valamit, és aközött, hogy mit teszek vele? Mit tanultál magadról egy irigy vagy féltékeny pillanatból?", "caution": "A párkapcsolati féltékenységnél emeld ki: a kontrolláló viselkedés nem a szeretet jele.", "variants": null}, {"id": "VC02-102", "theme_id": "t02", "name": "Maszk kívül, maszk belül", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "10", "description": "Papírmaszkot készítünk: a külsejére azt írjuk, amit megmutatunk magunkból, a belsejébe azt, amit érzünk, de elrejtünk.", "tools": "papírtányérok vagy maszksablonok, filcek", "keywords": "maszk, rejtett érzések, hitelesség, önkifejezés, bizalom", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: mikor mosolygunk, pedig nincs kedvünk? Miért tesszük?\n2. Mindenki kap egy maszkot. A külsejére azt írja vagy rajzolja, amit mások látnak rajta (pl. vidám, laza, okos). A belsejébe azt, amit sokszor nem mutat meg (pl. fáradt, bizonytalan, magányos).\n3. Mindenki csak a maszk külsejét mutatja meg. A belsejét megtartja.\n4. Beszéljétek meg: mikor véd a maszk, és mikor terhel?\n5. Feldolgozás: Kivel tudod levenni a maszkot? Mi kellene ahhoz, hogy ebben a csoportban is kicsit levehesd? Mit gondolsz, mások maszkja mögött mi lehet?", "caution": "A maszk belsejét senkinek ne kelljen megmutatnia. Figyelj azokra, akiket felkavar a gyakorlat.", "variants": null}, {"id": "VC02-103", "theme_id": "t02", "name": "EQ-tükör", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "10", "description": "Rövid önértékelő kérdőívvel megnézzük, az érzelmi intelligencia melyik területén vagyunk erősek, és hol fejlődnénk.", "tools": "rövid kérdőív (pl. 15 állítás 1–5-ös skálán az öntudatosságról, önszabályozásról, empátiáról, kapcsolatokról)", "keywords": "érzelmi intelligencia, önértékelés, önismeret, fejlődés, célok", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mondd el röviden az érzelmi intelligencia négy területét: érzéseim felismerése, kezelése, mások érzéseinek megértése, kapcsolataim kezelése.\n2. Mindenki kitölti a kérdőívet, és területenként összeadja a pontjait.\n3. Mindenki kiválasztja a legerősebb és a legkevésbé erős területét.\n4. Kiscsoportok, akik ugyanazon a területen szeretnének fejlődni, ötleteket gyűjtenek egymásnak.\n5. Feldolgozás: Meglepett az eredmény? Hogyan változott ez a 7. óta szerinted? Mi az az egy dolog, amit a gyengébb területeden kipróbálsz?", "caution": "A kérdőív nem teszt, és nincs jó vagy rossz eredmény. Az eredményeket senkinek nem kell megmutatnia.", "variants": null}, {"id": "VC03-101", "theme_id": "t03", "name": "Az első késztetés", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "10", "description": "Megfigyeljük az első késztetéseinket (visszaszólni, telefonhoz nyúlni, enni, otthagyni), és gyakoroljuk, hogyan teremtsünk szünetet a késztetés és a tett között.", "tools": "A4-es lapok", "keywords": "impulzuskontroll, késztetés, szünet, tudatosság, önszabályozás", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: milyen gyakran nyúlsz a telefonodhoz egy óra alatt anélkül, hogy eldöntötted volna?\n2. Mutasd be a késztetés-hullámot: a késztetés felerősödik, majd ha nem engedünk neki, gyengül. Ez az „impulzus-szörf”.\n3. Kis kísérlet: 5 percig senki nem nyúl a telefonjához, és mindenki felírja, hányszor érzett késztetést, és mit érzett közben.\n4. Kiscsoportok összegyűjtik a leggyakoribb késztetéseiket és azt, mi segít kivárni őket (pl. számolás, légzés, kérdés: mire van most valójában szükségem?).\n5. Feldolgozás: Hányszor érezted a késztetést? Mi történt, amikor kivártad? Melyik késztetésedre figyelsz ezen a héten?", "caution": "Nem a késztetés a rossz, hanem ha mindig gondolkodás nélkül engedünk neki. Ezt hangsúlyozd.", "variants": null}, {"id": "VC03-102", "theme_id": "t03", "name": "A túlérzékeny füstjelző", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "10", "description": "Megértjük, mi a szorongás feladata, és miért riaszt néha akkor is, amikor nincs valódi veszély.", "tools": "tábla, cetlik", "keywords": "szorongás, félelem, testi tünetek, megértés, megküzdés", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: mi a füstjelző dolga? (Riasztani tűz esetén.) Mi történik, ha egy pirítós miatt is szól?\n2. Magyarázd el: a szorongás olyan, mint a füstjelző. Védeni akar, de néha túl érzékeny. Ilyenkor a test úgy reagál (szívdobogás, gyomorgörcs, izzadás), mintha veszély lenne.\n3. Mindenki felír 2–3 helyzetet, ahol szólt a füstjelzője, és eldönti: valódi tűz volt vagy pirítós?\n4. Kiscsoportok összegyűjtik, mi segít „lecsendesíteni a füstjelzőt” (légzés, tények ellenőrzése, kis lépésekben szembenézni, beszélni róla).\n5. Feldolgozás: Mikor jó, hogy van füstjelzőnk? Mi segít neked, ha feleslegesen riaszt? Mikor érdemes szakemberhez fordulni, ha túl gyakran szól?", "caution": "Ha valaki pánikrohamokról vagy tartós szorongásról beszél, irányítsd iskolapszichológushoz. Ne diagnosztizálj.", "variants": null}, {"id": "VC03-103", "theme_id": "t03", "name": "Mozdulj a hangulatodért", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Könnyű", "grade": "10", "description": "Egy rövid kísérletben megmérjük, hogyan változtat a hangulatunkon három perc mozgás, és összegyűjtjük, milyen mozgás kinek segít.", "tools": "zene, hely a mozgáshoz, cetlik", "keywords": "mozgás, hangulat, energia, önszabályozás, kísérlet", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mindenki felírja egy 1–10-es skálán: mennyi energiám van most, és milyen a hangulatom?\n2. 3 perc mozgás zenére: helyben futás, nyújtás, tánc, ugrálás, ki-ki a saját tempójában.\n3. Újra mindenki felírja a két számot.\n4. Hasonlítsátok össze: hány embernél változott? Milyen irányba?\n5. Feldolgozás: Mit vettél észre a testedben? Mikor tudnál beiktatni egy ilyen 3 percet egy nehéz napon? Milyen mozgás tölt fel téged a legjobban?", "caution": "Senkit ne kényszeríts a mozgásra; aki nem szeretne, ülve is csinálhat nyújtást. Akinek egészségügyi korlátja van, az válasszon kíméletes mozgást.", "variants": null}, {"id": "VC04-101", "theme_id": "t04", "name": "Két érték ütközik", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Mély", "grade": "10", "description": "Olyan dilemmákat vitatunk meg, ahol két fontos értékünk kerül szembe egymással, és megnézzük, mi alapján döntünk.", "tools": "dilemmakártyák", "keywords": "értékek, dilemma, döntés, etika, önismeret", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Olvass fel egy dilemmát: „A legjobb barátod puskázott a dolgozaton, és a tanár mindenkit büntet, ha nem derül ki, ki volt.” Melyik két érték ütközik itt? (Hűség és igazságosság.)\n2. Kiscsoportok kapnak egy-egy dilemmát (pl. őszinteség vagy kedvesség; szabadság vagy biztonság; saját cél vagy családi elvárás).\n3. Megbeszélik: melyik két érték ütközik? Mit tennének? Mi lenne a döntésük ára?\n4. A csoportok bemutatják a dilemmát és a döntésüket, a többiek kérdezhetnek.\n5. Feldolgozás: Volt-e olyan dilemma, ahol nem tudtatok dönteni? Mi segít ilyenkor? Melyik értéked a legfontosabb neked most, és melyik változott az elmúlt években?", "caution": "Nincs helyes válasz. Ügyelj, hogy senki ne ítélje el a másik döntését.", "variants": null}, {"id": "VC04-102", "theme_id": "t04", "name": "A két belső hang", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "10", "description": "Megismerkedünk a belső kritikusunkkal és a belső szurkolónkkal, és gyakoroljuk, hogyan adjunk több teret a szurkolónak.", "tools": "A4-es lapok két oszloppal", "keywords": "belső hang, önkritika, önegyüttérzés, önbizalom, belső beszéd", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: mit mond a fejedben egy hang, amikor hibázol? Milyen a hangszíne?\n2. Mindenki felírja a bal oszlopba a belső kritikusa 3 tipikus mondatát.\n3. A jobb oszlopba mindegyikre megírja, mit mondana egy szurkoló, aki ismeri és szereti őt (nem hazug dicséret, hanem bátorítás).\n4. Párban felolvassák egymásnak a szurkoló mondatait.\n5. Feldolgozás: Kinek a hangjára hasonlít a belső kritikusod? Mi a haszna a belső kritikusnak, és mikor árt? Melyik szurkolómondatot viszed magaddal?", "caution": "A kritikus mondatokat ne kelljen hangosan felolvasni. Figyelj azokra, akiknél nagyon erős a belső kritika.", "variants": null}, {"id": "VC05-101", "theme_id": "t05", "name": "Előbb megértem, aztán felelek", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "10", "description": "Vitában gyakoroljuk, hogy mielőtt válaszolnánk, a másik szavait úgy foglaljuk össze, hogy ő is elfogadja.", "tools": "vitatémák (pl. kötelező legyen-e az egyenruha; jó-e a mesterséges intelligencia a tanulásban)", "keywords": "aktív hallgatás, vita, összefoglalás, megértés, tisztelet", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mondd el a szabályt: csak akkor válaszolhatsz, ha előbb összefoglaltad a másik álláspontját, és ő azt mondta: „Igen, erre gondoltam.”\n2. Párokban vitáznak egy témán 5 percig a szabály szerint.\n3. Csere: most mindenki a másik oldalt képviseli.\n4. Néhány pár elmondja, mi történt.\n5. Feldolgozás: Miben változott a vita a szabálytól? Mikor értetted meg jobban a másikat? Miért nehéz előbb megérteni, és csak utána felelni? Hol hasznos ez otthon?", "caution": "Ha a vita elmérgesedik, állítsd meg, és emlékeztess a szabályra.", "variants": null}, {"id": "VC05-102", "theme_id": "t05", "name": "Három másodperc csend", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "10", "description": "Gyakoroljuk, hogyan bírjuk ki a csendet egy beszélgetésben, és megtapasztaljuk, hogy a csend teret ad a másiknak.", "tools": "témakártyák, stopper", "keywords": "csend, türelem, aktív hallgatás, tér, mélyebb beszélgetés", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: miért kínos a csend egy beszélgetésben? Mit szoktunk tenni, hogy ne legyen?\n2. Párban egyikük egy mélyebb kérdésre válaszol (pl. Mi foglalkoztat mostanában? Mire vagy büszke, amit kevesen tudnak?). A hallgató szabálya: minden válasz után vár három másodpercet, mielőtt bármit mond.\n3. 4 perc után csere.\n4. Beszéljétek meg, mi történt a csendekben.\n5. Feldolgozás: Mondott-e a párod többet a csend után? Milyen volt kibírni a csendet? Kivel tudnál ilyen türelmesen beszélgetni ezen a héten?", "caution": "A kérdések maradjanak önkéntes mélységűek; a válaszoló dönti el, mennyit mond.", "variants": null}, {"id": "VC06-101", "theme_id": "t06", "name": "Segítek, de vigyázok magamra", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Mély", "grade": "10", "description": "Megbeszéljük, hogyan lehet valaki mellett lenni úgy, hogy közben mi magunk is épek maradjunk, és mikor kell felnőttet bevonni.", "tools": "helyzetkártyák", "keywords": "empátia, határok, segítés, önvédelem, felnőtt bevonása", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: volt már, hogy egy barátod gondja annyira megviselt, hogy te is rosszul lettél tőle?\n2. Rajzolj két kört a táblára: a sajátom és a barátomé. Mondd el: az empátia az, hogy megértem az ő körét, de nem költözöm bele.\n3. Kiscsoportok kapnak egy helyzetet (pl. a barátod minden este írt neked, hogy szomorú; egy osztálytárs elmondja, hogy otthon nagy a baj, de kéri, hogy ne szólj senkinek).\n4. Megbeszélik: mit tehetek én? Mit nem kell vállalnom? Mikor kell felnőttnek szólni, akkor is, ha a barátom nem akarja?\n5. Feldolgozás: Miért nehéz felnőttet bevonni? Mi a különbség a titoktartás és a veszélyes titok között? Te mivel töltődsz fel, ha valakit támogatsz?", "caution": "Emeld ki: ha valaki veszélyben van (önsértés, bántalmazás), szólni kell egy felnőttnek, és ez nem árulás. Add meg az iskolai segítők elérhetőségét.", "variants": null}, {"id": "VC06-102", "theme_id": "t06", "name": "Címkék a homlokon", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Mély", "grade": "10", "description": "Mindenki egy láthatatlan címkét kap a homlokára (pl. „Nevess rajtam”, „Hallgass rám”), és a többiek eszerint bánnak vele. Megtapasztaljuk, hogyan formálják a címkék a viselkedést.", "tools": "öntapadós címkék előre megírt utasításokkal", "keywords": "előítélet, címkézés, bánásmód, önbeteljesítő jóslat, empátia", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mindenki homlokára ragassz egy címkét úgy, hogy ő ne lássa (pl. „Kérdezd meg a véleményét”, „Hagyd figyelmen kívül”, „Dicsérd meg”, „Szakítsd félbe”). A negatív címkéket olyan diákok kapják, akik jól bírják.\n2. Kiscsoportok 8 percig közösen terveznek egy osztálybulit, és a címkék szerint bánnak egymással.\n3. Állítsd le. Mindenki megtippeli, mi állhat a címkéjén, mielőtt leveszi.\n4. Kérdezd meg: mit éreztetek? Hogyan változott a viselkedésetek a bánásmód hatására?\n5. Feldolgozás: Hol vannak a valóságban ilyen címkék (új diák, „a csendes”, „a bohóc”)? Hogyan hat a címke arra, aki viseli? Mit tehetünk, hogy ne címkézzünk?", "caution": "Gondosan válaszd ki, ki kap negatív címkét; soha ne olyan, aki valóban kirekesztett. A végén mindenki vegye le a címkét, és mondjon egy kedves mondatot a mellette ülőnek.", "variants": null}, {"id": "VC07-101", "theme_id": "t07", "name": "Beszélgetés otthon", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "10", "description": "Felkészülünk egy nehéz beszélgetésre a szüleinkkel: mit szeretnénk elérni, és hogyan mondjuk el úgy, hogy meghallgassanak.", "tools": "A4-es lapok, helyzetkártyák (kimaradás, fakultáció, zsebpénz, képernyőidő)", "keywords": "családi kommunikáció, EMK, tárgyalás, kérés, felkészülés", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: miről a legnehezebb beszélni otthon? Gyűjtsetek témákat (nem személyes részletekkel).\n2. Mindenki kiválaszt egy témát, és felírja: Mit szeretnék elérni? Mit érezhet a szülőm? Mi a közös bennünk? Mi lenne egy jó első mondat?\n3. Párban eljátsszák a beszélgetés elejét: az egyik a diák, a másik a szülő. Csere.\n4. Gyűjtsétek a táblára, mi segített: időzítés, nyugodt hangnem, a szülő szempontjának elismerése, kompromisszum ajánlása.\n5. Feldolgozás: Mi lepett meg, amikor szülőt játszottál? Mikor a legjobb időpont egy nehéz beszélgetésre? Mi az a beszélgetés, amit ezen a héten elkezdesz?", "caution": "Lehet, hogy nem mindenkinek biztonságos az otthoni beszélgetés. Ha valaki erre utal, beszélj vele négyszemközt.", "variants": null}, {"id": "VC07-102", "theme_id": "t07", "name": "Nyugodt válasz a csoportchatben", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "10", "description": "Felforrósodott csoportchat-üzenetekre írunk nyugodt, EMK-alapú válaszokat, és megnézzük, hogyan lehet írásban lecsillapítani egy vitát.", "tools": "kinyomtatott kitalált chatbeszélgetések", "keywords": "online kommunikáció, EMK, deeszkaláció, csoportchat, írásbeli hangnem", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mutass egy kitalált chatbeszélgetést, ahol egy félreértés miatt egyre durvább üzenetek jönnek.\n2. Kiscsoportok megkeresik, hol lehetett volna megállítani a vitát.\n3. Megírnak egy nyugodt választ a beszélgetés egy pontjára (megfigyelés, érzés, kérés; vagy javaslat, hogy beszéljék meg szóban).\n4. Felolvassák, a többiek eldöntik, melyik válasz csillapítaná le a legjobban a helyzetet.\n5. Feldolgozás: Miért durvulnak el gyorsabban az online viták? Mikor jobb nem válaszolni azonnal? Mi az a mondat, amit beírsz legközelebb, ha egy chat elszabadul?", "caution": "Ne használjatok valós csoportchateket és neveket.", "variants": null}, {"id": "VC08-101", "theme_id": "t08", "name": "Újrakezdés egy barát után", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "10", "description": "Végiggondoljuk, hogyan lehet egy komoly vita után újra felvenni a kapcsolatot egy baráttal, és gyakoroljuk az első lépést.", "tools": "helyzetkártyák", "keywords": "kibékülés, barátság, első lépés, konfliktus utáni helyreállítás", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: mi a legnehezebb egy vita után? (Az első lépés.) Miért?\n2. Mutasd be a kibékülés négy lépését: 1. megkeresem; 2. elmondom, mi volt az én részem; 3. meghallgatom az ő oldalát; 4. megbeszéljük, hogyan tovább.\n3. Párban eljátszanak egy kibékülést egy helyzetkártya alapján (pl. elmaradt egy közös program, mert te mással mentél el; egy rossz megjegyzés miatt hetek óta nem beszéltek).\n4. Néhány pár bemutatja, a többiek visszajeleznek.\n5. Feldolgozás: Mi a különbség a „bocsi” és egy valódi kibékülés között? Mi van, ha a másik nem akar kibékülni? Van-e, akit szívesen újra megkeresnél?", "caution": "Senkit ne kérj valós, folyamatban lévő konfliktus eljátszására.", "variants": null}, {"id": "VC08-102", "theme_id": "t08", "name": "Tűz és víz szavak", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Könnyű", "grade": "10", "description": "Összegyűjtjük, milyen szavak és mondatok szítják a vitát (tűz), és melyek csillapítják (víz).", "tools": "két oszlop a táblán, kártyák", "keywords": "eszkaláció, deeszkaláció, szóhasználat, konfliktus, kommunikáció", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Rajzolj egy tüzet és egy vízcseppet a táblára.\n2. Kiscsoportok 5 perc alatt összegyűjtenek tűzszavakat (pl. „mindig”, „soha”, „nyugodj már le”, gúnyos hangnem) és vízszavakat (pl. „értem”, „mit szeretnél?”, „igazad van abban, hogy…”).\n3. Felírjátok a táblára, és megbeszélitek, miért hatnak úgy.\n4. Párban eljátszanak egy rövid vitát először tűzszavakkal, aztán vízszavakkal.\n5. Feldolgozás: Melyik tűzszót mondod a leggyakrabban? Melyik vízszó a legnehezebb? Mi a helyzet a testbeszéddel: az is lehet tűz vagy víz?", "caution": "A „nyugodj már le” szándéka víz, hatása tűz: ezt érdemes külön megbeszélni.", "variants": null}, {"id": "VC08-103", "theme_id": "t08", "name": "Osztálygyűlés-szimuláció", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Mély", "grade": "10", "description": "Egy kitalált osztályszintű konfliktust (pl. osztálykirándulás helyszíne) közösen döntünk el egy demokratikus, mindenki hangját meghalló folyamattal.", "tools": "szerepkártyák különböző érdekekkel, flipchart", "keywords": "csoportdöntés, demokrácia, érdekek, kompromisszum, részvétel", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mutasd be a helyzetet: az osztály 3 kirándulási helyszín közül választ, de vannak, akiknek fontos az ár, másoknak a program, megint másoknak, hogy a barátaikkal lehessenek.\n2. Mindenki kap egy szerepkártyát egy érdekkel.\n3. Vezesd a gyűlést: először minden érdek elhangzik (beszélőkörben), aztán szempontokat gyűjtötök, végül ötleteket keresve döntetek. Nem többségi szavazás a cél, hanem mindenki számára elfogadható döntés.\n4. Ha kész a döntés, mindenki megmondja, mennyire tudja elfogadni (1–5 ujjal).\n5. Feldolgozás: Kinek a hangja hallatszott a legjobban, és kié a legkevésbé? Miben más ez, mint a sima szavazás? Hol használhatnátok ezt a valódi osztályéletben?", "caution": "Figyelj a szerepkártyák egyensúlyára. Ha a szimuláció valós osztálykonfliktust idéz fel, állj meg, és kezeld külön.", "variants": null}, {"id": "VC09-101", "theme_id": "t09", "name": "Ki húzza a szekeret?", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "10", "description": "Megbeszéljük, mi történik, amikor a csoportmunkában valaki nem dolgozik, és kitalálunk igazságos munkamegosztási szabályokat.", "tools": "helyzetkártyák, flipchart", "keywords": "csoportmunka, felelősség, potyautas, igazságosság, munkamegosztás", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: ki volt már olyan csoportmunkában, ahol ő csinált mindent? És olyanban, ahol ő csinált a legkevesebbet? (Csak kézfeltartással.)\n2. Kiscsoportok összegyűjtik, miért marad ki valaki a munkából (nem érdekli, nem tudja, mit csináljon, nem merik bevonni, kényelmes).\n3. Mindegyik okra kitalálnak megoldást.\n4. Közösen megírjátok a „Jó csoportmunka 5 szabályát”.\n5. Feldolgozás: Melyik szerepben vagy a leggyakrabban? Hogyan lehet szólni valakinek, aki nem dolgozik, úgy, hogy ne legyen veszekedés? Mit csinálsz másképp a következő csoportmunkában?", "caution": "Ne konkrét csoportmunkákról és emberekről szóljon a beszélgetés.", "variants": null}, {"id": "VC09-102", "theme_id": "t09", "name": "Különbözőségben az erő", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "10", "description": "Megnézzük, milyen különböző erősségeket hoznak a csoporttagok, és hogyan egészítik ki egymást egy közös feladatban.", "tools": "erősségkártyák (pl. ötletgazda, szervező, részletekre figyelő, békítő, előadó, kitartó)", "keywords": "csapatszerepek, különbözőség, kiegészítés, erősségek, együttműködés", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mindenki kiválasztja a kártyák közül a 2 legjellemzőbb erősségét.\n2. Alakítsatok vegyes csoportokat úgy, hogy egy csoportban minél többféle erősség legyen.\n3. A csoportok kapnak egy 15 perces feladatot (pl. tervezzenek egy jótékonysági napot az iskolában), és tudatosan az erősségeik szerint osztják el a szerepeket.\n4. Bemutatják a tervet, és elmondják, ki mit tett hozzá.\n5. Feldolgozás: Milyen volt az erősséged szerint dolgozni? Melyik erősség hiányzott a csoportból? Mikor zavar minket, ha valaki nagyon más, mint mi, és mikor segít?", "caution": "Hangsúlyozd, hogy minden erősség értékes, a csendes, háttérben dolgozó szerepek is.", "variants": null}, {"id": "VC10-101", "theme_id": "t10", "name": "Kritika, ami segít", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "10", "description": "Gyakoroljuk, hogyan adjunk olyan kritikát, ami a másikat fejleszti, nem bántja.", "tools": "egy kitalált munka (pl. plakát vagy fogalmazás) kivetítve vagy kinyomtatva", "keywords": "konstruktív kritika, visszajelzés, fejlődés, tisztelet, konkrétság", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mutass egy kitalált diákmunkát. Kérd, hogy mondjanak róla kritikát, és írd fel a mondatokat.\n2. Beszéljétek meg, melyik mondat segítene a készítőnek, és melyik bántaná. Gyűjtsétek a jó kritika ismérveit: konkrét, a munkáról szól, nem a személyről, javaslatot ad, kedves hangú.\n3. Párban mindenki ír egy rövid szöveget (pl. egy bekezdést arról, mit csinálna egy szabadnapon), aztán kicserélik, és jó kritikát adnak rá.\n4. Megbeszélik, hogyan hatott rájuk a kapott kritika.\n5. Feldolgozás: Mi a különbség a kritika és a bántás között? Miért nehéz kritikát kapni? Kinek adnál ezen a héten segítő kritikát, és hogyan fogalmaznád meg?", "caution": "Ügyelj arra, hogy a páros kritikák kedvesek maradjanak.", "variants": null}, {"id": "VC10-102", "theme_id": "t10", "name": "Akiket nem veszünk észre", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Könnyű", "grade": "10", "description": "Összegyűjtjük, kik dolgoznak az iskolában a háttérben (takarító, portás, konyhai dolgozó, karbantartó), és kitalálunk egy közös köszönetet nekik.", "tools": "kártyák, színes papír", "keywords": "hála, figyelem, tisztelet, közösség, iskolai élet", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: kik dolgoznak azért, hogy reggel tiszta legyen a terem, legyen ebéd, működjön a fűtés? Ismerjük a nevüket?\n2. Gyűjtsétek össze az iskola „láthatatlan” dolgozóit.\n3. Kiscsoportok kitalálnak és elkészítenek egy köszönetet (kártya, közös plakát, egy személyes köszönés).\n4. Megbeszéltek, mikor és hogyan adjátok át.\n5. Feldolgozás: Miért nem vesszük észre, aki a háttérben dolgozik? Milyen érzés lehet kapni egy ilyen köszönetet? Kik a „láthatatlan” segítők az életedben, például otthon?", "caution": "Egyeztesd előre az iskolavezetéssel és az érintettekkel, hogy a köszönet átadása kényelmes legyen nekik.", "variants": null}, {"id": "VC12-101", "theme_id": "t12", "name": "Barát vagy, de ezt nem", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "10", "description": "Gyakoroljuk, hogyan mondjunk nemet egy barátnak úgy, hogy a barátság megmaradjon.", "tools": "helyzetkártyák", "keywords": "határok, barátság, nemet mondás, asszertivitás, tisztelet", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: miért nehezebb nemet mondani a barátnak, mint egy idegennek?\n2. Mutasd be a „szendvics-nemet”: 1. elismerem a barátságot vagy a kérést („Tudom, hogy fontos ez neked.”); 2. kimondom a nemet („De ezt nem tudom vállalni.”); 3. ha lehet, mást ajánlok („Viszont segítek mással.”).\n3. Párban gyakorolják helyzetkártyákon (pl. a barátod a házidat kéri lemásolni; arra kér, hogy fedezd a szülei előtt; minden hétvégén vele kellene lenned).\n4. Néhány pár bemutatja, a többiek visszajeleznek.\n5. Feldolgozás: Mit érzel, amikor nemet mondasz egy barátnak? Mit jelent, ha egy barát nem fogadja el a nemedet? Hol kellene meghúznod egy határt mostanában?", "caution": "Ha valaki bántalmazó baráti vagy párkapcsolati helyzetre utal, beszélj vele négyszemközt.", "variants": null}, {"id": "VC12-102", "theme_id": "t12", "name": "Egyedül a tömegben", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Mély", "grade": "10", "description": "Beszélünk a magányról: arról, hogy sok ember között is lehet egyedül érezni magunkat, és hogy mit tehetünk magunkért és másokért.", "tools": "cetlik, tábla", "keywords": "magány, kapcsolódás, elszigeteltség, figyelem, segítség", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: lehet-e magányos valaki, akinek sok követője van? Mi a különbség az egyedüllét és a magány között?\n2. Mindenki névtelenül felír egy helyzetet, amikor magányosnak érezte magát társaságban (nem kell részletezni).\n3. Olvass fel néhányat. Kérdezd meg: meglepő, hogy ennyi hasonló van?\n4. Kiscsoportok összegyűjtik, mi segít a magányon (megszólítani valakit, közös tevékenység, egy kérdés) és hogyan vehetjük észre, ha valaki magányos.\n5. Feldolgozás: Miért nehéz bevallani a magányt? Mit tehetsz, ha valakit magányosnak látsz? Kihez fordulhatsz, ha te érzed magad egyedül?", "caution": "A felolvasott cetliken ne lehessen azonosítani a szerzőt. Ha valaki tartós, mély magányra utal, kövesd nyomon.", "variants": null}, {"id": "VC13-101", "theme_id": "t13", "name": "Digitális lábnyom", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "10", "description": "Megnézzük, mit találna rólunk az interneten egy jövőbeli egyetem vagy munkáltató, és hogyan építhetünk tudatosan online képet.", "tools": "egy kitalált diák nyilvános profiljai (kinyomtatva), cetlik", "keywords": "digitális lábnyom, online kép, jövő, adatvédelem, felelősség", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mutasd meg egy kitalált diák nyilvános posztjait és kommentjeit 5 évre visszamenőleg.\n2. Kiscsoportok egy felvételiztető szemével nézik: mit gondolnának róla? Mi szól mellette, mi ellene?\n3. Mindenki megnézheti (csendben, magának), mit talál a neve keresésekor, vagy végiggondolja, mi lehet róla nyilvános.\n4. Gyűjtsétek a táblára: mit érdemes törölni, privátra állítani, és mit érdemes építeni (pl. projektek, önkéntesség).\n5. Feldolgozás: Mi az, ami 5 év múlva kínos lehet abból, amit ma posztolsz? Mi az, amit szívesen látna rólad egy jövőbeli munkáltató? Mit nézel meg ma este a profiljaidon?", "caution": "A saját keresés önkéntes, és senkinek nem kell megmutatnia az eredményét.", "variants": null}, {"id": "VC13-102", "theme_id": "t13", "name": "Igaz vagy hamis?", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "10", "description": "Álhíreket és valódi híreket próbálunk szétválogatni, és megtanulunk néhány gyors ellenőrzési lépést.", "tools": "5–6 kinyomtatott vagy kivetített hír (vegyesen valódi és kitalált), ellenőrző lista", "keywords": "álhír, médiaértés, forrásellenőrzés, kritikus gondolkodás, felelősség", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mutasd be az ellenőrző lépéseket: Ki írta? Hol jelent meg még? Mikor? Mi a célja? Túl szép vagy túl ijesztő, hogy igaz legyen?\n2. Kiscsoportok megkapják a híreket, és eldöntik mindegyikről: igaz, hamis vagy nem lehet tudni?\n3. Fedd fel a megoldást, és beszéljétek meg, mi vezetett félre.\n4. Gyűjtsétek össze, milyen érzelmekre hatnak az álhírek (félelem, düh, kíváncsiság).\n5. Feldolgozás: Osztottál már meg olyat, ami később kiderült, hogy nem igaz? Miért terjednek gyorsabban az álhírek? Mit teszel, mielőtt legközelebb megosztasz egy hírt?", "caution": "Válassz politikailag semleges, korosztálynak megfelelő példákat.", "variants": null}, {"id": "VC14-101", "theme_id": "t14", "name": "Vigyázunk egymásra", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Mély", "grade": "10", "description": "Végiggondoljuk, mit tehetünk egy buliban vagy társaságban, ha egy barátunk bajba kerül, és hogyan vigyázhat a csoport egymásra.", "tools": "helyzetkártyák, sürgősségi telefonszámok", "keywords": "biztonság, felelősség, barátság, segítségkérés, közös szabályok", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: mit jelent, hogy „vigyázunk egymásra” egy társaságban?\n2. Kiscsoportok kapnak egy helyzetet (pl. a barátod rosszul lesz egy buliban; valaki egyedül indulna haza éjjel; egy barátodat rá akarják venni valamire, amit nem akar).\n3. Megbeszélik: Mit tehetek most? Kit hívok? Mit mondok a barátomnak?\n4. Gyűjtsétek a táblára a „társasági megállapodások” ötleteit (pl. együtt jövünk, együtt megyünk; van egy jelszó, ha valaki ki akar szállni; mindig van egy felnőtt, akit hívhatunk).\n5. Feldolgozás: Miért nehéz segítséget hívni, ha bajba kerül valaki? Mit tennél, ha félnél a következményektől? Kivel kötnél ilyen megállapodást?", "caution": "Ne moralizálj. A cél a biztonság és a segítségkérés, nem a tiltás. Mondd el a 112-t és az iskolai segítőket.", "variants": null}, {"id": "VC14-102", "theme_id": "t14", "name": "Márkák és státusz", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "10", "description": "Megnézzük, miért fontos sokunknak, milyen márkát hordunk vagy milyen telefonunk van, és mit mond ez az értékünkről.", "tools": "márkaképek vagy logók nélküli termékek leírása, cetlik", "keywords": "fogyasztás, státusz, kortárs nyomás, önérték, értékek", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: mit gondolunk valakiről a cipője vagy a telefonja alapján? Gyűjtsetek példákat (konkrét nevek nélkül).\n2. Kiscsoportok összegyűjtik, miért vesszük meg a „menő” dolgokat (tartozás, biztonság, öröm, félelem a kimaradástól).\n3. Beszéljétek meg: mi az, amit nem lehet megvenni, mégis tiszteletet vagy barátságot hoz?\n4. Mindenki felír egy dolgot, amit azért szeretne, mert mások is akarják, és egyet, amit valóban magáért szeretne.\n5. Feldolgozás: Mit érzel, ha nincs meg neked, ami a többieknek? Ki dönti el, mi menő? Mi az, amire tényleg szükséged van, és mi az, ami csak a nyomás miatt kell?", "caution": "Figyelj a családok anyagi különbségeire: senkit ne hozz kínos helyzetbe.", "variants": null}, {"id": "VC15-101", "theme_id": "t15", "name": "Elég jó", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Mély", "grade": "10", "description": "Beszélünk a perfekcionizmusról: mikor segít a magas mérce, és mikor válik bénítóvá. Megtanuljuk az „elég jó” elvét.", "tools": "skála a padlón (1 = elég jó, 10 = tökéletes), cetlik", "keywords": "perfekcionizmus, teljesítmény, önelfogadás, stressz, mérce", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Olvass fel helyzeteket (pl. egy házi dolgozat; egy születésnapi ajándék; egy Instagram-poszt; egy edzés), és mindenki odaáll a skálán, mennyire akarja tökéletesen csinálni.\n2. Kérdezd meg: mennyi idő és energia kell a 8-asról 10-esre jutni? Megéri-e mindig?\n3. Mindenki felírja, hol szokott túl magas mércét állítani, és mi történik akkor (halogatás, fáradtság, elégedetlenség).\n4. Párban megfogalmazzák egy-egy helyzetre, mi lenne az „elég jó” szint.\n5. Feldolgozás: Kitől tanultad a mércédet? Mi lenne, ha egy dolgot ezen a héten szándékosan csak elég jól csinálnál meg? Mire szabadulna fel így időd?", "caution": "Ha valaki nagyon szigorú magával, vagy a teljesítmény miatt szorong, figyelj rá, és ajánld fel az iskolapszichológust.", "variants": null}, {"id": "VC15-102", "theme_id": "t15", "name": "Egyszerre egy dolog", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Könnyű", "grade": "10", "description": "Egy rövid kísérlettel megmutatjuk, hogy a párhuzamos feladatvégzés lassít és hibázásra késztet, és gyakoroljuk az egy dologra figyelést.", "tools": "papír, toll, stopper", "keywords": "fókusz, multitasking, figyelem, tanulás, hatékonyság", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Első kör: mindenki leírja az „EGYSZERREEGYDOLOG” szót, alá pedig a számokat 1-től 16-ig; méri az időt.\n2. Második kör: most váltogatva írják: E, 1, G, 2, Y, 3… és újra mérik az időt.\n3. Hasonlítsátok össze az időket és a hibákat.\n4. Beszéljétek meg: mi történik, ha tanulás közben üzenetekre válaszolunk? Gyűjtsetek fókusztippeket (telefon másik szobában, időzítő, egy feladat egyszerre).\n5. Feldolgozás: Mennyivel lettél lassabb a második körben? Mi vonja el leggyakrabban a figyelmed tanulás közben? Melyik tippet próbálod ki?", "caution": "A cél nem a verseny. Ha valakinek figyelemzavara van, mondd ki, hogy mindenkinek más segít.", "variants": null}, {"id": "VC16-101", "theme_id": "t16", "name": "Fakultáció-döntés", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "10", "description": "Végiggondoljuk a fakultációválasztást: mit szeretnék, mi érdekel, mire lesz szükségem, és kik befolyásolnak.", "tools": "döntési szempontlista, A4-es lapok", "keywords": "fakultáció, továbbtanulás, döntés, érdeklődés, befolyás", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mindenki felírja, milyen fakultációkon gondolkodik.\n2. Mindegyik mellé pontozza 1-től 5-ig: mennyire érdekel; mennyire vagyok jó benne; mennyire kell a terveimhez; kinek a véleménye befolyásol.\n3. Párban beszélgetnek: mi a legerősebb szempont? Mi az, amit még nem tudok, de meg kellene tudnom?\n4. Gyűjtsétek össze, kitől és honnan lehet információt szerezni (tanárok, felsőbbévesek, egyetemi honlapok).\n5. Feldolgozás: Kinek a hangja szól a legerősebben a döntésedben? Mit tennél, ha nem kellene megfelelned senkinek? Mi a következő lépésed a döntésig?", "caution": "Ne minősítsd a fakultációkat. Ha valakire erős szülői nyomás nehezedik, ajánlj fel négyszemközti beszélgetést.", "variants": null}, {"id": "VC16-102", "theme_id": "t16", "name": "Saját utam", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Mély", "grade": "10", "description": "Megkülönböztetjük, mit várnak tőlünk mások, és mit szeretnénk mi magunk, és keressük, hol tudjuk a kettőt összhangba hozni.", "tools": "A4-es lapok két oszloppal", "keywords": "elvárások, autonómia, saját út, család, értékek", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mindenki két oszlopot ír: Mit várnak tőlem (szülők, tanárok, barátok, társadalom)? Mit szeretnék én?\n2. Bekarikázza, ahol a két oszlop egyezik, és aláhúzza, ahol ütközik.\n3. Párban beszélgetnek egy ütközésről: mi lehet a másik fél szándéka? Van-e köztes megoldás?\n4. Gyűjtsetek mondatokat, amelyekkel tisztelettel lehet képviselni a saját utat (pl. „Értem, miért fontos ez nektek. Nekem ez fontos, mert…”).\n5. Feldolgozás: Melyik elvárás segít, és melyik nyom? Mit tennél, ha egy ütközés nem oldható fel? Mi az a döntés, amit már most a saját utad szerint hozhatsz meg?", "caution": "A családi elvárásokról tisztelettel beszéljetek. Ha valaki erős konfliktusról beszél otthon, figyelj rá.", "variants": null}, {"id": "VC17-101", "theme_id": "t17", "name": "Félúton", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "10", "description": "A gimnázium felénél visszanézünk, honnan indultunk, és előre is nézünk: mit szeretnénk a hátralévő két évben.", "tools": "A3-as lapok, filcek", "keywords": "félidő, visszatekintés, jövőkép, célok, változás", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Rajzolja meg mindenki az útját 7.-től 10.-ig egy kanyargó úttal, rajta a fontos pontokkal.\n2. Az út folytatását 11.-ben és 12.-ben üresen hagyja, de odaír 2–3 kívánságot.\n3. Párban megmutatják egymásnak az útjukat.\n4. Közösen beszéljétek meg: mi változott a legjobban a csoportban?\n5. Feldolgozás: Mire vagy a legbüszkébb az eddigi útból? Mit szeretnél másképp csinálni a hátralévő két évben? Mit vár el tőled a következő év, és mit vársz te tőle?", "caution": "Ha valakinek nehéz évei voltak, ne kényszerítsd a megosztásra.", "variants": null}, {"id": "VC17-102", "theme_id": "t17", "name": "Üzenet a 7.-es énemtől", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Mély", "grade": "10", "description": "Kiosztjuk a 7.-ben írt képeslapokat, elolvassuk, és válaszolunk a 7.-es önmagunknak.", "tools": "a 7.-ben írt képeslapok (ha megvannak), papír a válaszhoz", "keywords": "időkapszula, változás, önreflexió, folytonosság, fejlődés", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Oszd ki a 7.-ben írt borítékokat (ha valakié nincs meg, kapjon egy kérdést: Mit írtál volna akkor magadnak?).\n2. Mindenki csendben elolvassa a lapját.\n3. Mindenki levelet ír vissza a 7.-es önmagának: mi lett azokból, amiket akkor gondolt; mire válaszol a kérdésére; mit üzen neki.\n4. Aki szeretné, megoszt egy mondatot a csoporttal a lapjából vagy a válaszából.\n5. Feldolgozás: Mi lepett meg a 7.-es éned soraiban? Mi változott, és mi maradt ugyanaz? Mit üzennél most a 12.-es énednek?", "caution": "Ez érzelmileg erős gyakorlat lehet. Hagyj rá elég időt, és senkit ne kérj felolvasásra.", "variants": null}, {"id": "VC01-111", "theme_id": "t01", "name": "Mit adnánk át a 7.-eseknek?", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "11", "description": "Végiggondoljuk, mit tanultunk az évek alatt a csoportról, és mit adnánk át a 7.-eseknek mentorként.", "tools": "csomagolópapír, cetlik", "keywords": "mentorálás, tapasztalat, csoportkultúra, felelősség, átadás", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: milyenek voltatok 7.-esként? Mit nem tudtatok még akkor egy jó csoportról?\n2. Kiscsoportok összegyűjtik a 3 legfontosabb dolgot, amit a csoportokról, a barátságról és a Csibékről tanultak.\n3. Mindegyikhez kitalálnak egy rövid, 7.-eseknek szóló üzenetet vagy játékot.\n4. Beszéljétek meg, ha van rá lehetőség: szervezhettek-e egy közös alkalmat a 7.-esekkel?\n5. Feldolgozás: Mire vagy büszke a csoportunk fejlődéséből? Milyen mentor lennél? Mit tanulhatnánk mi a 7.-esektől?", "caution": "Ha közös alkalom lesz a 7.-esekkel, egyeztesd a kollégákkal, és készítsétek elő gondosan.", "variants": null}, {"id": "VC02-111", "theme_id": "t02", "name": "Amikor az érzés dönt", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "11", "description": "Megnézzük, hogyan befolyásolják az érzéseink a döntéseinket, és mikor jó hallgatni a megérzésünkre, mikor nem.", "tools": "helyzetkártyák, két oszlop: „érzés” és „tények”", "keywords": "érzelmek, döntéshozatal, megérzés, racionalitás, önismeret", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: hoztál már döntést dühösen, és megbántad? És volt, hogy a megérzésed mentett meg?\n2. Kiscsoportok kapnak egy döntési helyzetet (pl. szakítani akarsz egy vita után; egy állásajánlat túl szépnek tűnik; elküldenél egy éjféli üzenetet).\n3. Kitöltik a két oszlopot: mit súg az érzés, mit mondanak a tények?\n4. Megbeszélik, mi lenne a jó döntés, és kell-e várni vele.\n5. Feldolgozás: Mikor érdemes hallgatni a megérzésre? Mikor érdemes aludni egyet egy döntésre? Melyik döntésedet hoztad túl gyorsan mostanában?", "caution": "A párkapcsolati példáknál légy tapintatos.", "variants": null}, {"id": "VC02-112", "theme_id": "t02", "name": "Amikor elveszítünk valamit", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Mély", "grade": "11", "description": "Beszélünk a veszteségekről, amelyek kamaszkorban érnek minket (költözés, szakítás, egy barátság vége, egy álom elengedése), és arról, hogyan gyászolunk.", "tools": "A4-es lapok, cetlik", "keywords": "veszteség, gyász, elengedés, érzelmek, támogatás", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mondd el: gyászolni nemcsak egy ember halála miatt lehet. Gyűjtsetek veszteségeket, amelyek ebben a korban érhetnek minket (név és részletek nélkül).\n2. Mutasd be röviden, hogy a gyász hullámokban jön, és sokféle érzés kíséri (szomorúság, düh, megkönnyebbülés, bűntudat).\n3. Mindenki névtelenül felír egy dolgot, ami segített neki vagy segíthetne egy veszteség után.\n4. Felolvasod a cetliket, és csoportosítjátok őket.\n5. Feldolgozás: Miért nehéz beszélni a veszteségekről? Mit mondanál egy barátnak, aki valamit elveszített? Kihez fordulhatsz, ha neked van szükséged erre?", "caution": "Lehet a csoportban, aki friss gyászt él át: tudd ezt előre, ha lehet, és beszélj vele előtte. Adj lehetőséget a kilépésre. Ajánld az iskolapszichológust.", "variants": null}, {"id": "VC03-111", "theme_id": "t03", "name": "Felállni", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "11", "description": "Rezíliencia-történeteket gyűjtünk: mi segít az embereknek felállni egy kudarc vagy nehézség után, és ebből mit használhatunk mi.", "tools": "rövid, valós történetek ismert emberekről (pl. sportoló, feltaláló, író kudarcai)", "keywords": "reziliencia, kudarc, kitartás, megküzdés, erőforrások", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Olvass fel 2–3 rövid történetet ismert emberek kudarcairól és arról, hogyan álltak fel.\n2. Kiscsoportok megkeresik a történetekben a közös „felállási eszközöket” (támogató ember, értelem, humor, kis lépések, pihenés).\n3. Mindenki felír egy saját, már lezárt kisebb kudarcot, és azt, melyik eszköz segített neki.\n4. Közösen elkészítitek a „felállás eszköztárát” a táblán.\n5. Feldolgozás: Melyik eszköz a legerősebb nálad? Melyiket használod túl ritkán? Mit mondanál egy barátnak, aki most esett el valamiben?", "caution": "Ne a hősi kitartást dicsőítsd: a pihenés és a segítségkérés is felállási eszköz.", "variants": null}, {"id": "VC03-112", "theme_id": "t03", "name": "Testpásztázás", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Könnyű", "grade": "11", "description": "Kipróbálunk egy vezetett testpásztázó gyakorlatot, ami segít észrevenni és elengedni a feszültséget, és jó alvás előtt is.", "tools": "matrac vagy kényelmes szék, nyugodt környezet", "keywords": "mindfulness, testtudat, relaxáció, alvás, stresszcsökkentés", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mondd el, hogy egy 10 perces figyelemgyakorlat következik. Lehet csukott vagy nyitott szemmel csinálni.\n2. Vezesd végig a figyelmet a testen lassan: lábujjak, talp, lábszár, comb, has, mellkas, kéz, kar, váll, nyak, arc. Minden résznél: mit érzel? Ha feszült, lélegezz bele, és engedd el.\n3. A végén egy perc csend, majd lassú visszatérés (nyújtózás).\n4. Mindenki egy szóval elmondja, hogyan érzi magát.\n5. Feldolgozás: Hol találtál feszültséget? Elkalandoztak-e a gondolataid, és mit tettél ilyenkor? Mikor tudnád használni (pl. elalvás előtt)?", "caution": "Akinek kellemetlen a testre figyelés (pl. traumatikus élmények miatt), nyitott szemmel, egy tárgyra figyelve is részt vehet. Ezt mondd ki előre.", "variants": null}, {"id": "VC04-111", "theme_id": "t04", "name": "Mi tesz egyedivé?", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "11", "description": "Összegyűjtjük, mi az a különleges kombináció (erősség, tapasztalat, érdeklődés), ami csak ránk jellemző, és hogyan mutathatjuk meg egy felvételin vagy interjún.", "tools": "A4-es lapok, tábla", "keywords": "egyediség, erősségek, önbemutatás, felvételi, önismeret", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mindenki felír 3 erősséget, 3 érdeklődést és 3 tapasztalatot (munka, hobbi, utazás, nehézség).\n2. Keres köztük egy szokatlan kapcsolatot (pl. „kitartó + zenész + öcsémre vigyázok” = türelmes tanár lehetek).\n3. Megírja a „60 másodperces bemutatkozását”.\n4. Párban elmondják egymásnak, és a pár visszajelez: mi volt meggyőző, mi hiányzott?\n5. Feldolgozás: Mi volt nehéz: dicsérni magad vagy választani? Mi az, amit eddig nem tartottál értékesnek magadban? Hol használnád ezt a bemutatkozást?", "caution": "Ügyelj, hogy a visszajelzések bátorítóak legyenek.", "variants": null}, {"id": "VC05-111", "theme_id": "t05", "name": "Riport egy felnőttel", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "11", "description": "Interjút tervezünk egy felnőttel a munkájáról és az életútjáról, és gyakoroljuk a mélyebb, kíváncsi kérdezést.", "tools": "interjúkérdés-sablonok, A4-es lapok", "keywords": "interjú, kérdezés, aktív hallgatás, pályaorientáció, kíváncsiság", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mindenki kiválaszt egy felnőttet, akit szívesen megkérdezne (szülő, rokon, edző, szomszéd).\n2. Kiscsoportok közösen írnak 10 jó interjúkérdést (nyitott kérdések, pl. Mi volt a legnagyobb fordulópont az életedben? Mit csinálnál másképp?).\n3. Párban próbainterjút tartanak: az egyik a felnőtt szerepében válaszol, a másik kérdez és visszatükröz.\n4. Megbeszélitek, mi tett jóvá egy kérdést.\n5. Feldolgozás: Melyik kérdés hozta a legérdekesebb választ? Mi volt nehéz kérdezőként? Kit kérdezel meg a következő Csibéig, és mit szeretnél megtudni?", "caution": "Az otthoni interjú önkéntes. A következő alkalommal, aki szeretné, beszámolhat.", "variants": null}, {"id": "VC06-111", "theme_id": "t06", "name": "Láthatatlan sorsok", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Mély", "grade": "11", "description": "Olyan emberek helyzetébe gondoljuk bele magunkat, akiket ritkán látunk vagy hallunk (idős ember egyedül, hajléktalan, menekült diák, gondozó fiatal), és megkeressük, mi köt össze minket velük.", "tools": "sorskártyák rövid leírással", "keywords": "társadalmi empátia, előítélet, sztereotípia, közösség, segítés", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Kiscsoportok kapnak egy sorskártyát (pl. Ilona, 82 éves, egyedül él a negyedik emeleten; Ádám, 17 éves, dolgozik iskola mellett, hogy segítsen otthon; Leila, 16 éves, egy éve érkezett Magyarországra).\n2. Megbeszélik: milyen lehet egy napja? Mi a legnehezebb neki? Mit gondolhatnak róla mások? Mire vágyik?\n3. Megkeresnek 3 dolgot, ami közös bennük és a szereplőben.\n4. Kitalálnak egy apró, reális lépést, amivel egy ilyen helyzetű ember életét könnyebbé tehetnék.\n5. Feldolgozás: Mi volt nehéz elképzelni? Milyen előítéletekkel találkoztatok magatokban? Hol találkozol ilyen sorsokkal a környékeden?", "caution": "Lehet a csoportban, akit érint valamelyik sors. Válaszd meg ennek megfelelően a kártyákat, és kerüld a sajnálkozó hangnemet.", "variants": null}, {"id": "VC07-111", "theme_id": "t07", "name": "Ha fontos nekem valaki", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Mély", "grade": "11", "description": "Megnézzük, hogyan beszéljünk a közeli kapcsolatainkban (barátság, párkapcsolat) a szükségleteinkről és a határainkról.", "tools": "helyzetkártyák", "keywords": "kapcsolati kommunikáció, határok, szükségletek, párkapcsolat, tisztelet", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: miért nehezebb a hozzánk közel állóknak elmondani, mi bánt?\n2. Mutasd be a „közel állók kommunikációjának” három szabályát: 1. a viselkedésről beszélek, nem a személyről; 2. elmondom, mire van szükségem; 3. meghallgatom az ő szükségletét is.\n3. Párban gyakorolnak helyzeteken (pl. a párod mindig az ő barátaival akar lenni; a barátod mindig késik; úgy érzed, csak te kezdeményezel).\n4. Beszéljétek meg az egészséges és egészségtelen jeleket (féltékenység, kontroll, tisztelet, szabadság).\n5. Feldolgozás: Mi a különbség a „féltelek” és a „kontrollállak” között? Milyen mondatot nehéz kimondanod a hozzád közel állóknak? Kihez fordulhatsz, ha egy kapcsolat rosszul esik?", "caution": "Ha valaki bántalmazó kapcsolatra utal, beszélj vele négyszemközt, és vonj be szakembert.", "variants": null}, {"id": "VC08-111", "theme_id": "t08", "name": "Vita felfelé", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "11", "description": "Gyakoroljuk, hogyan képviseljük a véleményünket egy hatalmi különbséggel járó helyzetben (tanár, edző, főnök) tisztelettel és hatásosan.", "tools": "helyzetkártyák", "keywords": "hatalmi különbség, asszertivitás, érdekképviselet, tisztelet, konfliktus", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: miért nehezebb vitatkozni egy tanárral vagy főnökkel, mint egy barátunkkal?\n2. Mutasd be a lépéseket: időzítés (négyszemközt, nyugodtan), tények, a saját nézőpont, a másik szempontjának elismerése, javaslat.\n3. Párban eljátszanak helyzeteket (pl. igazságtalannak érzel egy jegyet; a munkahelyeden túl sok műszakot kapsz; az edző nem játszat).\n4. Néhány pár bemutatja, a többiek visszajeleznek.\n5. Feldolgozás: Mi segít, hogy ne legyél se túl alázatos, se túl támadó? Mi van, ha a másik nem enged? Hol fogod ezt használni a következő hetekben?", "caution": "Hangsúlyozd: a tisztelet kölcsönös. Ha valaki valódi visszaélésről beszél, vedd komolyan.", "variants": null}, {"id": "VC08-112", "theme_id": "t08", "name": "Ahol nem engedek", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "11", "description": "Megkülönböztetjük, miben lehet kompromisszumot kötni, és mi az a néhány dolog, amiben nem engedünk, és megtanuljuk ezt tisztán kimondani.", "tools": "A4-es lapok két oszloppal", "keywords": "kompromisszum, határok, értékek, tárgyalás, önérvényesítés", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mindenki két oszlopot ír: Miben tudok engedni egy közös döntésben (pl. hova menjünk, mikor)? Miben nem (pl. biztonság, értékeim)?\n2. Kiscsoportokban összevetik a listákat: hol különbözünk?\n3. Párban gyakorolják, hogyan lehet kimondani egy „nem engedek” pontot nyugodtan, magyarázattal, támadás nélkül.\n4. Beszéljétek meg: mi történik, ha két ember „nem engedek” pontjai ütköznek?\n5. Feldolgozás: Mi a különbség a makacsság és a határ között? Volt-e, hogy engedtél valamiben, amiben nem kellett volna? Mi az a pont, ahol most határt húzol?", "caution": "A „nem engedek” listát senkinek ne kelljen felolvasnia.", "variants": null}, {"id": "VC09-111", "theme_id": "t09", "name": "Milyen vezető vagyok?", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "11", "description": "Megismerjük a vezetési stílusokat, kipróbáljuk őket egy közös feladatban, és megnézzük, melyik áll közel hozzánk.", "tools": "stíluskártyák (irányító, bevonó, szabadjára engedő, szolgáló vezető), csoportfeladat", "keywords": "vezetés, stílusok, felelősség, csapat, önismeret", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mutasd be röviden a négy stílust.\n2. Kiscsoportok kapnak egy 8 perces feladatot (pl. tervezzenek egy iskolai rendezvényt). Minden körben más vezet, és más stílust húz.\n3. Két-három kör után a csoport megbeszéli, melyik stílusban mi működött.\n4. Mindenki eldönti, melyik stílus áll hozzá legközelebb, és melyiket kellene gyakorolnia.\n5. Feldolgozás: Mikor jó az irányító vezető? Mikor jobb a bevonó? Milyen vezetőt szeretnél magad fölött? Hol vehetnél fel vezető szerepet az iskolában?", "caution": "Figyelj, hogy a csendesebbek is vezethessenek; mondd ki, hogy a csendes vezetés is vezetés.", "variants": null}, {"id": "VC10-111", "theme_id": "t10", "name": "Visszajelzés a Csibének", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "11", "description": "A diákok visszajelzést adnak a Csibe-programról és a patrónusnak: mi segített, mi hiányzott, mit változtatnának.", "tools": "névtelen visszajelző lap, cetlik három színben", "keywords": "visszajelzés, programértékelés, részvétel, fejlesztés, hang", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mondd el: most ti adtok visszajelzést nekem és a programnak. Őszintén, de tisztelettel.\n2. Mindenki névtelenül kitölt három színű cetlit: zöld – ami segített; sárga – ami lehetne jobb; kék – ötlet a jövőre.\n3. Kiscsoportok csoportosítják a cetliket, és összefoglalják a legfontosabbakat.\n4. Meghallgatod a csoportok összefoglalóját, és csak kérdezel, nem védekezel.\n5. Feldolgozás: Milyen volt visszajelzést adni egy felnőttnek? Mit érzel, amikor a véleményed számít? Melyik ötletet próbálnánk ki együtt jövőre?", "caution": "Fogadd nyitottan a kritikát. Mutass példát arra, hogyan lehet visszajelzést védekezés nélkül fogadni.", "variants": null}, {"id": "VC12-111", "theme_id": "t12", "name": "Kik maradnak?", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "11", "description": "Végiggondoljuk, mely barátságaink maradhatnak meg az iskola után, és mit tehetünk azért, hogy a fontos kapcsolatok túléljék a változásokat.", "tools": "A4-es lapok koncentrikus körökkel", "keywords": "barátság, kapcsolati háló, változás, ápolás, jövő", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mindenki rajzol három kört maga köré: legbelső kör – akikre bármikor számíthatok; középső – akikkel jó, de nem ilyen közeli; külső – ismerősök.\n2. Elhelyezi a barátait (lehet csak kezdőbetűvel vagy jellel).\n3. Bejelöli, kikkel szeretné megtartani a kapcsolatot az iskola után.\n4. Kiscsoportok összegyűjtik, mi tartja életben a barátságot távolság és változás mellett.\n5. Feldolgozás: Kik kerültek közelebb az elmúlt években, és kik távolabb? Mit tehetsz most egy fontos barátságért? Hogyan jelzed valakinek, hogy fontos neked?", "caution": "A köröket senkinek ne kelljen megmutatnia.", "variants": null}, {"id": "VC12-112", "theme_id": "t12", "name": "Kiállás", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Mély", "grade": "11", "description": "Felnőttkori helyzeteken (munkahely, egyetem, utca) gyakoroljuk, hogyan álljunk ki valakiért, akit kirekesztenek vagy bántanak, biztonságosan.", "tools": "helyzetkártyák, a „5 D” lista (közvetlen fellépés, figyelemelterelés, segítség hívása, utólagos támogatás, dokumentálás)", "keywords": "kiállás, szemtanú, bátorság, biztonság, szolidaritás", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mutasd be az 5 D-t, és beszéljétek meg, melyik mikor biztonságos.\n2. Kiscsoportok kapnak egy helyzetet (pl. egy kollégát rendszeresen kigúnyolnak; a villamoson valakit zaklatnak; egy csoportchatben valakit lejáratnak).\n3. Mindegyik helyzetre kiválasztanak 2 D-t, és pontosan kitalálják, mit mondanának vagy tennének.\n4. Bemutatják, a többiek kiegészítik.\n5. Feldolgozás: Melyik D a legkönnyebb neked, és melyik a legnehezebb? Miért nem lép közbe sokszor senki? Mit tennél, ha te lennél a bántott fél?", "caution": "Emeld ki: a saját biztonság az első. A közvetlen fellépés nem mindig jó választás.", "variants": null}, {"id": "VC13-111", "theme_id": "t13", "name": "Egy nap offline", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "11", "description": "Megtervezünk egy 24 órás digitális szünetet, előre végiggondoljuk a nehézségeket, és a következő alkalommal megbeszéljük a tapasztalatokat.", "tools": "A4-es lapok", "keywords": "digitális szünet, szokások, függőség, tudatosság, kísérlet", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: mikor voltál utoljára 24 órán át telefon nélkül? Milyen volt?\n2. Mindenki megtervezi a saját offline napját: melyik napon, mit kapcsol ki (lehet csak a közösségi média), mi lesz helyette, kinek szól előre.\n3. Felírja, mitől fél (pl. lemaradok valamiről, unatkozom), és mit tesz, ha jön a késztetés.\n4. Párban egymás „offline-társai” lesznek: a következő alkalom előtt megkérdezik egymást, hogy ment.\n5. Feldolgozás: Mi a legnehezebb az offline napban? Mire számítasz, mit fogsz nyerni? A következő alkalom elején beszéljétek meg: mi derült ki rólad a kísérletből?", "caution": "A kísérlet önkéntes. Ha valakinek a telefon biztonsági okból kell (pl. család), alkalmazkodjatok.", "variants": null}, {"id": "VC13-112", "theme_id": "t13", "name": "MI a tanulásban", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "11", "description": "Megbeszéljük, mikor segít a mesterséges intelligencia a tanulásban, és mikor veszi el tőlünk a tanulást, és közös szabályokat fogalmazunk meg.", "tools": "helyzetkártyák, skála a padlón (1 = segít tanulni, 10 = helyettem dolgozik)", "keywords": "mesterséges intelligencia, tanulás, etika, becsületesség, digitális kompetencia", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Olvass fel helyzeteket (pl. megkérdezem az MI-t, mit jelent egy fogalom; vele íratom meg a fogalmazást; kérem, hogy kérdezzen ki; összefoglaltatom vele a könyvet), és mindenki odaáll a skálán.\n2. Beszéljétek meg az eltéréseket: mi a különbség a segítség és a helyettesítés között?\n3. Kiscsoportok megfogalmaznak 3 saját szabályt az MI tanulási használatára.\n4. Összevetitek a szabályokat, és megbeszélitek, mit gondolnak erről a tanárok.\n5. Feldolgozás: Mit veszítünk, ha mindent az MI csinál meg? Mit nyerünk, ha jól használjuk? Melyik szabályt tartod be ezen a héten?", "caution": "Ne ítélkezz, inkább kérdezz. Az iskolai szabályokat érdemes előre tisztázni.", "variants": null}, {"id": "VC14-111", "theme_id": "t14", "name": "A társaság ereje", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Mély", "grade": "11", "description": "Megnézzük, hogyan hat a társaság a bulikban és a szabadidőben hozott döntéseinkre (alkohol, késő hazaérkezés, kockázat), és hogyan maradjunk hűek magunkhoz.", "tools": "névtelen kérdőív (becslés vs. valóság), helyzetkártyák", "keywords": "kortárs nyomás, bulikultúra, döntés, önazonosság, biztonság", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Névtelen gyorskérdőív: becsüld meg, a csoport hány százaléka gondolja, hogy „egy buliban mindenki iszik”. Aztán: te mit csinálsz egy buliban? (A, B, C válaszok.)\n2. Az eredményt összevetitek a becsléssel, és megbeszélitek a különbséget.\n3. Kiscsoportok helyzeteken gyakorolják, hogyan maradhatnak a buli részei úgy, hogy közben a saját döntésüket hozzák (pl. „Én most vezetek.” „Ma nem.” „Kérek inkább egy üdítőt.”).\n4. Gyűjtsétek össze, mi segít: egy szövetséges, előre eldöntött határ, kilépési terv.\n5. Feldolgozás: Miért éri meg hűnek maradni magadhoz akkor is, ha kilógsz? Mit csinálnál, ha a barátod túlzásba esne? Mi az a határ, amit előre eldöntesz?", "caution": "Ne moralizálj és ne ijesztgess. A biztonság és az önálló döntés legyen a középpontban. Add meg a segítségkérés lehetőségeit.", "variants": null}, {"id": "VC14-112", "theme_id": "t14", "name": "Kisebbségben", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "11", "description": "Gyakoroljuk, hogyan vállaljuk a véleményünket, amikor egyedül vagy kevesen gondoljuk másképp, mint a csoport.", "tools": "vitakérdések, stopper", "keywords": "véleményvállalás, kisebbségi vélemény, bátorság, vita, tisztelet", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Olvass fel állításokat (pl. „A közösségi média jobban árt, mint használ.” „A jegyek motiválnak.”). Mindenki a terem egyik oldalára áll: egyetért vagy nem.\n2. Ha valamelyik oldalon kevesen vannak, ők kapnak elsőként szót, és a többség csak kérdezhet.\n3. Kérdezd meg a kisebbségben lévőket: milyen érzés ott állni?\n4. Gyűjtsétek a táblára, mi segít a kisebbségi véleményt vállalni (érvek, nyugodt hang, egy szövetséges), és mit tehet a többség, hogy meghallgassa.\n5. Feldolgozás: Mikor voltál utoljára kisebbségben egy véleménnyel? Mit tettél? Miért fontos, hogy egy csoportban a kisebbségi vélemény is elhangozzon?", "caution": "Válassz ártalmatlan, de megosztó állításokat. Ne politikai kérdéseket.", "variants": null}, {"id": "VC15-111", "theme_id": "t15", "name": "Érettségi menetrend", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "11", "description": "Elkészítjük a következő másfél év érettségi felkészülésének vázlatát, beépítve a pihenést és a tartalékidőt is.", "tools": "naptár sablon (hónapok), A3-as lapok", "keywords": "érettségi, tervezés, időbeosztás, stresszmegelőzés, pihenés", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Mindenki felírja, milyen tárgyakból és milyen szinten érettségizik.\n2. Visszafelé tervez: mikor vannak a vizsgák, és mi kell addig hónapokra bontva?\n3. Minden hónapba beír pihenőidőt és egy tartalékhetet.\n4. Párban megnézik egymás tervét: reális-e? Hol túl zsúfolt?\n5. Feldolgozás: Mi a legnagyobb kihívás a tervedben? Mi segít, hogy betartsd? Ki az, aki elszámoltathat vagy bátoríthat?", "caution": "A terv legyen rugalmas. Hangsúlyozd: a pihenés a felkészülés része, nem lustaság.", "variants": null}, {"id": "VC16-111", "theme_id": "t16", "name": "Továbbtanulási térkép", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "11", "description": "Feltérképezzük a továbbtanulási lehetőségeket (egyetem, szakképzés, külföld, munka), és mindenki megtervezi, milyen információt gyűjt a következő hónapokban.", "tools": "A3-as lapok, internetelérés (ha van)", "keywords": "továbbtanulás, pályaválasztás, információgyűjtés, lehetőségek, tervezés", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Gyűjtsétek a táblára az összes utat az érettségi után (egyetem itthon, külföld, szakképzés, munka, önkéntes év, saját vállalkozás).\n2. Mindenki kiválaszt 2–3 utat, ami érdekli, és felír minden úthoz 3 kérdést, amire még nem tudja a választ.\n3. Kiscsoportok megosztják, honnan lehet válaszokat szerezni (nyílt nap, felsőbbévesek, pályaorientációs oldalak).\n4. Mindenki kitűz egy információgyűjtő lépést a következő hónapra.\n5. Feldolgozás: Melyik út vonz, és melyiktől tartasz? Mi az, amiről eddig nem is tudtál? Ki az, akit megkérdezel?", "caution": "Ne rangsorold az utakat. Minden út lehet jó választás.", "variants": null}, {"id": "VC17-111", "theme_id": "t17", "name": "Mit hagyunk az utolsó évre?", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "11", "description": "Megtervezzük, mit szeretnénk még együtt átélni az utolsó évben, és mit hagyunk magunk után a csoportként.", "tools": "csomagolópapír, cetlik", "keywords": "utolsó év, tervezés, közösség, örökség, célok", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: mi az, amit 12.-ben mindenképp szeretnétek együtt megcsinálni?\n2. Mindenki felír 2–3 ötletet (közös program, egy hagyomány, valami az iskolának).\n3. A csoport rangsorolja az ötleteket, és kiválaszt 2–3-at.\n4. Mindegyikhez felelőst és első lépést keresnek.\n5. Feldolgozás: Mire szeretnétek, hogy emlékezzenek rólatok az iskolában? Mi lenne a csoport „öröksége”? Mit vállalsz te belőle?", "caution": "Ügyelj, hogy az ötletek megvalósíthatók legyenek, és mindenki hangja számítson.", "variants": null}, {"id": "VC17-112", "theme_id": "t17", "name": "Üzenet a ballagóknak", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "11", "description": "Levelet írunk a 12.-eseknek a ballagásuk előtt: mit tanultunk tőlük, mit kívánunk nekik.", "tools": "levélpapír, borítékok", "keywords": "búcsú, hála, kapcsolat a felsőbbévesekkel, lezárás, hagyomány", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: mit láttatok a 12.-esektől az évek alatt? Mit tanultatok tőlük?\n2. Kiscsoportok vagy egyénileg leveleket írnak a 12.-es csoportnak vagy egy-egy ismert diáknak.\n3. A levelekbe beleírják: egy emléket, egy köszönetet, egy kívánságot.\n4. Megbeszélitek, hogyan juttatjátok el őket (pl. a 12.-esek utolsó Csibéjén).\n5. Feldolgozás: Milyen érzés lesz egy év múlva neked ballagni? Mit szeretnél, hogy a 11.-esek írjanak neked? Mit tanulsz ebből a búcsúból?", "caution": "Egyeztesd a 12.-es patrónussal a levelek átadását.", "variants": null}, {"id": "VC01-121", "theme_id": "t01", "name": "Utolsó évünk megállapodása", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "12", "description": "Az utolsó év elején megállapodunk, mire használjuk a közös időt, és hogyan vigyázunk egymásra az érettségi évében.", "tools": "csomagolópapír, filcek", "keywords": "megállapodás, utolsó év, közösség, érettségi, egymásra figyelés", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: miben lesz más ez az év, mint az eddigiek? (Érettségi, felvételi, búcsú, felnőtté válás.)\n2. Mindenki felír 2 dolgot: mire van szükségem a csoporttól ebben az évben, és mit adok én?\n3. Kiscsoportok a cetlik alapján 3–4 pontos megállapodást írnak (pl. „Nem hasonlítgatjuk a pontszámokat.” „Szólunk, ha valaki eltűnik.”).\n4. A csoport egyesíti a pontokat, és mindenki aláírja.\n5. Feldolgozás: Mi az, amitől félsz ebben az évben? Mi az, amire a legjobban vársz? Hogyan vehetjük észre, ha valaki nincs jól?", "caution": "Tedd a megállapodást láthatóvá, és félévkor nézzétek meg újra.", "variants": null}, {"id": "VC02-121", "theme_id": "t02", "name": "Vegyes érzések a végén", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Közepes", "grade": "12", "description": "Az utolsó év egyszerre izgalmas, félelmetes, szomorú és felszabadító. Ezeket a vegyes érzéseket nevezzük meg és fogadjuk el.", "tools": "érzelemkártyák, cetlik", "keywords": "vegyes érzések, átmenet, búcsú, izgalom, elfogadás", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: milyen érzések jönnek, ha arra gondolsz, hogy egy év múlva már nem jársz ide? Gyűjtsétek a táblára.\n2. Mindenki kiválaszt 3 érzést, ami most egyszerre van benne az év végével kapcsolatban, és felírja, mi kapcsolódik hozzájuk.\n3. Párban megosztják, ami belefér.\n4. Beszéljétek meg: rendben van-e, hogy egyszerre örülünk és szomorúak vagyunk?\n5. Feldolgozás: Melyik érzésről beszélsz a legkevesebbet? Kinek mondanád el? Mi segít, ha túl sok érzés van egyszerre?", "caution": "Lehet, aki a jövő miatt nagyon szorong. Figyelj rá, és ajánld fel a négyszemközti beszélgetést.", "variants": null}, {"id": "VC02-122", "theme_id": "t02", "name": "Az érzelmi mintáim", "type": "Fő gyakorlat", "type_order": 3, "minutes": 45, "depth": "Mély", "grade": "12", "description": "Végiggondoljuk, milyen érzelmi mintákat hoztunk otthonról és a barátainktól, és melyiket visszük tovább a felnőtt életünkbe.", "tools": "A4-es lapok", "keywords": "érzelmi minták, család, önismeret, felnőttkor, változtatás", "source": "Vibe Check – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: hogyan fejezték ki az érzéseiket a felnőttek körülötted, amikor gyerek voltál? (Csak gondolatban.)\n2. Mindenki felírja: Hogyan kezelem a dühöt, a szomorúságot, az örömöt? Honnan tanultam ezt?\n3. Mindegyik mellé odaírja: megtartom vagy változtatnék rajta?\n4. Kiscsoportokban, aki szere
